TELE.push({
  id:'rf-unit', cat:'tele', title:'RF レベル変換（dBm / dBμV / W）',
  sub:'系のインピーダンスを指定して、電力レベルと電圧レベルを相互に変換します。',
  inputs:[
    {k:'val', label:'値', type:'num', def:'60', step:'any'},
    {k:'unit', label:'単位', type:'sel', def:'dBuV', options:[
      {v:'dBm',t:'dBm'},{v:'dBuV',t:'dBμV'},{v:'dBmV',t:'dBmV'},{v:'dBW',t:'dBW'},
      {v:'W',t:'W'},{v:'mW',t:'mW'},{v:'V',t:'V'},{v:'uV',t:'μV'}]},
    {k:'z', label:'系のインピーダンス', type:'sel', def:'75', options:[
      {v:'50',t:'50 Ω（無線・計測）'},{v:'75',t:'75 Ω（映像・共聴・CATV）'},{v:'custom',t:'任意'}]},
    {k:'zc', label:'インピーダンス（任意指定）', type:'num', def:'50', unit:'Ω', show:function(v){return v.z==='custom';}}
  ],
  compute:function(v){
    var Z=(v.z==='custom')?reqPos(v.zc,'インピーダンス'):Number(v.z);
    var x=req(v.val,'値'), steps=[], V, P;
    if(v.unit==='dBm'){ P=1e-3*Math.pow(10,x/10);
      steps.push({l:'dBm を電力に戻す', f:'P = 1 mW × 10^{(L/10)}', s:'P = 0.001 × 10^{('+fx(x)+'/10)}', r:'P = '+fx(P,5)+' W'});
    } else if(v.unit==='dBW'){ P=Math.pow(10,x/10);
      steps.push({l:'dBW を電力に戻す', f:'P = 1 W × 10^{(L/10)}', s:'P = 10^{('+fx(x)+'/10)}', r:'P = '+fx(P,5)+' W'});
    } else if(v.unit==='W'){ P=x; }
    else if(v.unit==='mW'){ P=x/1000; }
    else if(v.unit==='dBuV'){ V=1e-6*Math.pow(10,x/20);
      steps.push({l:'dBμV を電圧に戻す', f:'V = 1 μV × 10^{(L/20)}', s:'V = 10⁻⁶ × 10^{('+fx(x)+'/20)}', r:'V = '+fx(V,5)+' V'});
    } else if(v.unit==='dBmV'){ V=1e-3*Math.pow(10,x/20);
      steps.push({l:'dBmV を電圧に戻す', f:'V = 1 mV × 10^{(L/20)}', s:'V = 0.001 × 10^{('+fx(x)+'/20)}', r:'V = '+fx(V,5)+' V'});
    } else if(v.unit==='V'){ V=x; }
    else if(v.unit==='uV'){ V=x*1e-6; }
    if(V===undefined){
      V=Math.sqrt(P*Z);
      steps.push({l:'電力から電圧を求める', f:'V = √(P × Z)', s:'V = √('+fx(P,5)+' × '+fx(Z)+')', r:'V = '+fx(V,5)+' V'});
    } else {
      P=V*V/Z;
      steps.push({l:'電圧から電力を求める', f:'P = V² / Z', s:'P = '+fx(V,5)+'² / '+fx(Z), r:'P = '+fx(P,5)+' W'});
    }
    if(P<=0||V<=0) throw new Error('0 以下の値は dB に変換できません。');
    var dbm=10*LOG10(P/1e-3), dbw=10*LOG10(P), dbuv=20*LOG10(V/1e-6), dbmv=20*LOG10(V/1e-3);
    steps.push({l:'dBm に換算', f:'L_{dBm} = 10 log_{10}(P / 1 mW)', s:'L_{dBm} = 10 log_{10}('+fx(P*1000,5)+')', r:'L_{dBm} = '+fd(dbm,2)+' dBm'});
    steps.push({l:'dBμV に換算', f:'L_{dBμV} = 20 log_{10}(V / 1 μV)', s:'L_{dBμV} = 20 log_{10}('+fx(V/1e-6,5)+')', r:'L_{dBμV} = '+fd(dbuv,2)+' dBμV'});
    var k=dbuv-dbm;
    steps.push({l:'dBm と dBμV の関係（この系での換算定数）', f:'L_{dBμV} = L_{dBm} + 10 log_{10}(Z) + 90',
      s:'定数 = 10 log_{10}('+fx(Z)+') + 90 = '+fd(10*LOG10(Z)+90,2), r:'L_{dBμV} = L_{dBm} + '+fd(k,2),
      n:'50 Ω 系では +107.0、75 Ω 系では +108.75 が定数になります。'});
    return {
      head:[
        {l:'dBm', v:fd(dbm,2), u:'dBm'},
        {l:'dBμV', v:fd(dbuv,2), u:'dBμV'},
        {l:'dBmV', v:fd(dbmv,2), u:'dBmV'},
        {l:'dBW', v:fd(dbw,2), u:'dBW'},
        {l:'電圧', v:(V>=1e-3?fx(V,5)+' V':fx(V*1e6,5)+' μV'), u:''},
        {l:'電力', v:(P>=1e-3?fx(P*1000,5)+' mW':fx(P*1e6,5)+' μW'), u:''}
      ],
      steps:steps,
      notes:[
        '地上デジタル放送の受信レベルは 75 Ω 系の dBμV で表します。受信機入力の目安は 47〜81 dBμV（推奨 60〜70 dBμV）です。',
        'BS/CS-IF は 47〜81 dBμV（推奨 55〜75 dBμV）。ブースタの利得と分配損失を合わせて設計します。',
        'dBμV と dBm の換算定数はインピーダンスに依存します。50 Ω 系の測定器で 75 Ω 系を測る際は整合に注意してください。',
        '換算式 L[dBμV] = L[dBm] + 10 log₁₀(Z) + 90 は P = V²/Z から導けます（50 Ω → +106.99、75 Ω → +108.75）。ハードコードした定数ではなく、入力したインピーダンスから毎回計算しています。'
      ]
    };
  }
});

TELE.push({
  id:'los-fresnel', cat:'tele', title:'見通し距離・フレネルゾーン',
  sub:'アンテナ高から電波の見通し距離を、周波数と距離から第1フレネルゾーン半径と必要クリアランスを求めます。',
  inputs:[
    {k:'h1', label:'アンテナ高（A側）', type:'num', def:'30', unit:'m', step:'any'},
    {k:'h2', label:'アンテナ高（B側）', type:'num', def:'15', unit:'m', step:'any'},
    {k:'kf', label:'等価地球半径係数 k', type:'sel', def:'1.3333', options:[
      {v:'1.3333',t:'k = 4/3（標準大気）'},{v:'1',t:'k = 1（幾何学的見通し）'},{v:'0.7',t:'k = 0.7（悪条件・サブリフラクション）'}]},
    {k:'f', label:'周波数', type:'num', def:'5.8', unit:'GHz', step:'any'},
    {k:'d', label:'実際の伝送距離', type:'num', def:'10', unit:'km', step:'any'},
    {k:'x', label:'障害物までの距離（A側から）', type:'num', def:'4', unit:'km', step:'any',
     hint:'見通し線上の障害物位置。中点なら伝送距離の半分を入力します。'}
  ],
  compute:function(v){
    var h1=reqPos(v.h1,'アンテナ高（A側）'), h2=reqPos(v.h2,'アンテナ高（B側）');

    var steps=[];
    var coef=3.57*Math.sqrt(k);
    var dlos=coef*(Math.sqrt(h1)+Math.sqrt(h2));
    steps.push({l:'見通し距離を求める', f:'d_{見通し} = 3.57 √k × ( √h_{1} + √h_{2} )  [km, m]',
      s:'d = 3.57 × √'+fd(k,4)+' × ( √'+fx(h1)+' + √'+fx(h2)+' ) = '+fd(coef,3)+' × ('+fd(Math.sqrt(h1),3)+' + '+fd(Math.sqrt(h2),3)+' )',
      r:'d_{見通し} = '+fd(dlos,2)+' km',
      n:'k = 4/3 のとき係数は 4.12 になります。大気の屈折で電波は地表側にわずかに曲がるため、幾何学的な見通しより遠くまで届きます。'});
    var ok=d<=dlos;
    steps.push({l:'伝送距離との照合', f:'伝送距離 ≤ 見通し距離', s:fx(d)+' km  '+(ok?'≤':'>')+'  '+fd(dlos,2)+' km',
      r:ok?'OK（見通し内）':'NG（見通し外 — アンテナを高くするか中継が必要）'});
    var x=opt(v.x,d/2);
    if(x<=0||x>=d) throw new Error('障害物までの距離は 0 と伝送距離の間で指定してください。');
    var d1=x, d2=d-x;
    var r1=17.32*Math.sqrt(d1*d2/(f*d));
    steps.push({l:'第1フレネルゾーン半径', f:'r_{1} = 17.32 √( d_{1} d_{2} / ( f × d ) )  [m; d は km, f は GHz]',
      s:'r_{1} = 17.32 × √( '+fx(d1)+' × '+fx(d2)+' / ( '+fx(f)+' × '+fx(d)+' ) )', r:'r_{1} = '+fd(r1,2)+' m'});
    var rMid=17.32*Math.sqrt(d/(4*f));
    steps.push({l:'（参考）中点での半径', f:'r_{1,中点} = 17.32 √( d / (4 f) )',
      s:'r_{1,中点} = 17.32 × √( '+fx(d)+' / (4 × '+fx(f)+') )', r:'r_{1,中点} = '+fd(rMid,2)+' m',
      n:'フレネルゾーンは中点で最も太くなります。周波数が低いほど、距離が長いほど太くなります。'});
    var bulge=d1*d2/(12.75*k);
    steps.push({l:'地球の膨らみ（等価地球半径による見かけの盛り上がり）', f:'h_{bulge} = d_{1} × d_{2} / (12.75 k)  [m; d は km]',
      s:'h_{bulge} = '+fx(d1)+' × '+fx(d2)+' / (12.75 × '+fd(k,4)+')', r:'h_{bulge} = '+fd(bulge,2)+' m'});
    var need=0.6*r1+bulge;
    steps.push({l:'必要クリアランス（60% ルール）', f:'クリアランス = 0.6 r_{1} + h_{bulge}',
      s:'クリアランス = 0.6 × '+fd(r1,2)+' + '+fd(bulge,2), r:'クリアランス = '+fd(need,2)+' m',
      n:'第1フレネルゾーンの 60% 以上が空いていれば、自由空間伝搬とほぼ同等の受信レベルが得られます。100% 確保できるのが理想です。'});
    var lam=C_LIGHT/(f*1e9), fsl=32.44+20*LOG10(d)+20*LOG10(f*1000);
    steps.push({l:'（参考）自由空間伝搬損失', f:'L_{fs} = 32.44 + 20 log_{10}(d[km]) + 20 log_{10}(f[MHz])',
      s:'L_{fs} = 32.44 + 20 log_{10}('+fx(d)+') + 20 log_{10}('+fx(f*1000)+')', r:'L_{fs} = '+fd(fsl,2)+' dB'});
    return {
      head:[
        {l:'見通し距離', v:fd(dlos,2), u:'km', tone:ok?'ok':'bad', n:'伝送距離 '+fx(d)+' km に対して'+(ok?'十分':'不足')},
        {l:'第1フレネル半径', v:fd(r1,2), u:'m', n:'A側から '+fx(x)+' km の地点'},
        {l:'必要クリアランス', v:fd(need,2), u:'m', n:'60% ルール＋地球膨らみ'},
        {l:'地球の膨らみ', v:fd(bulge,2), u:'m'},
        {l:'自由空間損失', v:fd(fsl,1), u:'dB', n:'波長 '+fd(lam*100,2)+' cm'}
      ],
      steps:steps,
      notes:[
        '実際の設計では、見通し線の高さから地形・建物の標高を引いた値が必要クリアランス以上であることを確認します。',
        '樹木は季節で高さが変わり、電波も吸収します。将来の成長を見込んで余裕をとってください。',
        '降雨減衰は 10 GHz を超えると無視できません。5.8 GHz 帯では通常軽微です。',
        '無線局の開設には免許または登録が必要な場合があります。周波数帯ごとの制度を確認してください。',
        '係数の根拠（単位に注意）：見通し距離 3.57√(k·h) は d = √(2 k R_e h)（地球半径 R_e = 6371 km、h は m、d は km）から。第1フレネル半径 17.32√(d₁d₂/(f·d)) は r = √(λ d₁d₂/d) に λ = 0.3/f[GHz] m を代入したもの（d は km、r は m）。地球の膨らみ d₁d₂/(12.75 k) は d₁d₂/(2 k R_e)（d は km、h は m）から。自由空間損失 32.44 + 20log d[km] + 20log f[MHz] は ITU-R P.525 の標準形です。'
      ]
    };
  }
});

/* pse: PSE 出力電力 / pd: 規格が保証する PD 受電電力 / vmin: PSE 出力電圧の規格下限
   / pdmin: PD の動作下限電圧 / pairs: 給電に使うペア数。
   出典: IEEE 802.3-2022 Clause 33（Type 1/2）および Clause 145（Type 3/4）。
   ※ Type 4 の PSE 出力電圧下限は 50 V ではなく 52 V、PD 動作下限は 41.1 V（旧版は 50 V / 42.5 V）。 */
var POE_STD = [
  {v:'af', t:'IEEE 802.3af（Type 1 / PoE）',      pse:15.4, pd:12.95, vmin:44, pdmin:37.0, pairs:2},
  {v:'at', t:'IEEE 802.3at（Type 2 / PoE+）',     pse:30.0, pd:25.5,  vmin:50, pdmin:42.5, pairs:2},
  {v:'bt3',t:'IEEE 802.3bt Type 3（PoE++ / 60W）',pse:60.0, pd:51.0,  vmin:50, pdmin:42.5, pairs:4},
  {v:'bt4',t:'IEEE 802.3bt Type 4（PoE++ / 90W）',pse:90.0, pd:71.3,  vmin:52, pdmin:41.1, pairs:4}
];

TELE.push({
  id:'poe', cat:'tele', title:'PoE 電力予算',
  sub:'ケーブル抵抗による損失を計算し、端末が受け取れる電力とスイッチ全体の給電能力を確認します。',
  inputs:[
    {k:'std', label:'PoE 規格', type:'sel', def:'at', options:POE_STD.map(function(x){return {v:x.v,t:x.t};})},
    {k:'len', label:'ケーブル長', type:'num', def:'90', unit:'m'},
    {k:'awg', label:'導体サイズ', type:'sel', def:'0.0842', options:[
      {v:'0.0668',t:'23 AWG（0.258 mm²・0.0668 Ω/m）'},
      {v:'0.0842',t:'24 AWG（0.205 mm²・0.0842 Ω/m）'},
      {v:'0.1336',t:'26 AWG（0.129 mm²・0.1336 Ω/m）— パッチコード等'}]},
    {k:'pdneed', label:'端末の消費電力', type:'num', def:'20', unit:'W', step:'any'},
    {k:'nport', label:'給電ポート数', type:'num', def:'24'},
    {k:'budget', label:'スイッチの給電総容量', type:'num', def:'370', unit:'W', step:'any'}
  ],
  compute:function(v){
    var std=null;
    for(var i=0;i<POE_STD.length;i++) if(POE_STD[i].v===v.std) std=POE_STD[i];
    if(!std) std=POE_STD[1];
    var L=reqPos(v.len,'ケーブル長'), rm=reqPos(v.awg,'導体サイズ');
    var steps=[];
    var cpp=std.pairs; // 極性あたりの導体数 = 使用ペア数（2ペアなら2導体、4ペアなら4導体）
    var R=2*L*rm/cpp;
    steps.push({l:'ループ抵抗を求める', f:'R_{loop} = 2 × L × R_{m} / (極性あたりの導体数)',
      s:'R_{loop} = 2 × '+fx(L)+' m × '+fx(rm)+' Ω/m / '+cpp, r:'R_{loop} = '+fd(R,3)+' Ω',
      n:std.pairs===2?'2ペア給電（Alt A / Alt B）では、往路1ペア（2導体並列）・復路1ペア（2導体並列）で電流を流します。':'4ペア給電では往復それぞれ2ペア（4導体並列）を使うため、ループ抵抗は2ペア給電の半分になります。'});
    var I=std.pse/std.vmin;
    steps.push({l:'給電電流（最悪条件＝最低電圧時）', f:'I = P_{PSE} / V_{PSE(min)}',
      s:'I = '+fx(std.pse)+' W / '+fx(std.vmin)+' V', r:'I = '+fd(I,3)+' A',
      n:'PSE の出力電圧が規格下限のとき電流が最大になり、ケーブル損失も最大になります。'});
    var pLoss=I*I*R;
    steps.push({l:'ケーブルで失われる電力', f:'P_{損失} = I² × R_{loop}',
      s:'P_{損失} = '+fd(I,3)+'² × '+fd(R,3), r:'P_{損失} = '+fd(pLoss,3)+' W'});
    var pAvail=std.pse-pLoss;
    steps.push({l:'端末に届く電力', f:'P_{PD} = P_{PSE} − P_{損失}',
      s:'P_{PD} = '+fx(std.pse)+' − '+fd(pLoss,3), r:'P_{PD} = '+fd(pAvail,2)+' W'});
    steps.push({l:'規格の保証値との照合', f:'規格は 100 m 時に P_{PD(規格)} を保証する',
      s:'計算値 '+fd(pAvail,2)+' W  vs  規格保証 '+fx(std.pd)+' W',
      r:pAvail>=std.pd?'計算値が規格保証値を上回っています（余裕あり）':'計算値が規格保証値を下回ります（ケーブル品質を確認）'});
    var need=req(v.pdneed,'端末の消費電力');
    var ok=need<=pAvail && need<=std.pd;
    steps.push({l:'端末の消費電力との照合', f:'P_{端末} ≤ P_{PD}',
      s:fx(need)+' W  '+(need<=pAvail?'≤':'>')+'  '+fd(pAvail,2)+' W', r:ok?'OK（給電可能）':'NG（電力不足 — 上位規格または短いケーブルが必要）'});
    var vdrop=I*R, vpd=std.vmin-vdrop;
    steps.push({l:'端末での電圧', f:'V_{PD} = V_{PSE(min)} − I × R_{loop}',
      s:'V_{PD} = '+fx(std.vmin)+' − '+fd(I,3)+' × '+fd(R,3), r:'V_{PD} = '+fd(vpd,2)+' V',
      n:'この規格の PD 動作下限は '+fx(std.pdmin)+' V です'
        +(vpd>=std.pdmin?'（余裕 '+fd(vpd-std.pdmin,2)+' V）。':'（'+fd(std.pdmin-vpd,2)+' V 不足）。')
        +' 規格上の下限は Type 1 = 37.0 V、Type 2 / Type 3 = 42.5 V、Type 4 = 41.1 V（IEEE 802.3-2022）。'});
    var np=Math.round(reqPos(v.nport,'給電ポート数')), bud=reqPos(v.budget,'スイッチの給電総容量');
    var totalNeed=np*need, bok=totalNeed<=bud;
    steps.push({l:'スイッチ全体の給電容量との照合', f:'P_{総需要} = 端末電力 × ポート数',
      s:'P_{総需要} = '+fx(need)+' × '+np+' = '+fd(totalNeed,1)+' W  vs  容量 '+fx(bud)+' W',
      r:bok?'OK（'+fd(totalNeed/bud*100,1)+'% の使用率）':'NG（容量オーバー — '+Math.floor(bud/need)+' 台までが上限）'});
    var maxPort=Math.floor(bud/need);
    var trows=[], lens=[10,30,50,70,90,100];
    for(var j=0;j<lens.length;j++){
      var rj=2*lens[j]*rm/cpp, plj=I*I*rj, paj=std.pse-plj;
      trows.push({cells:[fx(lens[j])+' m', fd(rj,2)+' Ω', fd(plj,2)+' W', fd(paj,2)+' W'], tone:paj>=need?'ok':'bad'});
    }
    return {
      head:[
        {l:'端末に届く電力', v:fd(pAvail,1), u:'W', tone:ok?'ok':'bad', n:'端末の消費 '+fx(need)+' W に対して'+(ok?'足りる':'不足')},

/* 複数本を一直線に等間隔 s で打設したときの合成接地抵抗（相互抵抗法）
     R_n = ( n·R_1 + 2 Σ_{k=1..n-1} (n−k)·R_m(k·s) ) / n² ,   R_m(x) = ρ / (2πx)
   R_m は離れた電極どうしの相互抵抗を点電源で近似したもの（間隔 s が電極長 L 以上なら妥当）。
   考え方の出典: IEEE Std 80「Guide for Safety in AC Substation Grounding」の相互抵抗の扱い。
   ※ 旧版は (a) 本文＝低減係数の参照表、(b) 下部の概算表＝R_1/n×(1+0.2 ln n) と
      別々の式を使っており両者が一致しなかった。この関数に一本化して解消した。
      なお本式は旧参照表（n=2,3,4,6,10 × 間隔/電極長 1〜4）の値を数 % 以内で再現する。 */
function groundParallelR(R1, rho, n, sp){
  if(n <= 1) return R1;
  var sum = 0;
  for(var k = 1; k < n; k++) sum += (n - k) * rho / (2 * Math.PI * k * sp);
  return (n * R1 + 2 * sum) / (n * n);
}

TELE.push({
  id:'ground', cat:'tele', title:'接地抵抗（棒状電極）',
  sub:'大地抵抗率と電極寸法から接地抵抗を計算し、複数本打設時の低減効果を求めます。',
  inputs:[
    {k:'rho', label:'大地抵抗率 ρ', type:'num', def:'100', unit:'Ω·m', step:'any',
     hint:'目安：湿った粘土質 10〜100、砂質土 100〜1000、礫・岩盤 1000 以上。実測が原則です。'},
    {k:'len', label:'電極長', type:'num', def:'1.5', unit:'m', step:'any',
     hint:'一般的な接地棒は 14φ × 1500 mm。連結して深く打つほど効果的です。'},
    {k:'dia', label:'電極直径', type:'num', def:'14', unit:'mm', step:'any'},
    {k:'n', label:'打設本数', type:'num', def:'1'},
    {k:'sp', label:'電極の間隔', type:'num', def:'3', unit:'m', step:'any', show:function(v){return Number(v.n)>1;},
     hint:'電極長の 2 倍以上離すと干渉が減ります。近すぎると期待した低減効果が得られません。'},
    {k:'target', label:'目標接地抵抗', type:'sel', def:'100', options:[
      {v:'10',t:'A種 / C種：10 Ω 以下'},{v:'100',t:'D種：100 Ω 以下'},
      {v:'500',t:'C種・D種（0.5秒以内に自動遮断する装置あり）：500 Ω 以下'},{v:'5',t:'通信・雷保護：5 Ω 以下'}]}
  ],
  compute:function(v){
    var rho=reqPos(v.rho,'大地抵抗率'), L=reqPos(v.len,'電極長'), dmm=reqPos(v.dia,'電極直径');
    var d=dmm/1000, steps=[];
    if(8*L/d<=Math.E) throw new Error('電極が太すぎるか短すぎます。この式（細長い棒の近似）は適用できません。');
    var R1=rho/(2*Math.PI*L)*(Math.log(8*L/d)-1);
    steps.push({l:'棒状電極1本の接地抵抗', f:'R = ρ / (2π L) × ( ln(8L / d) − 1 )',
      s:'R = '+fx(rho)+' / (2π × '+fx(L)+') × ( ln(8 × '+fx(L)+' / '+fx(d,4)+') − 1 )\n  = '+fd(rho/(2*Math.PI*L),4)+' × ( '+fd(Math.log(8*L/d),4)+' − 1 )',
      r:'R = '+fd(R1,2)+' Ω',
      n:'接地抵抗は電極長 L に反比例的に効きます。直径 d は対数の中にあるため、太くしてもあまり下がりません。長く（深く）打つほうが効果的です。'});
    var n=Math.round(reqPos(v.n,'打設本数'));
    var sp=opt(v.sp, 2*L);
    if(!(sp>0)) sp=2*L;
    var Rn=R1, eta=1;
    if(n>1){
      sp=reqPos(v.sp,'電極の間隔');
      var ratio=sp/L;
      Rn=groundParallelR(R1,rho,n,sp);
      eta=Rn/(R1/n);
      steps.push({l:'複数本打設による低減（相互抵抗法）',
        f:'R_{n} = ( n R_{1} + 2 Σ (n−k) R_{m}(k s) ) / n²,   R_{m}(x) = ρ / (2π x)',
        s:'間隔 s = '+fx(sp)+' m（電極長の '+fd(ratio,2)+' 倍）,  R_{m}(s) = '+fx(rho)+' / (2π × '+fx(sp)+') = '+fd(rho/(2*Math.PI*sp),3)+' Ω\n'
          +'単純な 1/n（= '+fd(R1/n,2)+' Ω）に対する割増（合成係数） = '+fd(eta,3),
        r:'R_{n} = '+fd(Rn,2)+' Ω',
        n:'電極が互いに近いと電流の流れが干渉し、単純に 1/n にはなりません。間隔を電極長の 2〜3 倍とるのが目安です。'
          +(ratio<1?'　※ 間隔が電極長より短く、この近似の適用範囲外です。実測してください。':'')});
    }
    var tg=Number(v.target), ok=Rn<=tg;
    steps.push({l:'目標値との照合', f:'R_{n} ≤ 目標値', s:fd(Rn,2)+' Ω  '+(ok?'≤':'>')+'  '+fx(tg)+' Ω',
      r:ok?'OK（目標を満たします）':'NG（本数を増やす、深く打つ、接地抵抗低減剤の使用などを検討）'});
    var needN=0;
    for(var q2=1;q2<=200;q2++){ if(groundParallelR(R1,rho,q2,sp)<=tg){ needN=q2; break; } }
    if(!ok){
      steps.push({l:'目標達成に必要な本数', f:'R_{n} ≤ R_{目標} となる最小の n を上の式で解く',
        s:'間隔 '+fx(sp)+' m のまま本数を増やしていったときの解',
        r:needN?('n = '+needN+' 本（このとき R_{n} = '+fd(groundParallelR(R1,rho,needN,sp),2)+' Ω）')
               :'200 本でも目標に届きません（接地抵抗低減剤・深打ち・網状接地など別手段が必要）'});
    }
    var trows=[], ns=[1,2,3,4,6,8,10,16,20];
    for(var q=0;q<ns.length;q++){
      var rq=groundParallelR(R1,rho,ns[q],sp);
      trows.push({cells:[ns[q]+' 本', fd(rq,2)+' Ω', (ns[q]>1?fd(rq/(R1/ns[q]),3):'—')], tone:rq<=tg?'ok':'bad'});
    }
    return {
      head:[
        {l:(n>1?n+' 本での接地抵抗':'接地抵抗'), v:fd(Rn,1), u:'Ω', tone:ok?'ok':'bad', n:'目標 '+fx(tg)+' Ω に対して'+(ok?'合格':'不足')},
        {l:'電極1本あたり', v:fd(R1,1), u:'Ω'},
        (n>1?{l:'合成係数', v:fd(eta,3), u:'', n:'干渉による割増'}:null),
        {l:'大地抵抗率', v:fx(rho), u:'Ω·m'}
      ].filter(Boolean),
      steps:steps,
      tables:[{title:'本数別の概算（間隔 '+fx(sp)+' m ＝ 電極長の '+fd(sp/L,2)+' 倍、一直線配置）',
               head:['本数','接地抵抗','合成係数'], rows2:trows}],
      notes:[
        '大地抵抗率は季節・降雨で大きく変動します（乾期は数倍になることも）。設計は最悪条件で行い、施工後に必ず実測してください。',
        '実測は接地抵抗計（3電極法）で行います。補助電極は被測定電極から 10 m 以上離して直線上に配置します。',
        '電技解釈第17条：A種10Ω、B種は変圧器高圧側の地絡電流による、C種10Ω（低圧電路を0.5秒以内に自動遮断する装置を施設する場合は500Ω）、D種100Ω（同500Ω）。共立電気計器の技術資料でも同じ基準値を確認。',
        '単体電極の式 R = ρ/(2πL)×(ln(8L/d)−1) は、細長い棒状電極に対する Dwight の式です。L ≫ d が前提で、太く短い電極には適用できません。',
        '通信設備・雷保護では等電位ボンディングが重要です。接地抵抗値だけでなく、機器間の電位差を抑える設計にしてください。',
        '本文の計算も下の表も同じ相互抵抗法（R_m = ρ/2πx の点電源近似、一直線・等間隔配置）で計算しています。環状・格子状に配置する場合や間隔が電極長より短い場合は誤差が大きくなります。',
        '複数本打設の低減効果は近似計算です。詳細検討には実測または専用解析（IEEE Std 80 等）を用いてください。'
      ]
    };
  }
});

var COMMON = [];

COMMON.push({
  id:'ohm', cat:'common', title:'オームの法則（V / I / R / P）',
  sub:'4つのうち任意の2つを入力すると、残り2つを求めて計算の道筋を示します。',
  inputs:[
    {k:'v', label:'電圧 V', type:'num', def:'100', unit:'V', step:'any', hint:'不要な欄は空欄にしてください。'},
    {k:'i', label:'電流 I', type:'num', def:'', unit:'A', step:'any'},
    {k:'r', label:'抵抗 R', type:'num', def:'50', unit:'Ω', step:'any'},
    {k:'p', label:'電力 P', type:'num', def:'', unit:'W', step:'any'}
  ],
  compute:function(v){
    var V=opt(v.v,NaN), I=opt(v.i,NaN), R=opt(v.r,NaN), P=opt(v.p,NaN);
    var has=[isFinite(V),isFinite(I),isFinite(R),isFinite(P)];
    var cnt=has.filter(Boolean).length;
    if(cnt<2) throw new Error('4つのうち2つを入力してください（現在 '+cnt+' つ）。');
    var steps=[], known=[];
    if(isFinite(V)) known.push('V = '+fx(V)+' V');
    if(isFinite(I)) known.push('I = '+fx(I)+' A');
    if(isFinite(R)) known.push('R = '+fx(R)+' Ω');
    if(isFinite(P)) known.push('P = '+fx(P)+' W');
    steps.push({l:'既知の値', f:'オームの法則：V = I × R,   電力：P = V × I', s:known.join(',  '), r:'ここから残りを求めます'});
    function put(sym,val,f,s){
      steps.push({l:sym+' を求める', f:f, s:s, r:sym+' = '+fx(val,5)});
    }
    if(isFinite(V)&&isFinite(I)){
      if(!isFinite(R)){ R=(I!==0)?V/I:Infinity; put('R',R,'R = V / I','R = '+fx(V)+' / '+fx(I)); }
      if(!isFinite(P)){ P=V*I; put('P',P,'P = V × I','P = '+fx(V)+' × '+fx(I)); }
    } else if(isFinite(V)&&isFinite(R)){
      if(R===0) throw new Error('抵抗 0 Ω では電流が定義できません。');
      if(!isFinite(I)){ I=V/R; put('I',I,'I = V / R','I = '+fx(V)+' / '+fx(R)); }
      if(!isFinite(P)){ P=V*V/R; put('P',P,'P = V² / R','P = '+fx(V)+'² / '+fx(R)); }
    } else if(isFinite(V)&&isFinite(P)){
      if(V===0) throw new Error('電圧 0 V では電流が定義できません。');
      if(!isFinite(I)){ I=P/V; put('I',I,'I = P / V','I = '+fx(P)+' / '+fx(V)); }
      if(!isFinite(R)){ R=V*V/P; put('R',R,'R = V² / P','R = '+fx(V)+'² / '+fx(P)); }
    } else if(isFinite(I)&&isFinite(R)){
      if(!isFinite(V)){ V=I*R; put('V',V,'V = I × R','V = '+fx(I)+' × '+fx(R)); }
      if(!isFinite(P)){ P=I*I*R; put('P',P,'P = I² × R','P = '+fx(I)+'² × '+fx(R)); }
    } else if(isFinite(I)&&isFinite(P)){
      if(I===0) throw new Error('電流 0 A では電圧が定義できません。');
      if(!isFinite(V)){ V=P/I; put('V',V,'V = P / I','V = '+fx(P)+' / '+fx(I)); }
      if(!isFinite(R)){ R=P/(I*I); put('R',R,'R = P / I²','R = '+fx(P)+' / '+fx(I)+'²'); }
    } else if(isFinite(R)&&isFinite(P)){
      if(R<=0) throw new Error('抵抗は 0 より大きい値を入力してください。');
      if(P<0) throw new Error('電力は負にできません。');
      if(!isFinite(V)){ V=Math.sqrt(P*R); put('V',V,'V = √(P × R)','V = √('+fx(P)+' × '+fx(R)+')'); }
      if(!isFinite(I)){ I=Math.sqrt(P/R); put('I',I,'I = √(P / R)','I = √('+fx(P)+' / '+fx(R)+')'); }
    }
    return {
      head:[
        {l:'電圧 V', v:fx(V,5), u:'V'},
        {l:'電流 I', v:fx(I,5), u:'A'},
        {l:'抵抗 R', v:fx(R,5), u:'Ω'},
        {l:'電力 P', v:fx(P,5), u:'W'}
      ],
      steps:steps,
      tables:[{title:'関係式の一覧', head:['求めたい値','V と I','V と R','I と R','P との関係'], rows:[
        ['V','—','—','V = I R','V = P/I, V = √(PR)'],
        ['I','—','I = V/R','—','I = P/V, I = √(P/R)'],
        ['R','R = V/I','—','—','R = V²/P, R = P/I²'],
        ['P','P = V I','P = V²/R','P = I²R','—']
      ]}],
      notes:[
        '交流回路では、リアクタンスがある場合 P = V × I × cosφ（力率）となります。この計算は直流または純抵抗負荷を前提としています。',
        '電線や機器の定格を確認する際は、連続使用時の発熱も考慮してください。'
      ]
    };
  }
});

/* ============================================================
   映像系 共通ヘルパ

var VIDEO = [];
var IN2M = 0.0254;
var FL_PER_NIT = 1/3.426259;   // cd/m² → fL
var ARCMIN = (1/60)*(Math.PI/180);  // 1分角 [rad]

var ASPECTS = [
  {v:'16:9',   t:'16:9（HD / UHD）',        a:16,   b:9},
  {v:'16:10',  t:'16:10（WUXGA）',           a:16,   b:10},
  {v:'4:3',    t:'4:3（XGA）',               a:4,    b:3},
  {v:'1.90:1', t:'1.90:1（DCI フル）',       a:1.90, b:1},
  {v:'1.85:1', t:'1.85:1（ビスタ）',         a:1.85, b:1},
  {v:'2.35:1', t:'2.35:1（シネマスコープ）', a:2.35, b:1},
  {v:'2.39:1', t:'2.39:1（DCI スコープ）',   a:2.39, b:1},
  {v:'21:9',   t:'21:9（ウルトラワイド）',   a:21,   b:9},
  {v:'1:1',    t:'1:1（正方形）',            a:1,    b:1},
  {v:'custom', t:'任意（横 : 縦 を指定）',   a:16,   b:9}
];
function aspectOpts(){ return ASPECTS.map(function(x){ return {v:x.v, t:x.t}; }); }
function aspectOf(v, cw, ch){
  if(v === 'custom') return {a:reqPos(cw,'アスペクト比（横）'), b:reqPos(ch,'アスペクト比（縦）'), name:fx(cw)+':'+fx(ch)};
  for(var i=0;i<ASPECTS.length;i++) if(ASPECTS[i].v === v) return {a:ASPECTS[i].a, b:ASPECTS[i].b, name:ASPECTS[i].v};
  return {a:16, b:9, name:'16:9'};
}
var SIZE_BASES = [
  {v:'diag_in',  t:'対角（インチ）'},
  {v:'diag_m',   t:'対角（m）'},
  {v:'width_m',  t:'画面幅（m）'},
  {v:'height_m', t:'画面高（m）'}
];
/** 基準寸法とアスペクト比から画面の幅・高さ・対角・面積を求める（steps を渡すと導出も追記） */
function screenDims(base, val, asp, steps){
  var a = asp.a, b = asp.b, r = Math.sqrt(a*a + b*b), W, H;
  if(steps) steps.push({l:'アスペクト比から対角の比を求める', f:'r = √(a² + b²)',
    s:'r = √('+fx(a)+'² + '+fx(b)+'²)', r:'r = '+fx(r,5),
    n:'アスペクト比 '+asp.name+' の対角は、幅を a、高さを b としたとき √(a²+b²) の比になります。'});
  if(base === 'diag_in' || base === 'diag_m'){
    var Dm = (base === 'diag_in') ? val*IN2M : val;
    if(base === 'diag_in' && steps) steps.push({l:'対角をインチから m に換算', f:'D = 対角[inch] × 0.0254',
      s:'D = '+fx(val)+' × 0.0254', r:'D = '+fx(Dm,5)+' m'});
    W = Dm*a/r; H = Dm*b/r;
    if(steps) steps.push({l:'対角から幅と高さを求める', f:'W = D × a / r,   H = D × b / r',
      s:'W = '+fx(Dm,5)+' × '+fx(a)+' / '+fx(r,5)+',   H = '+fx(Dm,5)+' × '+fx(b)+' / '+fx(r,5),
      r:'W = '+fx(W,5)+' m,  H = '+fx(H,5)+' m'});
  } else if(base === 'width_m'){
    W = val; H = W*b/a;
    if(steps) steps.push({l:'幅から高さを求める', f:'H = W × b / a',
      s:'H = '+fx(W,5)+' × '+fx(b)+' / '+fx(a), r:'H = '+fx(H,5)+' m'});
  } else {
    H = val; W = H*a/b;
    if(steps) steps.push({l:'高さから幅を求める', f:'W = H × a / b',
      s:'W = '+fx(H,5)+' × '+fx(a)+' / '+fx(b), r:'W = '+fx(W,5)+' m'});
  }
  var diagM = Math.sqrt(W*W + H*H);
  return {W:W, H:H, diagM:diagM, diagIn:diagM/IN2M, area:W*H, a:a, b:b, r:r};
}
/** 画面サイズ入力の定義（他の計算機から使い回す） */
function sizeInputs(){
  return [
    {k:'asp', label:'アスペクト比', type:'sel', def:'16:9', options:aspectOpts()},
    {k:'aw', label:'アスペクト比（横）', type:'num', def:'16', step:'any', show:function(v){return v.asp==='custom';}},
    {k:'ah', label:'アスペクト比（縦）', type:'num', def:'9', step:'any', show:function(v){return v.asp==='custom';}},
    {k:'sbase', label:'画面サイズの指定方法', type:'sel', def:'diag_in', options:SIZE_BASES},
    {k:'sval', label:'その値', type:'num', def:'150', step:'any'}
  ];
}
function readSize(v, steps){
  return screenDims(v.sbase, reqPos(v.sval,'画面サイズの値'), aspectOf(v.asp, v.aw, v.ah), steps);
}

      head=[

    } else if(v.mode === 'd2s'){

      var dimMin=screenDims('width_m', wMin, asp, null), dimMax=screenDims('width_m', wMax, asp, null);

        n:'この値を含む範囲のレンズを選定します。ズーム端ぎりぎりは避け、中央付近で使えるレンズを選ぶと画質・明るさの面で有利です。'});
      head=[
        {l:'必要なスロー比', v:fd(tr,3), u:''},
        {l:'画面幅', v:fx(W,4), u:'m'},
        {l:'画面高', v:fx(H,4), u:'m'},
        {l:'対角', v:fd(dim.diagIn,1), u:'inch'}
      ];
      var tr3=[], cands=[[0.8,'超短焦点'],[1.2,'短焦点'],[1.5,'標準'],[2.0,'標準〜中望遠'],[3.0,'望遠'],[5.0,'長焦点']];
      for(var k=0;k<cands.length;k++){
        tr3.push({cells:['スロー比 '+fx(cands[k][0])+'（'+cands[k][1]+'）', fx(cands[k][0]*W,4)+' m'],

      tables.push({title:'代表的なレンズでの投写距離（画面幅 '+fx(W,4)+' m）', head:['レンズ','投写距離'], rows2:tr3});

      var pd=reqPos(v.panel,'表示パネル対角');

      steps.push({l:'パネルの有効幅を求める', f:'w_{panel} = パネル対角[inch] × 25.4 × a / r',
        s:'w_{panel} = '+fx(pd)+' × 25.4 × '+fx(asp.a)+' / '+fx(Math.sqrt(asp.a*asp.a+asp.b*asp.b),5),
        r:'w_{panel} = '+fd(pw,3)+' mm'});
      var trLens=lf/pw;
      steps.push({l:'レンズ焦点距離からスロー比を導く',
        f:'投写倍率 M = W / w_{panel} = D / f   ⇒   スロー比 = D / W = f / w_{panel}',
        s:'スロー比 = '+fx(lf)+' mm / '+fd(pw,3)+' mm', r:'スロー比 ≒ '+fd(trLens,3),
        n:'薄レンズ近似（投写距離が焦点距離よりずっと大きい場合）です。実機のスロー比はレンズ構成で数%ずれます。'});
      head.push({l:'焦点距離から求めたスロー比', v:fd(trLens,3), u:'', n:'f = '+fx(lf)+' mm / パネル幅 '+fd(pw,2)+' mm'});
    }
    return {head:head, steps:steps, tables:tables, notes:[
      'スロー比の定義は「投写距離 ÷ 画面幅」です。距離はレンズ前面ではなくレンズの主点基準で表記されることが多く、実機では数cm〜十数cmの差が出ます。',
      'レンズシフトを使う場合も投写距離は変わりません。距離はスロー比、上下左右の位置はシフトで決まります。',
      '設置前にメーカーの投写計算ツール（機種別）で必ず裏取りしてください。ここでの計算はレンズ選定の当たりをつけるためのものです。'
    ]};
  }

        {l:'必要な光束', v:fd(lm,0), u:'lm'},

      '高ゲインスクリーンは正面が明るくなる代わりに視野角が狭くなり、輝度ムラ（ホットスポット）が出ます。客席の広がりに応じて選定してください。'

      r:(okV&&okH)?'OK（シフトのみで設置可）':'NG（範囲外 — 設置高さの見直し、またはレンズ/機種変更が必要）'});
    var vRange=sv/100*dim.H, hRange=sh/100*dim.W;
    steps.push({l:'設置できる光軸高さの範囲を逆算する', f:'h_{光軸} = h_{中心} ± (機種の範囲% × H)',
      s:'h_{光軸} = '+fx(scen,4)+' ± ('+fd(sv,1)+'% × '+fx(dim.H,5)+') = '+fx(scen,4)+' ± '+fx(vRange,4),
      r:fx(scen-vRange,4)+' 〜 '+fx(scen+vRange,4)+' m'});
    var over=0;
    if(!okV) over=(Math.abs(needV)-sv)/100*dim.H;
    var head=[
      {l:'必要な垂直シフト', v:(needV>=0?'+':'')+fd(needV,1), u:'% of H', tone:okV?'ok':'bad',
       n:'機種は ±'+fd(sv,0)+'%'+(okV?'':' — '+fx(over,3)+' m 超過')},
      {l:'必要な水平シフト', v:(needH>=0?'+':'')+fd(needH,1), u:'% of W', tone:okH?'ok':'bad', n:'機種は ±'+fd(sh,0)+'%'},

      {l:'画面中心の高さ', v:fx(scen,4), u:'m', n:'画面高 '+fx(dim.H,4)+' m'},
      {l:'判定', v:(okV&&okH)?'OK':'NG', u:'', tone:(okV&&okH)?'ok':'bad'}

    return {head:head, steps:steps,

        rows2:[0.6,0.8,1.0,1.2,1.5,1.8,2.0,2.5].map(function(b){

      notes:[
        'メーカーのシフト表記には「画面高の ±○%」「投写画面の ○ 画面ぶん」「上方向のみ ○%」など複数の流儀があります。カタログの定義と基準点を必ず確認してください。',
        'シフト量を最大付近まで使うと周辺の解像度低下・フォーカスムラ・輝度ムラが出やすくなります。可能なら範囲の 70% 以内に収める設計が無難です。',
        '垂直と水平のシフトを同時に最大まで使えない機種があります（シフト範囲が菱形に制限される）。同時使用時の制限を確認してください。',

VIDEO.push({
  id:'keystone', cat:'video', title:'キーストーン（台形）補正量',
  sub:'投写距離と光軸オフセットから煽り角を求め、台形歪みの大きさと補正で失う画素を計算します。',
  inputs:sizeInputs().concat([
    {k:'dist', label:'投写距離（水平距離）', type:'num', def:'6', unit:'m', step:'any'},
    {k:'imode', label:'傾きの指定方法', type:'sel', def:'off', options:[
      {v:'off', t:'光軸と画面中心の高さの差から求める'},
      {v:'ang', t:'設置角度（煽り角）を直接指定する'}]},
    {k:'dv', label:'光軸と画面中心の高さの差', type:'num', def:'1.5', unit:'m', step:'any',
     show:function(v){ return v.imode === 'off'; },
     hint:'光軸が画面中心より上なら正、下なら負。絶対値のみが結果に影響します。'},
    {k:'ang', label:'煽り角（俯角・仰角）', type:'num', def:'14', unit:'°', step:'any',
     show:function(v){ return v.imode === 'ang'; }}
  ]),
  compute:function(v){
    var steps=[], dim=readSize(v, steps), D=reqPos(v.dist,'投写距離');
    var theta, dv;
    if(v.imode === 'off'){
      dv=Math.abs(req(v.dv,'光軸と画面中心の高さの差'));
      theta=Math.atan(dv/D);
      steps.push({l:'煽り角を求める', f:'θ = arctan( |Δv| / D )',
        s:'θ = arctan( '+fx(dv,4)+' / '+fx(D)+' )', r:'θ = '+fd(theta*180/Math.PI,3)+' °'});
    } else {
      theta=Math.abs(req(v.ang,'煽り角'))*Math.PI/180;
      dv=D*Math.tan(theta);
      steps.push({l:'煽り角から高さの差を求める', f:'Δv = D × tan θ',
        s:'Δv = '+fx(D)+' × tan('+fd(theta*180/Math.PI,3)+'°)', r:'Δv = '+fx(dv,4)+' m'});
    }
    if(theta >= Math.PI/2*0.95) throw new Error('煽り角が大きすぎます（90°近い）。投写距離と高さの差を見直してください。');
    var Lc=D/Math.cos(theta);
    steps.push({l:'光軸に沿った画面中心までの距離', f:'L_{c} = D / cos θ',
      s:'L_{c} = '+fx(D)+' / cos('+fd(theta*180/Math.PI,3)+'°)', r:'L_{c} = '+fx(Lc,5)+' m',
      n:'プロジェクタの水平画角は一定なので、投写画像の幅は「光軸に沿った距離」に比例します。この距離が画面の上端と下端で違うために台形になります。'});
    var half=dim.H/2*Math.sin(theta);
    var Lfar=Lc+half, Lnear=Lc-half;
    steps.push({l:'画面の上端・下端までの光軸方向距離',
      f:'L_{遠} = L_{c} + (H/2) sin θ,   L_{近} = L_{c} − (H/2) sin θ',
      s:'(H/2) sin θ = ('+fx(dim.H,5)+'/2) × sin('+fd(theta*180/Math.PI,3)+'°) = '+fx(half,5)+' m\nL_{遠} = '+fx(Lc,5)+' + '+fx(half,5)+',   L_{近} = '+fx(Lc,5)+' − '+fx(half,5),
      r:'L_{遠} = '+fx(Lfar,5)+' m,  L_{近} = '+fx(Lnear,5)+' m'});
    if(Lnear <= 0) throw new Error('この条件では画面の一方の端が光軸の後方に来てしまいます。投写距離を長くするか傾きを小さくしてください。');
    var ratio=Lfar/Lnear;
    steps.push({l:'台形の辺の長さの比', f:'比 = L_{遠} / L_{近}   （画像の幅は光軸方向距離に比例）',
      s:'比 = '+fx(Lfar,5)+' / '+fx(Lnear,5), r:'比 = '+fd(ratio,4)+' : 1',
      n:'画面から遠い側の辺が '+fd((ratio-1)*100,1)+' % 長くなります。'});
    var wNear=dim.W*2/(1+ratio), wFar=wNear*ratio;
    steps.push({l:'補正前の上下の辺の長さ',
      f:'（平均が画面幅 W になるように配分）w_{近} = 2W / (1 + 比),   w_{遠} = w_{近} × 比',
      s:'w_{近} = 2 × '+fx(dim.W,5)+' / (1 + '+fd(ratio,4)+')', r:'w_{近} = '+fx(wNear,4)+' m,  w_{遠} = '+fx(wFar,4)+' m'});
    var corr=(ratio-1)*100, lossH=(1-1/ratio)*100;
    steps.push({l:'補正量と失われる画素', f:'補正量 = (比 − 1) × 100 [%],   水平画素の残存率 = 1 / 比',
      s:'補正量 = ('+fd(ratio,4)+' − 1) × 100\n残存率 = 1 / '+fd(ratio,4),
      r:'補正量 = '+fd(corr,1)+' %,  水平画素の損失 ≒ '+fd(lossH,1)+' %',
      n:'キーストーン補正は広い側の辺を狭い側に合わせて縮めるデジタル処理です。縮めたぶんの画素が捨てられ、解像度と文字の可読性が落ちます。'});
    var pxLeft=100-lossH;
    var grade = corr<5 ? 'ok' : (corr<15 ? 'warn' : 'bad');
    return {
      head:[
        {l:'煽り角', v:fd(theta*180/Math.PI,2), u:'°', tone:grade},
        {l:'台形補正量', v:fd(corr,1), u:'%', tone:grade,
         n:corr<5?'ごくわずか — 実用上問題なし':(corr<15?'補正で対応可能だが画質低下あり':'大きい — レンズシフトでの解決を検討')},
        {l:'水平画素の残存率', v:fd(pxLeft,1), u:'%', tone:grade, n:'補正で '+fd(lossH,1)+' % を失う'},
        {l:'上下の辺の長さ', v:fx(wNear,3)+' / '+fx(wFar,3), u:'m', n:'近い側 / 遠い側'},
        {l:'光軸方向の距離', v:fx(Lc,3), u:'m', n:'水平距離 '+fx(D)+' m'}
      ],
      steps:steps,
      tables:[{title:'煽り角ごとの台形補正量（投写距離 '+fx(D)+' m、画面高 '+fx(dim.H,3)+' m）',
        head:['煽り角','高さの差','補正量','水平画素の損失'],
        rows2:[0,2,5,8,10,15,20,25,30].map(function(a){
          var t=a*Math.PI/180, lc=D/Math.cos(t), h=dim.H/2*Math.sin(t);
          if(lc-h<=0) return {cells:[a+' °','—','投写不可','—'], tone:'bad'};
          var rr=(lc+h)/(lc-h);
          return {cells:[a+' °', fx(D*Math.tan(t),3)+' m', fd((rr-1)*100,1)+' %', fd((1-1/rr)*100,1)+' %'],
                  tone:(rr-1)*100<5?'ok':((rr-1)*100<15?'warn':'bad')};
        })}],
      notes:[
        'キーストーン補正は最後の手段です。まずレンズシフトで合わせ、それでも足りない場合にのみ使ってください。',
        '水平と垂直の両方に台形補正をかけると（コーナー補正）、画素の損失はさらに大きくなります。',
        '補正をかけるとスケーリング処理が入るため、1:1 のドットバイドット表示ができなくなり、細い文字や罫線がにじみます。PC 画面の投写では特に不利です。',
        'この計算は理想的なピンホール投写のモデルです。実機ではレンズの歪曲収差も加わります。'
      ]
    };
  }
});

var RESOS = [
  {v:'1280x720',  t:'1280 × 720（720p）',       hp:1280, vp:720},
  {v:'1920x1080', t:'1920 × 1080（2K / 1080p）', hp:1920, vp:1080},
  {v:'1920x1200', t:'1920 × 1200（WUXGA）',      hp:1920, vp:1200},
  {v:'2048x1080', t:'2048 × 1080（DCI 2K）',     hp:2048, vp:1080},
  {v:'2560x1440', t:'2560 × 1440（WQHD）',       hp:2560, vp:1440},
  {v:'3840x2160', t:'3840 × 2160（4K UHD）',     hp:3840, vp:2160},
  {v:'4096x2160', t:'4096 × 2160（DCI 4K）',     hp:4096, vp:2160},
  {v:'7680x4320', t:'7680 × 4320（8K UHD）',     hp:7680, vp:4320},
  {v:'custom',    t:'任意（画素数を指定）',       hp:1920, vp:1080}
];
function resoOpts(){ return RESOS.map(function(x){ return {v:x.v, t:x.t}; }); }
function resoOf(v, ch, cv){
  if(v === 'custom') return {hp:Math.round(reqPos(ch,'水平画素数')), vp:Math.round(reqPos(cv,'垂直画素数')), name:fx(ch)+'×'+fx(cv)};
  for(var i=0;i<RESOS.length;i++) if(RESOS[i].v === v) return {hp:RESOS[i].hp, vp:RESOS[i].vp, name:RESOS[i].hp+'×'+RESOS[i].vp};
  return {hp:1920, vp:1080, name:'1920×1080'};
}

VIDEO.push({

  inputs:sizeInputs().concat([
    {k:'reso', label:'解像度', type:'sel', def:'3840x2160', options:resoOpts()},
    {k:'rh', label:'水平画素数', type:'num', def:'3840', show:function(v){ return v.reso==='custom'; }},
    {k:'rv', label:'垂直画素数', type:'num', def:'2160', show:function(v){ return v.reso==='custom'; }},
    {k:'acuity', label:'視力', type:'num', def:'1.0', step:'any',
     hint:'視力1.0 は 1分角（1/60度）を見分ける能力。視力2.0 なら 0.5分角まで分解できます。'},
    {k:'actual', label:'実際の視聴距離（任意）', type:'num', def:'5', unit:'m', step:'any',

    var head=[
      {l:'画素が見えなくなる距離', v:fx(dRes,3), u:'m', n:'これ以上離れれば '+reso.name+' の解像度は活きない'},
      {l:'推奨距離（SMPTE 30°）', v:fx(dSmpte,3), u:'m', n:'画面高の '+fd(dSmpte/dim.H,2)+' 倍'},

    var act=opt(v.actual,NaN);
    if(isFinite(act) && act > 0){
      var fov=2*Math.atan(dim.W/2/act)*180/Math.PI;

      var pxMin=(pitch/1000/act)/ARCMIN;

          ['細かい文字・図面の判読（分析的視聴）','画面高の 4 倍以内'],
          ['一般的なプレゼン資料の閲覧','画面高の 6 倍以内'],
          ['映像・動画の鑑賞（受動的視聴）','画面高の 8 倍以内'],
          ['最短距離（画素が見え始める）','解像度から上表で算出']
        ]}
      ],
      notes:[
        '「画面高の 4 / 6 / 8 倍」は現場でよく使われる経験則です。厳密な設計には ANSI/AVIXA V201.01（DISCAS）を用い、表示される文字の高さから最遠距離を算出してください。',
        'SMPTE EG-18 の 30° は劇場の最後列を想定した推奨値、THX の 36° は中央付近の推奨値です。',
        '視力による分解限界は理想条件（高コントラストの白黒縞）での値です。実際の映像では画素構造はこれより手前で見えなくなります。',
        '会議室では最前列が近すぎないことも確認してください。画面高の 1.5 倍より近いと首を振らずに全体を見られません。'
      ]};
  }

    {k:'acuity', label:'視力', type:'num', def:'1.0', step:'any'}
  ],
  compute:function(v){
    var p=reqPos(v.pitch,'ピクセルピッチ'), steps=[], W, H;
    if(v.smode === 'cab'){
      var cw=reqPos(v.cw,'キャビネット幅'), ch=reqPos(v.chh,'キャビネット高');
      var nx=Math.round(reqPos(v.nx,'横の枚数')), ny=Math.round(reqPos(v.ny,'縦の枚数'));
      W=cw*nx/1000; H=ch*ny/1000;
      steps.push({l:'キャビネット構成から画面寸法を求める', f:'W = 幅 × 横枚数,   H = 高 × 縦枚数',
        s:'W = '+fx(cw)+' mm × '+nx+' = '+fd(cw*nx,0)+' mm\nH = '+fx(ch)+' mm × '+ny+' = '+fd(ch*ny,0)+' mm',
        r:'W = '+fx(W,4)+' m,  H = '+fx(H,4)+' m（'+(nx*ny)+' 枚）'});
    } else {
      W=reqPos(v.w,'画面幅'); H=reqPos(v.h,'画面高');
    }
    var hp=Math.round(W*1000/p), vp=Math.round(H*1000/p);
    steps.push({l:'解像度を求める', f:'水平画素 = W / p,   垂直画素 = H / p',
      s:'水平 = '+fd(W*1000,0)+' mm / '+fx(p)+' mm,   垂直 = '+fd(H*1000,0)+' mm / '+fx(p)+' mm',
      r:hp+' × '+vp+' 画素'});
    var total=hp*vp;
    steps.push({l:'総画素数', f:'総画素 = 水平 × 垂直', s:'総画素 = '+hp+' × '+vp, r:fd(total,0)+' 画素'});
    var ac=reqPos(v.acuity,'視力'), thAc=ARCMIN/ac;
    var dLimit=p/1000/thAc;
    steps.push({l:'画素が完全に見分けられなくなる距離', f:'d = p / θ,   θ = 1分角 / 視力',
      s:'d = '+fx(p/1000,6)+' m / '+fx(thAc,4), r:'d = '+fx(dLimit,4)+' m',
      n:'この距離より遠ければ、隣の LED が視覚的に融合して連続した画像に見えます。'});
    var dRule=p;
    steps.push({l:'業界で使われる最短視認距離の目安', f:'最短視認距離 [m] ≒ ピクセルピッチ [mm]',
      s:'ピッチ '+fx(p)+' mm → 約 '+fx(dRule,3)+' m',
      r:'最短 ≒ '+fx(dRule,3)+' m',
      n:'この目安は視角 約3.4分角に相当します。画素は見えますが、実用上「絵として成立する」距離としてカタログ等で使われます。'});
    var head=[
      {l:'解像度', v:hp+' × '+vp, u:'', n:fd(total,0)+' 画素'},
      {l:'画面寸法', v:fx(W,3)+' × '+fx(H,3), u:'m', n:'アスペクト比 '+fd(W/H,3)+' : 1'},
      {l:'最短視認距離（実用目安）', v:fx(dRule,2), u:'m'},
      {l:'画素が見えなくなる距離', v:fx(dLimit,2), u:'m'}
    ];
    var d=opt(v.dist,NaN), notes=[
      '「最短視認距離 [m] ≒ ピッチ [mm]」は業界慣習の目安です（視角 約3.4分角）。厳密には視力・映像内容・輝度に依存します。',
      'ピッチを細かくすると画素数が増え、必要な送出解像度・処理能力・電源容量・費用がすべて増えます。視距離に見合ったピッチを選定してください。',
      '屋外用は輝度（5,000〜10,000 cd/m² 級）と防水等級（IP65 以上）が必要です。屋内用とは別系統の製品です。',
      'キャビネットの物理サイズとピッチの組み合わせで解像度は決まります。送出機（プロセッサ）の対応解像度と一致しているか確認してください。'
    ];
    if(isFinite(d) && d > 0){
      var ang=(p/1000/d)/ARCMIN;
      steps.push({l:'その距離での1画素の視角', f:'視角 = p / d', s:'視角 = '+fx(p/1000,6)+' / '+fx(d), r:'視角 = '+fd(ang,3)+' 分角'});
      var grade = ang<=1/ac ? 'ok' : (ang<=3.44/ac ? 'warn' : 'bad');
      steps.push({l:'判定', f:'1分角以下 → 画素は見えない / 3.4分角以下 → 実用範囲 / それ以上 → 粗く見える',
        s:fd(ang,3)+' 分角', r:grade==='ok' ? '画素は見えない（十分細かい）' : (grade==='warn' ? '画素は見えるが実用範囲' : '画素が目立つ（ピッチを細かくするか距離を確保）')});
      head.unshift({l:'その距離（'+fx(d)+' m）での判定', v:grade==='ok'?'良好':(grade==='warn'?'実用範囲':'粗い'), u:'',
        tone:grade, n:'1画素 = '+fd(ang,2)+' 分角'});
      var pNeed=d*1000*thAc;
      steps.push({l:'その距離で画素を見せないための必要ピッチ', f:'p = d × θ',
        s:'p = '+fx(d)+' m × '+fx(thAc,4)+' = '+fx(d*thAc,6)+' m', r:'p = '+fd(pNeed,3)+' mm 以下'});
      head.push({l:'画素を見せない必要ピッチ', v:fd(pNeed,2), u:'mm', n:'視距離 '+fx(d)+' m の場合'});
    }
    return {head:head, steps:steps, notes:notes,
      tables:[{title:'ピッチ別の視認距離の目安', head:['ピッチ','実用最短距離','画素が見えなくなる距離','主な用途'],
        rows2:[
          {p:1.2, u:'会議室・スタジオ・コントロールルーム'},
          {p:1.5, u:'会議室・ロビー'},
          {p:1.9, u:'屋内サイネージ'},
          {p:2.5, u:'屋内イベント・ホール'},
          {p:3.9, u:'屋内大型・ステージ背面'},
          {p:6.0, u:'屋外（近距離）'},
          {p:10,  u:'屋外ビジョン'},
          {p:16,  u:'屋外大型・遠距離'}
        ].map(function(x){
          return {cells:['P'+fx(x.p), fx(x.p,3)+' m', fx(x.p/1000/thAc,3)+' m', x.u],
                  tone:Math.abs(x.p-p)<0.3 ? 'ok' : ''};
        })}]};
  }
});

VIDEO.push({
  id:'video-reach', cat:'video', title:'映像伝送距離（SDI 同軸の計算 ＋ HDMI / HDBaseT の目安）',
  sub:'SDI は同軸ケーブルの損失から限界長を計算します。HDMI / HDBaseT は規格と実績にもとづく目安を併記します。',
  inputs:[

    }).concat([{v:'custom',t:'任意（損失係数を指定）'}])},
    {k:'kk', label:'損失係数 k', type:'num', def:'0.5', step:'any', show:function(v){ return v.ct==='custom'; },
     hint:'α[dB/100m] = k × √f[MHz]。カタログの「100 MHz で ○ dB/100m」を 10 で割った値です。'},
    {k:'budget', label:'受信側の許容損失（イコライザ能力）', type:'num', def:'20', unit:'dB', step:'any',
     hint:'1/2 クロック周波数での許容減衰量。機器依存ですが 3G / 6G / 12G で 20 dB 前後、HD で 20〜30 dB、SD はさらに余裕があります。'},
    {k:'len', label:'実際のこう長（任意）', type:'num', def:'80', unit:'m', step:'any'}
  ],
  compute:function(v){

      n:'SDI はシリアル伝送なので、最も高い周波数成分はビットレートの半分（連続する 0101… のパターン）です。SMPTE の規定もこの 1/2 クロック周波数での減衰量で規定されています。'});
    var alpha=k*Math.sqrt(rate.half);
    steps.push({l:'その周波数でのケーブル損失', f:'α = k × √f  [dB/100m]',

    var maxLen=budget/alpha*100;

    var head=[

        r:'損失 = '+fd(loss,2)+' dB,  余裕 = '+fd(marg,2)+' dB',
        n:marg>=0 ? '余裕があります。ただしコネクタ・パッチ盤の挿入損失は別途加算してください。' : '許容損失を超えています。太い同軸に変更するか、途中に再クロック（リクロッキング）DA を挿入してください。'});
      head.unshift({l:'判定（こう長 '+fx(L)+' m）', v:marg>=0?'OK':'NG', u:'',
        tone:marg>=6?'ok':(marg>=0?'warn':'bad'), n:'損失 '+fd(loss,1)+' dB / 余裕 '+fd(marg,1)+' dB'});
      head.push({l:'限界長に対する使用率', v:fd(L/maxLen*100,0), u:'%'});
    }
    var rateRows=SDI_RATES.map(function(x){
      var a=k*Math.sqrt(x.half), m=budget/a*100;
      return {cells:[x.t, fx(x.half)+' MHz', fd(a,2)+' dB/100m', fd(m,0)+' m'],
              tone:x.v===String(rate.v)?'ok':''};
    });
    var cableRows=CABLE_TYPES.filter(function(x){ return x.t.indexOf('UTP') < 0; }).map(function(x){
      var a=x.k*Math.sqrt(rate.half), m=budget/a*100;
      return {cells:[x.t+(x.warn?' ※':''), fd(a,2)+' dB/100m', fd(m,0)+' m'], tone:x.v===v.ct?'ok':''};
    });
    return {head:head, steps:steps,

VIDEO.push({
  id:'contrast', cat:'video', title:'実効コントラスト比（環境光を含む）',
  sub:'プロジェクタのコントラスト比と環境光から、実際に画面上で得られるコントラストを求めます。',
  inputs:[
    {k:'lm', label:'プロジェクタ光束', type:'num', def:'7000', unit:'lm', step:'any'},
    {k:'cr', label:'プロジェクタのコントラスト比（ON/OFF）', type:'num', def:'2000', step:'any',
     hint:'カタログ値。全白と全黒を別々に測った値（フルオン/フルオフ）で、実際の映像内コントラストより大きく出ます。'}
  ].concat(sizeInputs()).concat([
    {k:'gain', label:'スクリーンゲイン', type:'num', def:'1.0', step:'any'},
    {k:'amb', label:'画面面の環境光照度', type:'num', def:'50', unit:'lx', step:'any',
     hint:'スクリーン面に照度計を向けて測った値。暗室 0〜5、照明を落とした会議室 20〜50、通常の事務所 300〜500 lx。'},
    {k:'use', label:'用途（判定基準）', type:'sel', def:'50', options:[
      {v:'7',  t:'受動的な視聴（雰囲気映像・背景）— 7:1'},
      {v:'15', t:'基本的な判断（一般的なプレゼン）— 15:1'},
      {v:'50', t:'分析的な判断（図面・詳細データ）— 50:1'},
      {v:'80', t:'フルモーション映像の鑑賞 — 80:1'}]}
  ]),
  compute:function(v){
    var steps=[], dim=readSize(v, steps);
    var lm=reqPos(v.lm,'プロジェクタ光束'), gain=reqPos(v.gain,'スクリーンゲイン');
    var cr=reqPos(v.cr,'プロジェクタのコントラスト比'), amb=req(v.amb,'画面面の環境光照度');
    if(amb < 0) throw new Error('環境光照度は 0 以上で入力してください。');
    steps.push({l:'画面面積', f:'A = W × H', s:'A = '+fx(dim.W,5)+' × '+fx(dim.H,5), r:'A = '+fx(dim.area,5)+' m²'});
    var E=lm/dim.area, Lw=E*gain/Math.PI;
    steps.push({l:'映像の白レベル輝度', f:'E = 光束 / A,   L_{白} = E × ゲイン / π',
      s:'E = '+fx(lm)+' / '+fx(dim.area,5)+' = '+fd(E,1)+' lx\nL_{白} = '+fd(E,1)+' × '+fx(gain)+' / 3.1416',
      r:'L_{白} = '+fd(Lw,2)+' cd/m²'});
    var Lb=Lw/cr;
    steps.push({l:'プロジェクタ由来の黒レベル輝度', f:'L_{黒} = L_{白} / コントラスト比',
      s:'L_{黒} = '+fd(Lw,2)+' / '+fx(cr), r:'L_{黒} = '+fx(Lb,4)+' cd/m²',
      n:'黒を表示しても、プロジェクタは光を完全に遮断できないためわずかに光ります。これが機器のコントラスト比の正体です。'});
    var La=amb*gain/Math.PI;
    steps.push({l:'環境光がスクリーンから返る輝度', f:'L_{環境} = E_{環境} × ゲイン / π',
      s:'L_{環境} = '+fx(amb)+' × '+fx(gain)+' / 3.1416', r:'L_{環境} = '+fd(La,3)+' cd/m²',
      n:'環境光は白い部分にも黒い部分にも同じだけ加算されます。黒に加算されるぶんが、コントラストを決定的に損ないます。'});
    var Lwt=Lw+La, Lbt=Lb+La;
    steps.push({l:'実際に画面に見える輝度', f:'L_{白実効} = L_{白} + L_{環境},   L_{黒実効} = L_{黒} + L_{環境}',
      s:'L_{白実効} = '+fd(Lw,2)+' + '+fd(La,3)+'\nL_{黒実効} = '+fx(Lb,4)+' + '+fd(La,3),
      r:'L_{白実効} = '+fd(Lwt,2)+' cd/m²,  L_{黒実効} = '+fd(Lbt,4)+' cd/m²'});
    var eff=Lwt/Lbt;
    steps.push({l:'実効コントラスト比', f:'CR_{実効} = L_{白実効} / L_{黒実効}',
      s:'CR_{実効} = '+fd(Lwt,2)+' / '+fd(Lbt,4), r:'CR_{実効} = '+fd(eff,1)+' : 1',
      n:'カタログの '+fx(cr)+':1 に対して '+fd(eff/cr*100,1)+' % まで落ちています。環境光がある部屋では、機器のコントラスト比はほとんど意味を持ちません。'});
    var target=Number(v.use), ok=eff>=target;
    steps.push({l:'用途基準との照合', f:'CR_{実効} ≥ 用途に必要なコントラスト比',
      s:fd(eff,1)+' : 1  '+(ok?'≥':'<')+'  '+target+' : 1', r:ok?'OK（用途に適合）':'NG（コントラスト不足）'});
    var ambMax=(target>1) ? (Lw-target*Lb)/((target-1)*gain/Math.PI) : Infinity;
    steps.push({l:'目標を満たす環境光の上限を逆算する',
      f:'CR = (L_{白} + L_{a}) / (L_{黒} + L_{a}) = 目標  を L_{a} について解き、E = L_{a} × π / ゲイン',
      s:'L_{a} = (L_{白} − 目標 × L_{黒}) / (目標 − 1) = ('+fd(Lw,2)+' − '+target+' × '+fx(Lb,4)+') / '+(target-1),
      r:(ambMax>0 && isFinite(ambMax)) ? ('環境光 '+fd(ambMax,1)+' lx 以下') : 'この機器では目標を満たせません（機器のコントラスト比が不足）'});
    var head=[
      {l:'実効コントラスト比', v:fd(eff,0)+' : 1', u:'', tone:ok?'ok':'bad',
       n:'用途基準 '+target+':1 に対して'+(ok?'適合':'不足')},
      {l:'白レベル輝度', v:fd(Lwt,1), u:'cd/m²', n:fd(Lwt*FL_PER_NIT,1)+' fL'},
      {l:'黒レベル輝度', v:fd(Lbt,3), u:'cd/m²', n:'うち環境光ぶん '+fd(La,3)},
      {l:'カタログ比の低下', v:fd(eff/cr*100,1), u:'%', tone:eff/cr>0.5?'ok':'warn', n:'カタログ '+fx(cr)+':1 → 実効 '+fd(eff,0)+':1'},
      {l:'許容できる環境光', v:(ambMax>0&&isFinite(ambMax))?fd(ambMax,0):'—', u:'lx',
       tone:(ambMax>=amb)?'ok':'bad', n:'現状 '+fx(amb)+' lx'}
    ];
    return {head:head, steps:steps,
      tables:[
        {title:'環境光ごとの実効コントラスト', head:['環境光','黒レベル','実効コントラスト','判定'],
         rows2:[0,5,10,20,50,100,200,300,500].map(function(a){
           var la=a*gain/Math.PI, e=(Lw+la)/(Lb+la);
           return {cells:[fx(a)+' lx', fd(Lb+la,3)+' cd/m²', fd(e,0)+' : 1', e>=target?'OK':'不足'],
                   tone:e>=target?'ok':'bad'};
         })},
        {title:'用途別に必要なコントラスト比（ANSI/AVIXA V201.01 の分類）', head:['用途','必要コントラスト比'], rows:[
          ['受動的な視聴（雰囲気映像・背景）','7 : 1'],
          ['基本的な判断（一般的なプレゼン資料）','15 : 1'],
          ['分析的な判断（図面・詳細データ）','50 : 1'],
          ['フルモーション映像の鑑賞','80 : 1']
        ]}
      ],
      notes:[
        'カタログのコントラスト比（フルオン/フルオフ）は全白と全黒を別々に測った値です。1画面内の明暗差（ANSI コントラスト）は通常その 1/10 以下になります。',
        '実効コントラストを上げる最も効果的な手段は環境光を減らすことです。プロジェクタの機種変更よりも、遮光と照明計画の効果が桁違いに大きくなります。',
        'スクリーン前の天井照明を個別回路にする、窓に遮光カーテンを付ける、壁・天井・床の反射率を下げる（明るい色を避ける）ことが有効です。',
        'ALR（環境光拒否型）スクリーンは、上方からの光を客席方向に返しにくい構造で、明るい部屋でのコントラストを改善します。ただし投写位置に制約があります。',
        '室内の壁面反射で画面に戻る光（スクリーン自身が照らした壁からの戻り）はこの計算に含まれていません。明るい壁の小部屋では実効コントラストがさらに下がります。'
      ]};
  }
});

/* ============================================================
   全機能の登録
   ============================================================ */
var CATS = [
  {id:'tele',   name:'電気通信工事'},
  {id:'audio',  name:'音響'},
  {id:'video',  name:'映像'},
  {id:'common', name:'共通基礎'}
];
var CALCS = TELE.concat(AUDIO).concat(VIDEO).concat(COMMON);

/* ============================================================
   状態管理
   ============================================================ */
var STORE_KEY = 'ac-calc-v2';   // v1 → v2: 電線管・ケーブル種別の選択肢 value を ID 方式に変更したため保存値を破棄
var states = {};
var curId = CALCS[0].id;
var curCat = CALCS[0].cat;
var lastOut = null;
// 「既定値に戻す」の取り消し用。戻す直前の入力を一定時間だけ保持する
var undoReset = null;   // { id, state, timer }

function calcById(id){
  for(var i=0;i<CALCS.length;i++) if(CALCS[i].id===id) return CALCS[i];
  return CALCS[0];
}
function optionsFor(inp, st){
  if(typeof inp.dyn === 'function') return inp.dyn(st);
  return inp.options || [];
}
function initState(c){
  var st = {};
  for(var i=0;i<c.inputs.length;i++){
    var inp = c.inputs[i];
    if(inp.type === 'rows'){
      var rs = [];
      var defs = inp.def || [];
      for(var j=0;j<defs.length;j++){
        var o = {};
        for(var k=0;k<inp.cols.length;k++) o[inp.cols[k].k] = defs[j][k] !== undefined ? String(defs[j][k]) : '';
        rs.push(o);
      }
      st[inp.k] = rs;
    } else {
      st[inp.k] = inp.def !== undefined ? String(inp.def) : '';
    }
  }
  // dyn セレクトの既定値を実在する選択肢に合わせる
  for(var m=0;m<c.inputs.length;m++){
    var ip = c.inputs[m];
    if(ip.type==='sel' && typeof ip.dyn==='function'){
      var os = ip.dyn(st), found = false;
      for(var n=0;n<os.length;n++) if(os[n].v === st[ip.k]) found = true;
      if(!found && os.length) st[ip.k] = os[0].v;
    }
  }
  return st;
}
function getState(c){
  if(!states[c.id]) states[c.id] = initState(c);
  return states[c.id];
}
function visible(inp, st){
  return (typeof inp.show === 'function') ? !!inp.show(st) : true;
}
/** 表示中の入力欄の構成（欄の並びと動的な選択肢）を表す文字列。変化したらフォームを描き直す */
function formSig(c, st){
  var s = [];
  st = evalInputs(c, st).st;
  for(var i=0;i<c.inputs.length;i++){
    var inp = c.inputs[i];
    if(!visible(inp, st)) continue;
    s.push(inp.k);
    if(inp.type === 'sel' && typeof inp.dyn === 'function'){
      var os = inp.dyn(st);
      for(var j=0;j<os.length;j++) s.push(os[j].v);
    }
  }
  return s.join('|');
}

/* ============================================================
   入力フォームの描画
   ============================================================ */
function renderForm(){
  var c = calcById(curId), st = getState(c), form = document.getElementById('form');
  var ev = evalInputs(c, st).st;
  var h = '';
  for(var i=0;i<c.inputs.length;i++){
    var inp = c.inputs[i];
    if(!visible(inp, ev)) continue;
    h += '<label class="f" data-k="'+esc(inp.k)+'">';
    h += '<span class="lb">'+mf(inp.label)+'</span>';
    if(inp.type === 'rows'){
      h += renderRows(inp, st[inp.k]);
    } else if(inp.type === 'sel'){
      var os = optionsFor(inp, st);
      if(os.length){
        var hit = false;
        for(var q=0;q<os.length;q++) if(String(st[inp.k]) === String(os[q].v)) hit = true;
        if(!hit) st[inp.k] = os[0].v;
      }
      h += '<select data-in="'+esc(inp.k)+'">';
      for(var j=0;j<os.length;j++){
        h += '<option value="'+esc(os[j].v)+'"'+(String(st[inp.k])===String(os[j].v)?' selected':'')+'>'+esc(os[j].t)+'</option>';
      }
      h += '</select>';
    } else {
      // 数値欄も数式を受け付けるため type="text"。inputmode でスマートフォンは数字キーを出す（演算子は opbar で補う）
      var isNum = inp.type !== 'text';
      var inputHtml = '<input type="text"'+(isNum ? ' inputmode="decimal" data-num="1"' : '')+' data-in="'+esc(inp.k)+'" value="'+esc(st[inp.k])+'"'+(isNum ? ' spellcheck="false" autocapitalize="off"' : '')+'>';
      h += inp.unit ? ('<span class="inrow">'+inputHtml+'<span class="unit">'+mf(inp.unit)+'</span></span>') : inputHtml;
      if(isNum) h += '<span class="ev" data-ev="'+esc(inp.k)+'">'+evPreview(st[inp.k])+'</span>';
    }
    if(inp.hint) h += '<span class="hint">'+mf(inp.hint)+'</span>';
    h += '</label>';
  }
  form.innerHTML = h;
}
/** 数値欄の下に出す「= 計算結果」。そのままの数値・空欄なら何も出さない */
function evPreview(raw){
  if(!isExpr(raw)) return '';
  try { return '= ' + esc(fx(evalExpr(raw), 10)); }
  catch(e){ return '<span class="evbad">' + esc(e.message) + '</span>'; }
}
function evalOk(raw){
  if(!isExpr(raw)) return true;
  try { evalExpr(raw); return true; } catch(e){ return false; }
}
function renderRows(inp, rows){
  var h = '<table class="rows"><thead><tr>';
  for(var i=0;i<inp.cols.length;i++){
    h += '<th'+(inp.cols[i].w?' style="width:'+inp.cols[i].w+'"':'')+'>'+esc(inp.cols[i].label)+'</th>';
  }
  h += '<th style="width:34px"></th></tr></thead><tbody>';
  for(var r=0;r<rows.length;r++){
    h += '<tr>';
    for(var cc=0;cc<inp.cols.length;cc++){
      var col = inp.cols[cc], val = rows[r][col.k] === undefined ? '' : rows[r][col.k];
      h += '<td>';
      if(col.type === 'sel'){
        h += '<select data-row="'+esc(inp.k)+'" data-ri="'+r+'" data-ck="'+esc(col.k)+'">';
        for(var o=0;o<col.options.length;o++){
          h += '<option value="'+esc(col.options[o].v)+'"'+(String(val)===String(col.options[o].v)?' selected':'')+'>'+esc(col.options[o].t)+'</option>';
        }
        h += '</select>';
      } else {
        h += '<input type="text"'+(col.type==='text' ? '' : ' inputmode="decimal" data-num="1" spellcheck="false" autocapitalize="off"'+(evalOk(val) ? '' : ' class="bad"'))+' data-row="'+esc(inp.k)+'" data-ri="'+r+'" data-ck="'+esc(col.k)+'" value="'+esc(val)+'">';
      }
      h += '</td>';
    }
    h += '<td><button type="button" class="rowdel" data-del="'+esc(inp.k)+'" data-ri="'+r+'" title="この行を削除">×</button></td></tr>';
  }
  h += '</tbody></table><button type="button" class="rowadd" data-add="'+esc(inp.k)+'">＋ 行を追加</button>';
  return h;
}

/* ============================================================
   計算結果の描画
   ============================================================ */
function renderOut(){
  var c = calcById(curId), st = getState(c), out = document.getElementById('out'), res;
  try {
    var ev = evalInputs(c, st);
    if(ev.errs.length) throw new Error('入力の式を計算できません。' + ev.errs.join('／'));
    res = c.compute(ev.st);
  } catch(e){
    lastOut = null;
    out.innerHTML = '<div class="card"><h2>結果</h2><div class="err">'+esc(e.message)+'</div></div>';
    afterOut(null);
    return;
  }
  lastOut = res;
  out.innerHTML = outHtml(c, st, res);
  afterOut(res);
}
/* ---- スマートフォン向け：結果以外のカードの折りたたみと、画面下の結果バー ---- */
var openCards = {};        // 見出し → 開いているか（計算機を切り替えても保つ）
var resObserver = null, resInView = true, inputFocused = false;
function isMobile(){ return !!(window.matchMedia && window.matchMedia('screen and (max-width:720px)').matches); }
function afterOut(res){
  var out = document.getElementById('out');
  Array.prototype.forEach.call(out.querySelectorAll('.card>h2'), function(h){
    var t = h.textContent;
    if(t === '結果') return;
    h.classList.add('fx');
    if(!openCards[t]) h.parentNode.classList.add('fold');
  });
  var bar = document.getElementById('mres');
  if(bar){
    bar.className = 'mres';
    var d = res && res.head && res.head[0];
    if(d){
      document.getElementById('mresL').textContent = plain(d.l).replace(/<[^>]*>/g, '');
      document.getElementById('mresV').textContent = d.v + (d.u ? ' ' + plain(d.u) : '');
      if(d.tone) bar.classList.add(d.tone);
    } else {
      document.getElementById('mresL').textContent = '結果';
      document.getElementById('mresV').textContent = res ? '—' : '入力を確認してください';
      if(!res) bar.classList.add('err');
    }
  }
  if(resObserver && out.firstElementChild){ resObserver.disconnect(); resObserver.observe(out.firstElementChild); }
  updateResBar();
}
function updateResBar(){
  var bar = document.getElementById('mres');
  if(bar) bar.hidden = resInView || inputFocused || reportView;
}
// 結果欄の HTML（計算書にも同じものを保存する）
function outHtml(c, st, res){
  var h = '';
  if(res.head && res.head.length){
    h += '<div class="card"><h2>結果</h2><div class="heads">';
    for(var i=0;i<res.head.length;i++){
      var d = res.head[i];
      h += '<div class="hd'+(d.tone?' '+d.tone:'')+'"><div class="l">'+mf(d.l)+'</div>';
      h += '<div class="v">'+esc(d.v)+(d.u?'<span class="u">'+mf(d.u)+'</span>':'')+'</div>';
      if(d.n) h += '<div class="n">'+mf(d.n)+'</div>';
      h += '</div>';
    }
    h += '</div></div>';
  }
  h += '<div class="card"><h2>入力値</h2><div class="given">'+givenHtml(c, st)+'</div></div>';
  if(res.steps && res.steps.length){
    h += '<div class="card"><h2>導出</h2><ol class="steps">';
    for(var s=0;s<res.steps.length;s++){
      var p = res.steps[s];
      h += '<li><div class="st-l">'+mf(p.l)+'</div><div class="st-b">';
      if(p.f) h += '<div><span class="k">式</span><span class="x">'+mf(p.f)+'</span></div>';
      if(p.s) h += '<div><span class="k">代入</span><span class="x">'+mf(p.s).replace(/\n/g,'<br>')+'</span></div>';
      if(p.r) h += '<div class="r-row"><span class="k">結果</span><span class="x">'+mf(p.r)+'</span></div>';
      h += '</div>';
      if(p.n) h += '<div class="st-n">'+mf(p.n)+'</div>';
      h += '</li>';
    }
    h += '</ol></div>';
  }
  if(res.tables && res.tables.length){
    h += '<div class="card"><h2>表</h2>';
    for(var t=0;t<res.tables.length;t++){
      var tb = res.tables[t];
      if(tb.title) h += '<p class="tbl-t">'+mf(tb.title)+'</p>';
      h += '<div class="tblwrap"><table class="out"><thead><tr>';
      for(var th=0;th<tb.head.length;th++) h += '<th>'+mf(tb.head[th])+'</th>';
      h += '</tr></thead><tbody>';
      var list = tb.rows2 ? tb.rows2 : (tb.rows || []).map(function(r){ return {cells:r, tone:null}; });
      for(var r2=0;r2<list.length;r2++){
        h += '<tr'+(list[r2].tone?' class="'+list[r2].tone+'"':'')+'>';
        for(var cx=0;cx<list[r2].cells.length;cx++) h += '<td>'+mf(list[r2].cells[cx])+'</td>';
        h += '</tr>';
      }
      h += '</tbody></table></div>';
    }
    h += '</div>';
  }
  if(res.notes && res.notes.length){
    h += '<div class="card"><h2>注記・根拠</h2><ul class="notes">';
    for(var n=0;n<res.notes.length;n++) h += '<li>'+mf(res.notes[n])+'</li>';
    h += '</ul></div>';
  }
  return h;
}
/** 数式で入力された値は「式 = 値」の形で記録する（計算書で入力の根拠を追えるように） */
function withExpr(raw, val){
  return isExpr(raw) ? String(raw).trim() + ' = ' + fx(Number(val), 10) : raw;
}
function givenHtml(c, st){
  var h = '', ev = evalInputs(c, st).st;
  for(var i=0;i<c.inputs.length;i++){
    var inp = c.inputs[i];
    if(!visible(inp, ev)) continue;
    if(inp.type === 'rows'){
      var n = 0, rs = st[inp.k] || [];
      for(var r=0;r<rs.length;r++){
        var any = false;
        for(var ck in rs[r]) if(rs[r][ck] !== '') any = true;
        if(any) n++;
      }
      h += '<div><span class="gl">'+esc(inp.label)+'</span><span class="gv">'+n+' 行</span></div>';
      continue;
    }
    var val = st[inp.k];
    if(val === '' || val === undefined) continue;
    if(inp.type === 'sel'){
      var os = optionsFor(inp, st);
      for(var o=0;o<os.length;o++) if(String(os[o].v) === String(val)) val = os[o].t;
    } else {
      val = (inp.type === 'text' ? val : withExpr(val, ev[inp.k])) + (inp.unit ? ' ' + inp.unit : '');
    }
    h += '<div><span class="gl">'+esc(inp.label)+'</span><span class="gv">'+esc(val)+'</span></div>';
  }
  return h;
}

/* ============================================================
   テキスト書き出し
   ============================================================ */
function stampText(){
  var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
  return '（計算機 v' + APP_VERSION + '／計算日時 ' + d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '）';
}
function plain(s){ return String(s).replace(/_\{([^}]*)\}/g,'$1').replace(/\^\{([^}]*)\}/g,'^$1'); }
function outText(){
  var c = calcById(curId);
  if(!lastOut) return '（計算できていません）';
  return outTextFor(c, getState(c), lastOut, stampText());
}
function outTextFor(c, st, lastOut, stamp){
  var L = ['■ '+plain(c.title), c.sub, stamp, ''];
  if(lastOut.head){
    L.push('【結果】');
    for(var i=0;i<lastOut.head.length;i++){
      var d = lastOut.head[i];
      L.push('  '+plain(d.l)+' : '+d.v+(d.u?' '+plain(d.u):'')+(d.n?'  （'+plain(d.n)+'）':''));
    }
    L.push('');
  }
  L.push('【入力値】');
  var ev = evalInputs(c, st).st;
  for(var j=0;j<c.inputs.length;j++){
    var inp = c.inputs[j];
    if(!visible(inp, ev)) continue;
    if(inp.type === 'rows'){
      var rs = st[inp.k] || [];
      for(var r=0;r<rs.length;r++){
        var parts = [];
        for(var k=0;k<inp.cols.length;k++){
          var vv = rs[r][inp.cols[k].k];
          if(vv !== '' && vv !== undefined) parts.push(inp.cols[k].label+'='+(inp.cols[k].type === 'num' ? withExpr(vv, ev[inp.k][r][inp.cols[k].k]) : vv));
        }
        if(parts.length) L.push('  '+inp.label+' #'+(r+1)+' : '+parts.join(', '));
      }
    } else if(st[inp.k] !== ''){
      var val = st[inp.k];
      if(inp.type === 'sel'){
        var os = optionsFor(inp, st);
        for(var o=0;o<os.length;o++) if(String(os[o].v) === String(val)) val = os[o].t;
      } else if(inp.type === 'text') val = val + (inp.unit ? ' ' + inp.unit : '');
      else val = withExpr(val, ev[inp.k]) + (inp.unit ? ' ' + inp.unit : '');
      L.push('  '+inp.label+' : '+val);
    }
  }
  L.push('');
  if(lastOut.steps){
    L.push('【導出】');
    for(var s=0;s<lastOut.steps.length;s++){
      var p = lastOut.steps[s];
      L.push('  '+(s+1)+'. '+plain(p.l));
      if(p.f) L.push('     式   : '+plain(p.f));
      if(p.s) L.push('     代入 : '+plain(p.s).replace(/\n/g,'\n            '));
      if(p.r) L.push('     結果 : '+plain(p.r));
      if(p.n) L.push('     ※ '+plain(p.n));
    }
    L.push('');
  }
  if(lastOut.tables){
    for(var t=0;t<lastOut.tables.length;t++){
      var tb = lastOut.tables[t];
      L.push('【'+plain(tb.title || '表')+'】');
      L.push('  '+tb.head.map(plain).join(' | '));
      var list = tb.rows2 ? tb.rows2 : (tb.rows || []).map(function(r){ return {cells:r}; });
      for(var r3=0;r3<list.length;r3++) L.push('  '+list[r3].cells.map(plain).join(' | '));
      L.push('');
    }
  }
  if(lastOut.notes){
    L.push('【注記・根拠】');
    for(var n=0;n<lastOut.notes.length;n++) L.push('  ・'+plain(lastOut.notes[n]));
  }
  return L.join('\n');
}

/* ============================================================
   ナビゲーション
   ============================================================ */
function renderNav(){
  var tabs = document.getElementById('tabs'), chips = document.getElementById('chips');
  var th = '';
  for(var i=0;i<CATS.length;i++){
    th += '<button class="tab" role="tab" data-cat="'+CATS[i].id+'" aria-selected="'+(CATS[i].id===curCat)+'">'+esc(CATS[i].name)+'</button>';
  }
  tabs.innerHTML = th;
  var q = (document.getElementById('q').value || '').toLowerCase();
  var ch = '', shown = 0;
  for(var j=0;j<CALCS.length;j++){
    var c = CALCS[j];
    var cn = '';
    for(var t=0;t<CATS.length;t++) if(CATS[t].id === c.cat) cn = CATS[t].name;
    var match = q ? ((c.title + ' ' + c.sub + ' ' + c.id + ' ' + cn).toLowerCase().indexOf(q) >= 0) : (c.cat === curCat);
    if(!match) continue;
    shown++;
    ch += '<button class="chip" data-id="'+esc(c.id)+'" aria-current="'+(c.id===curId)+'">'+esc(shortTitle(c.title))+'</button>';
  }
  if(!shown) ch = '<span style="color:var(--fg3);font-size:13px">該当する機能がありません</span>';
  chips.innerHTML = ch;
}
// 機能選択シートは 2 階層：カテゴリ一覧（pkCat = null）→ そのカテゴリの機能一覧。検索中だけ全カテゴリを横断して並べる
var pkCat = null;
function catName(id){
  for(var t=0;t<CATS.length;t++) if(CATS[t].id === id) return CATS[t].name;
  return '';
}
function renderPicker(){
  var q = (document.getElementById('pq').value || '').toLowerCase(), h = '', j, c;
  var chev = '<span class="chev" aria-hidden="true">›</span>';

    for(j=0;j<CALCS.length;j++){
      c = CALCS[j];
      if((c.title + ' ' + c.sub + ' ' + c.id + ' ' + catName(c.cat)).toLowerCase().indexOf(q) < 0) continue;
      h += '<button type="button" class="pk-it" data-id="'+esc(c.id)+'" aria-current="'+(c.id===curId)+'"><span class="t">'+mf(c.title)+'<span class="s">'+esc(catName(c.cat))+'</span></span></button>';
    }
    h = h ? '<div class="pk-cat">検索結果</div><div class="pk-grp">' + h + '</div>' : '<p class="pk-none">該当する機能がありません</p>';
  } else if(pkCat === null){
    for(var t=0;t<CATS.length;t++){
      var n = 0;
      for(j=0;j<CALCS.length;j++) if(CALCS[j].cat === CATS[t].id) n++;
      var here = (calcById(curId).cat === CATS[t].id);
      h += '<button type="button" class="pk-it" data-cat="'+esc(CATS[t].id)+'" aria-current="'+here+'"><span class="t">'+esc(CATS[t].name)+
        (here ? '<span class="s">使用中：'+esc(shortTitle(calcById(curId).title))+'</span>' : '')+'</span><span class="n">'+n+'</span>'+chev+'</button>';
    }
    h = '<div class="pk-cat">カテゴリ</div><div class="pk-grp">' + h + '</div>';
  } else {
    h = '<button type="button" class="pk-back" data-back="1">‹ カテゴリ</button><div class="pk-cat">'+esc(catName(pkCat))+'</div><div class="pk-grp">';
    for(j=0;j<CALCS.length;j++){
      c = CALCS[j];
      if(c.cat !== pkCat) continue;
      h += '<button type="button" class="pk-it" data-id="'+esc(c.id)+'" aria-current="'+(c.id===curId)+'"><span class="t">'+mf(c.title)+'</span></button>';
    }
    h += '</div>';
  }
  document.getElementById('pkList').innerHTML = h;
}
function openPicker(on){
  var pk = document.getElementById('picker');
  pk.hidden = !on;
  document.body.style.overflow = on ? 'hidden' : '';
  if(on){
    document.getElementById('pq').value = '';
    pkCat = calcById(curId).cat;   // いま使っている機能のカテゴリから始める
    renderPicker();
    pk.scrollTop = 0;
  }
}
function shortTitle(t){
  var i = t.indexOf('（');
  return (i > 0) ? t.slice(0, i) : t;
}
function selectCalc(id){
  if(reportView) setReportView(false);
  curId = id;
  var c = calcById(id);
  curCat = c.cat;
  document.getElementById('ctitle').innerHTML = mf(c.title);
  document.getElementById('csub').textContent = c.sub;
  document.getElementById('pickName').textContent = shortTitle(c.title);
  renderNav();
  renderForm();
  renderOut();
  resetLabel();
  try { localStorage.setItem(STORE_KEY+':last', id); } catch(e){}
}
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(states)); } catch(e){}
}
function restore(){
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) states = JSON.parse(raw) || {};
  } catch(e){ states = {}; }
  // 保存内容が現在の定義と食い違う場合に備えて補完する
  for(var i=0;i<CALCS.length;i++){
    var c = CALCS[i];
    if(!states[c.id]) continue;
    var fresh = initState(c);
    for(var k in fresh) if(!(k in states[c.id])) states[c.id][k] = fresh[k];
  }
}
/* ============================================================
   計算書（複数の計算をまとめてコピー・印刷する）
   追加した時点の入力・結果・導出をそのまま保存する。あとで入力を変えても計算書は変わらない。
   ============================================================ */
var REPORT_KEY = STORE_KEY + ':report';
var REPORT_MAX = 50;
var report = [];
var reportView = false;
var clearArm = null;
function loadReport(){
  try { var r = JSON.parse(localStorage.getItem(REPORT_KEY) || '[]'); report = Array.isArray(r) ? r : []; }
  catch(e){ report = []; }
}
function saveReport(){
  try { localStorage.setItem(REPORT_KEY, JSON.stringify(report)); }
  catch(e){ toast('ブラウザに保存できませんでした（計算書はこの画面を閉じるまで有効です）'); }
}
function addToReport(){
  var c = calcById(curId), st = getState(c);
  if(!lastOut){ toast('計算できていないため追加できません'); return; }
  if(report.length >= REPORT_MAX){ toast('計算書は ' + REPORT_MAX + ' 件までです'); return; }
  var stamp = stampText();
  report.push({ id: c.id, title: c.title, stamp: stamp,
    state: JSON.parse(JSON.stringify(st)),
    head: (lastOut.head || []).slice(0, 3).map(function(d){ return plain(d.l) + ' ' + d.v + (d.u ? ' ' + plain(d.u) : ''); }),
    html: outHtml(c, st, lastOut), text: outTextFor(c, st, lastOut, stamp) });
  saveReport(); updateReportBtn();
  toast('計算書に追加しました（' + report.length + ' 件）');
}
function updateReportBtn(){
  document.getElementById('btnReport').textContent = reportView ? '計算画面に戻る' : '計算書（' + report.length + '）';
  document.getElementById('btnAdd').hidden = reportView;
  document.getElementById('btnCopy').hidden = reportView;
}
function setReportView(on){
  reportView = on;
  document.getElementById('calcView').hidden = on;
  document.getElementById('reportView').hidden = !on;
  if(on) renderReport();
  updateReportBtn();
  updateResBar();
  window.scrollTo(0, 0);
}
function renderReport(){
  var box = document.getElementById('rlist'), n = report.length;
  document.getElementById('rcount').textContent = n ? '（' + n + ' 件）' : '';
  document.getElementById('btnRCopy').disabled = document.getElementById('btnRPrint').disabled =
    document.getElementById('btnRClear').disabled = !n;
  if(!n){
    box.innerHTML = '<div class="card rempty">計算書は空です。各計算機の画面で［計算書に追加］を押すと、その時点の入力・結果・導出がここに保存されます。</div>';
    return;
  }
  var h = '';
  for(var i = 0; i < n; i++){
    var it = report[i];
    h += '<section class="ritem"><div class="rbar"><div class="rttl"><span class="rno">' + (i+1) + '.</span> ' + mf(it.title) +
      '<span class="rstamp">' + esc(it.stamp) + '</span></div><div class="rbtns">' +
      '<button type="button" class="iconbtn" data-rmove="' + i + ',-1"' + (i ? '' : ' disabled') + ' title="上へ">↑</button>' +
      '<button type="button" class="iconbtn" data-rmove="' + i + ',1"' + (i < n-1 ? '' : ' disabled') + ' title="下へ">↓</button>' +
      '<button type="button" class="iconbtn" data-ropen="' + i + '" title="この時の入力で計算機を開く（その計算機の今の入力は置き換わります）">入力を開く</button>' +
      '<button type="button" class="iconbtn" data-rdel="' + i + '">削除</button></div></div>' +
      '<div class="rsum">' + it.head.map(esc).join('　／　') + '</div>' +
      '<details class="rdet"><summary>入力値・導出・表・注記を表示</summary>' + it.html + '</details></section>';
  }
  box.innerHTML = h;
}
function reportText(){
  var L = ['計算書（' + report.length + ' 件）', stampText().replace('計算日時', '作成日時'), ''];
  for(var i = 0; i < report.length; i++){
    L.push('════════ ' + (i+1) + ' / ' + report.length + ' ════════');
    L.push(report[i].text);
    L.push('');
  }
  return L.join('\n');
}
function onReportClick(e){
  var b = e.target.closest('button');
  if(!b || b.disabled) return;
  if(b.hasAttribute('data-rmove')){
    var p = b.getAttribute('data-rmove').split(','), i = Number(p[0]), j = i + Number(p[1]);
    var t = report[i]; report[i] = report[j]; report[j] = t;
    saveReport(); renderReport();
  } else if(b.hasAttribute('data-rdel')){
    report.splice(Number(b.getAttribute('data-rdel')), 1);
    saveReport(); renderReport(); updateReportBtn();
  } else if(b.hasAttribute('data-ropen')){
    var it = report[Number(b.getAttribute('data-ropen'))];
    if(calcById(it.id).id !== it.id){ toast('この計算機は現在の版にありません'); return; }
    clearUndo();
    // 保存時点から入力項目が増えていても開けるよう、足りない項目は既定値で補う
    var st = JSON.parse(JSON.stringify(it.state)), fresh = initState(calcById(it.id));
    for(var k in fresh) if(!(k in st)) st[k] = fresh[k];
    states[it.id] = st;
    persist();
    selectCalc(it.id);
    toast('計算書の入力を読み込みました');
  }
}
function clearReport(){
  var b = document.getElementById('btnRClear');
  if(clearArm){
    clearTimeout(clearArm); clearArm = null;
    report = []; saveReport(); renderReport(); updateReportBtn();
    b.textContent = 'すべて削除';
    toast('計算書を空にしました');
  } else {
    // 確認ダイアログは使わず、4 秒以内にもう一度押したら削除する
    b.textContent = 'もう一度押すと全件削除';
    clearArm = setTimeout(function(){ clearArm = null; b.textContent = 'すべて削除'; }, 4000);
  }
}
function resetLabel(){
  document.getElementById('btnReset').textContent = (undoReset && undoReset.id === curId) ? '元に戻す' : '既定値に戻す';
}
function clearUndo(){
  if(!undoReset) return;
  clearTimeout(undoReset.timer);
  undoReset = null;
  resetLabel();
}
function resetOrUndo(){
  var c = calcById(curId);
  if(undoReset && undoReset.id === curId){
    states[curId] = undoReset.state;
    clearUndo();
    toast('入力を元に戻しました');
  } else {
    clearUndo();
    undoReset = { id: curId, state: JSON.parse(JSON.stringify(getState(c))),
                  timer: setTimeout(clearUndo, 10000) };
    states[curId] = initState(c);
    toast('既定値に戻しました（10 秒以内なら「元に戻す」で取り消せます）');
  }
  renderForm(); renderOut(); persist(); resetLabel();
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 1600);
}

function init(){
  restore();
  var last = null;
  try { last = localStorage.getItem(STORE_KEY+':last'); } catch(e){}
  selectCalc(last && calcById(last).id === last ? last : CALCS[0].id);

  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-cat]');
    if(!b) return;
    curCat = b.getAttribute('data-cat');
    document.getElementById('q').value = '';
    var first = null;
    for(var i=0;i<CALCS.length;i++) if(CALCS[i].cat === curCat){ first = CALCS[i].id; break; }
    if(first) selectCalc(first);
  });
  document.getElementById('chips').addEventListener('click', function(e){
    var b = e.target.closest('[data-id]');
    if(b) selectCalc(b.getAttribute('data-id'));
  });
  document.getElementById('q').addEventListener('input', renderNav);

  var form = document.getElementById('form');
  form.addEventListener('input', function(e){
    clearUndo();   // 戻した後に入力し直したら、取り消しで上書きしない
    var t = e.target, st = getState(calcById(curId));
    if(t.hasAttribute('data-in')){
      var c = calcById(curId), key = t.getAttribute('data-in');
      // 数値入力に連動して現れる欄（接地の電極間隔など）もあるため、
      // 入力前後でフォームの構成が変わったときだけ描き直す。
      var sigBefore = formSig(c, st);
      st[key] = t.value;
      var evs = document.querySelector('#form [data-ev="' + key + '"]');
      if(evs) evs.innerHTML = evPreview(t.value);
      if(formSig(c, st) !== sigBefore){
        var pos = null;
        try { pos = t.selectionStart; } catch(e){}
        renderForm();
        var again = document.querySelector('#form [data-in="' + key + '"]');
        if(again){
          again.focus();
          if(pos !== null){ try { again.setSelectionRange(pos, pos); } catch(e){} }
        }
      }
      renderOut(); persist();
    } else if(t.hasAttribute('data-row')){
      var rk = t.getAttribute('data-row'), ri = Number(t.getAttribute('data-ri')), ck = t.getAttribute('data-ck');
      if(t.hasAttribute('data-num')) t.classList.toggle('bad', !evalOk(t.value));
      if(st[rk] && st[rk][ri]){ st[rk][ri][ck] = t.value; renderOut(); persist(); }
    }
  });
  form.addEventListener('change', function(e){
    if(e.target.tagName === 'SELECT'){ renderForm(); renderOut(); persist(); }
  });
  form.addEventListener('click', function(e){
    if(e.target.closest('[data-add],[data-del]')) clearUndo();
    var st = getState(calcById(curId)), c = calcById(curId);
    var add = e.target.closest('[data-add]');
    if(add){
      var ak = add.getAttribute('data-add'), inp = null;
      for(var i=0;i<c.inputs.length;i++) if(c.inputs[i].k === ak) inp = c.inputs[i];
      var o = {};
      for(var j=0;j<inp.cols.length;j++) o[inp.cols[j].k] = (inp.cols[j].type==='sel' && inp.cols[j].options.length) ? inp.cols[j].options[0].v : '';
      st[ak].push(o);
      renderForm(); renderOut(); persist();
      return;
    }
    var del = e.target.closest('[data-del]');
    if(del){
      var dk = del.getAttribute('data-del'), di = Number(del.getAttribute('data-ri'));
      if(st[dk] && st[dk].length > 1){ st[dk].splice(di, 1); renderForm(); renderOut(); persist(); }
      else toast('最後の1行は削除できません');
    }
  });

  document.getElementById('btnAdd').addEventListener('click', addToReport);
  document.getElementById('btnReport').addEventListener('click', function(){ setReportView(!reportView); });
  document.getElementById('rlist').addEventListener('click', onReportClick);
  document.getElementById('btnRClear').addEventListener('click', clearReport);
  document.getElementById('btnRPrint').addEventListener('click', function(){ window.print(); });
  document.getElementById('btnRCopy').addEventListener('click', function(){
    copyText(reportText(), '計算書（' + report.length + ' 件）をコピーしました');
  });
  document.getElementById('btnCopy').addEventListener('click', function(){
    var txt = outText();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('計算結果と導出をコピーしました'); },
        function(){ fallbackCopy(txt); });
    } else fallbackCopy(txt);
  });
  function copyText(txt, msg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast(msg); }, function(){ fallbackCopy(txt, msg); });
    } else fallbackCopy(txt, msg);
  }
  function fallbackCopy(txt, msg){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg || '計算結果と導出をコピーしました'); }
    catch(e){ toast('コピーできませんでした'); }
    document.body.removeChild(ta);
  }
  document.getElementById('btnPrint').addEventListener('click', function(){ window.print(); });
  document.getElementById('btnReset').addEventListener('click', resetOrUndo);
  // 印刷した計算書に版数と日時を載せる（画面では非表示）
  window.addEventListener('beforeprint', function(){
    document.getElementById('cmeta').textContent = stampText();
    document.getElementById('rmeta').textContent = stampText().replace('計算日時', '印刷日時');
    // 計算書は折りたたみを全部開いて印刷し、終わったら元に戻す
    Array.prototype.forEach.call(document.querySelectorAll('#rlist details'), function(d){ d.setAttribute('data-was', d.open ? '1' : ''); d.open = true; });
  });
  window.addEventListener('afterprint', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#rlist details'), function(d){ d.open = d.getAttribute('data-was') === '1'; });
  });
  initMobile();
  loadReport(); updateReportBtn();
  document.getElementById('appver').textContent = '　v' + APP_VERSION;
  document.getElementById('btnTheme').addEventListener('click', function(){
    var el = document.documentElement, cur = el.getAttribute('data-theme');
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = cur ? (cur === 'dark' ? 'light' : 'dark') : (dark ? 'light' : 'dark');
    el.setAttribute('data-theme', next);
    try { localStorage.setItem(STORE_KEY+':theme', next); } catch(e){}
  });
  try {
    var th = localStorage.getItem(STORE_KEY+':theme');
    if(th) document.documentElement.setAttribute('data-theme', th);
  } catch(e){}
}

/* スマートフォン向けの操作（機能選択シート、メニュー、演算子キー、結果バー、折りたたみ） */
function initMobile(){
  var header = document.querySelector('header'), menuBtn = document.getElementById('btnMenu');
  function setMenu(on){
    header.classList.toggle('menu-open', on);
    menuBtn.setAttribute('aria-expanded', String(on));
  }
  menuBtn.addEventListener('click', function(e){ e.stopPropagation(); setMenu(!header.classList.contains('menu-open')); });
  document.getElementById('hbtns').addEventListener('click', function(e){ if(e.target.closest('button')) setMenu(false); });
  document.addEventListener('click', function(e){
    if(header.classList.contains('menu-open') && !e.target.closest('#hbtns')) setMenu(false);
  });

  document.getElementById('btnPick').addEventListener('click', function(){ openPicker(true); });
  document.getElementById('pkClose').addEventListener('click', function(){ openPicker(false); });
  document.getElementById('pq').addEventListener('input', renderPicker);
  document.getElementById('pkList').addEventListener('click', function(e){
    var nav = e.target.closest('[data-cat],[data-back]');
    if(nav){
      pkCat = nav.hasAttribute('data-back') ? null : nav.getAttribute('data-cat');
      renderPicker();
      document.getElementById('picker').scrollTop = 0;
      return;
    }
    var b = e.target.closest('[data-id]');
    if(!b) return;
    openPicker(false);
    selectCalc(b.getAttribute('data-id'));
    window.scrollTo(0, 0);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ if(!document.getElementById('picker').hidden) openPicker(false); setMenu(false); }
  });

  // 結果カードの見出しをタップして開閉（スマートフォン表示のときだけ）
  document.getElementById('out').addEventListener('click', function(e){
    var h = e.target.closest('.card>h2.fx');
    if(!h || !isMobile()) return;
    var card = h.parentNode, open = card.classList.contains('fold');
    card.classList.toggle('fold', !open);
    openCards[h.textContent] = open;
  });

  // 画面下の結果バー：結果カードが画面外にあるときだけ出す
  var bar = document.getElementById('mres');
  bar.addEventListener('click', function(){
    var t = document.getElementById('out').firstElementChild;
    if(t) window.scrollTo(0, t.getBoundingClientRect().top + window.pageYOffset - document.querySelector('header').offsetHeight - 8);
  });
  if(window.IntersectionObserver){
    resObserver = new IntersectionObserver(function(ents){
      resInView = ents[ents.length - 1].isIntersecting;
      updateResBar();
    });
    var first = document.getElementById('out').firstElementChild;
    if(first) resObserver.observe(first);
  }

  // 演算子キー：iPhone の数字キーボードにない + × ÷ ^ ( ) を補う。タッチ操作の端末で数値欄にいるときだけ出す
  var form = document.getElementById('form'), opbar = document.getElementById('opbar'), target = null, hideT = null;
  var coarse = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  function placeOpbar(){
    if(!target) return;
    var card = opbar.parentNode;
    opbar.hidden = false;
    var top = target.getBoundingClientRect().top - card.getBoundingClientRect().top - opbar.offsetHeight - 6;
    opbar.style.top = Math.max(-opbar.offsetHeight, top) + 'px';
  }
  form.addEventListener('focusin', function(e){
    clearTimeout(hideT);
    inputFocused = true; updateResBar();
    if(coarse && e.target.hasAttribute('data-num')){ target = e.target; placeOpbar(); }
    else { target = null; opbar.hidden = true; }
  });
  form.addEventListener('focusout', function(){
    hideT = setTimeout(function(){
      if(form.contains(document.activeElement)) return;
      inputFocused = false; target = null; opbar.hidden = true; updateResBar();
    }, 150);
  });
  function press(e){
    var b = e.target.closest('[data-op]');
    e.preventDefault();   // 入力欄からフォーカスを外さない（キーボードを閉じない）
    if(!b || !target) return;
    var op = b.getAttribute('data-op'), v = target.value, a = target.selectionStart, z = target.selectionEnd;
    if(a === null || a === undefined){ a = z = v.length; }
    target.value = v.slice(0, a) + op + v.slice(z);
    try { target.setSelectionRange(a + op.length, a + op.length); } catch(err){}
    var key = target.getAttribute('data-in');
    target.dispatchEvent(new Event('input', {bubbles:true}));
    // 欄の構成が変わってフォームが描き直された場合は新しい欄に付け替える
    if(!document.body.contains(target) && key){
      target = document.querySelector('#form [data-in="' + key + '"]');
    }
    placeOpbar();
  }
  opbar.addEventListener('touchstart', press, {passive:false});
  opbar.addEventListener('mousedown', press);
}

if(typeof document !== 'undefined' && document.getElementById){
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
}
if(typeof module !== 'undefined' && module.exports){
  module.exports = {CALCS:CALCS, CATS:CATS, fx:fx, fd:fd, initState:initState, soundSpeed:soundSpeed};
}
</script>
