<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音響・電気通信工事・映像 計算機</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#fbfcfe; --line:#d7dee8; --line2:#e8edf4;
  --fg:#16202e; --fg2:#5b6b81; --fg3:#8a99ad;
  --accent:#1f6feb; --accent2:#e7f0fe;
  --ok:#0f7b4f; --okbg:#e6f5ee; --warn:#9a6400; --warnbg:#fdf3de; --bad:#b3261e; --badbg:#fdeceb;
  --mono:"Consolas","SFMono-Regular","Menlo","Courier New",monospace;
  --sans:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --panel:#191f27; --panel2:#151a21; --line:#2c3642; --line2:#232b35;
    --fg:#e6edf5; --fg2:#9fb0c4; --fg3:#6f8095;
    --accent:#5c9cff; --accent2:#1c2b45;
    --ok:#5fd39b; --okbg:#12281f; --warn:#e8b558; --warnbg:#2e2413; --bad:#ff8a80; --badbg:#331b1a;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --panel:#191f27; --panel2:#151a21; --line:#2c3642; --line2:#232b35;
  --fg:#e6edf5; --fg2:#9fb0c4; --fg3:#6f8095;
  --accent:#5c9cff; --accent2:#1c2b45;
  --ok:#5fd39b; --okbg:#12281f; --warn:#e8b558; --warnbg:#2e2413; --bad:#ff8a80; --badbg:#331b1a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;padding:10px 16px 0}
.htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em}
h1 small{font-weight:400;color:var(--fg3);font-size:12px;margin-left:8px}
.spacer{flex:1}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--fg2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.mpick,.mmenu,.mres{display:none}
.picker[hidden],.opbar[hidden]{display:none}
.tab{flex:none;white-space:nowrap;background:none;border:none;border-bottom:2px solid transparent;color:var(--fg2);padding:8px 14px;font-size:14px;font-weight:550;cursor:pointer;font-family:inherit;border-radius:6px 6px 0 0}
.tab:hover{color:var(--fg);background:var(--panel2)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 12px;border-top:1px solid var(--line2);margin-top:-1px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--fg2);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.search{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 10px;font-size:13px;font-family:inherit;width:190px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.calc-title{font-size:20px;font-weight:650;margin:0 0 2px}
.calc-sub{color:var(--fg2);font-size:13px;margin:0 0 16px}
.calc-meta{display:none}
.grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
.grid>*{min-width:0}
@media(max-width:880px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card+.card{margin-top:14px}
.card h2{font-size:12px;font-weight:650;letter-spacing:.06em;color:var(--fg3);text-transform:uppercase;margin:0 0 12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.card-h h2{margin:0}
.resetbtn{padding:3px 9px;font-size:11.5px}
.iconbtn:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--fg2)}
#calcView[hidden],#reportView[hidden],.iconbtn[hidden]{display:none}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rcount{font-size:13px;color:var(--fg3);font-weight:400;margin-left:6px}
.rtools{display:flex;gap:6px;flex-wrap:wrap}
.ritem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.rbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.rttl{font-weight:650;font-size:15px}
.rno{color:var(--accent)}
.rstamp{display:block;font-weight:400;font-size:11.5px;color:var(--fg3);margin-top:2px}
.rbtns{display:flex;gap:4px;flex-wrap:wrap}
.rbtns .iconbtn{padding:3px 8px;font-size:11.5px}
.rsum{margin-top:8px;font-size:13px;color:var(--fg2)}
.rdet{margin-top:8px}
.rdet>summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
.rdet .card{margin-top:10px}
.rempty{color:var(--fg2);font-size:13px;margin-top:14px}
label.f{display:block;margin-bottom:11px}
label.f>.lb{display:block;font-size:12.5px;color:var(--fg2);margin-bottom:3px;font-weight:550}
label.f>.hint{display:block;font-size:11.5px;color:var(--fg3);margin-top:3px;line-height:1.45}
.inrow{display:flex;align-items:stretch}
input[type=number],input[type=text],select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:15px;font-family:var(--mono);min-width:0}
select{font-family:var(--sans);font-size:14px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.inrow>input{border-radius:8px 0 0 8px}
.inrow>.unit{background:var(--line2);border:1px solid var(--line);border-left:none;border-radius:0 8px 8px 0;color:var(--fg2);font-size:12.5px;padding:8px 10px;display:flex;align-items:center;white-space:nowrap}
table.rows{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.rows th{text-align:left;font-size:11.5px;color:var(--fg3);font-weight:600;padding:0 4px 4px}
table.rows td{padding:2px;overflow:hidden}
table.rows input,table.rows select{padding:6px 7px;font-size:13.5px;border-radius:6px}
.rowdel{background:none;border:1px solid var(--line);color:var(--fg3);border-radius:6px;width:26px;height:30px;cursor:pointer;font-size:14px;line-height:1}
.rowdel:hover{color:var(--bad);border-color:var(--bad)}
.rowadd{margin-top:6px;background:var(--panel2);border:1px dashed var(--line);color:var(--fg2);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;width:100%}
.rowadd:hover{border-color:var(--accent);color:var(--accent)}
.heads{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hd{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.hd .l{font-size:11.5px;color:var(--fg2);font-weight:550;line-height:1.35}
.hd .v{font-size:23px;font-weight:650;font-family:var(--mono);letter-spacing:-.01em;margin-top:2px;word-break:break-all}
.hd .v .u{font-size:13px;font-weight:500;color:var(--fg2);margin-left:3px;font-family:var(--sans)}
.hd .n{font-size:11.5px;color:var(--fg3);margin-top:3px;line-height:1.4}
.hd.ok{border-left-color:var(--ok);background:var(--okbg)}
.hd.ok .v{color:var(--ok)}
.hd.warn{border-left-color:var(--warn);background:var(--warnbg)}
.hd.warn .v{color:var(--warn)}
.hd.bad{border-left-color:var(--bad);background:var(--badbg)}
.hd.bad .v{color:var(--bad)}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 14px 34px;border-left:1px solid var(--line);margin-left:11px}
ol.steps>li:last-child{border-left-color:transparent;padding-bottom:0}
ol.steps>li::before{content:counter(s);position:absolute;left:-11px;top:1px;width:22px;height:22px;border-radius:50%;background:var(--accent2);color:var(--accent);border:1px solid var(--line);font-size:11.5px;font-weight:650;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.st-l{font-size:13.5px;font-weight:600;margin-bottom:5px;line-height:1.4}
.st-b{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.st-b>div{display:flex;gap:8px;padding:6px 10px;font-family:var(--mono);font-size:13.5px;line-height:1.65;align-items:baseline;flex-wrap:wrap}
.st-b>div+div{border-top:1px solid var(--line2)}
.st-b .k{font-family:var(--sans);font-size:10.5px;color:var(--fg3);font-weight:650;letter-spacing:.05em;min-width:32px;flex:none;padding-top:2px}
.st-b .x{flex:1;min-width:0;word-break:break-word}
.st-b .r-row{background:var(--accent2)}
.st-b .r-row .x{font-weight:650;color:var(--accent)}
.st-n{font-size:12px;color:var(--fg3);margin-top:5px;line-height:1.5}
sub,sup{font-size:.72em;font-family:var(--mono)}
table.out{width:100%;min-width:max-content;border-collapse:collapse;font-size:13px;font-family:var(--mono)}
table.out th{background:var(--panel2);text-align:left;font-family:var(--sans);font-size:11.5px;color:var(--fg2);font-weight:650;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.out td{padding:6px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.out tr:last-child td{border-bottom:none}
table.out tr.bad td{background:var(--badbg);color:var(--bad)}
table.out tr.warn td{background:var(--warnbg)}
table.out tr.ok td{background:var(--okbg)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl-t{font-size:12.5px;font-weight:600;color:var(--fg2);margin:0 0 6px}
.tblwrap+.tbl-t{margin-top:14px}
ul.notes{margin:0;padding-left:18px;font-size:12.5px;color:var(--fg2);line-height:1.65}
ul.notes li{margin-bottom:4px}
ul.notes li::marker{color:var(--fg3)}
.given{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px 14px;font-size:12.5px}
.given>div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line2)}
.given .gl{color:var(--fg2)}
.given .gv{font-family:var(--mono);font-weight:600;text-align:right}
label.f>.ev{display:block;font-family:var(--mono);font-size:12.5px;color:var(--accent);margin-top:3px}
label.f>.ev:empty{display:none}
.evbad{color:var(--bad);font-family:var(--sans)}
table.rows input.bad{border-color:var(--bad);outline-color:var(--bad)}
.incard{position:relative}
.opbar{position:absolute;left:10px;right:10px;z-index:15;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.opbar button{flex:1;min-width:0;height:40px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:7px;font-size:18px;font-family:var(--mono);cursor:pointer;touch-action:manipulation}
.opbar button:active{background:var(--accent2);color:var(--accent)}
.err{background:var(--warnbg);border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:12px 14px;font-size:13.5px}
footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--fg3);font-size:11.5px;line-height:1.6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
@media(max-width:420px){
  main{padding:14px 10px 50px}
  .card{padding:13px}
  .hwrap{padding:10px 10px 0}
  table.rows input,table.rows select{padding:5px 4px;font-size:12.5px}
  table.rows th{font-size:10.5px}
  .hd .v{font-size:20px}
}
/* ---- スマートフォン（画面のみ。印刷には効かせない） ---- */
@media screen and (max-width:720px){
  .hwrap{padding:8px 10px}
  .htop{flex-wrap:nowrap;gap:8px;position:relative}
  h1,.search,.tabs,.chips,.htop>.spacer{display:none}
  .mpick{display:flex;align-items:center;gap:6px;flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600;font-family:inherit;text-align:left;cursor:pointer}
  .mpick .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mpick .caret{color:var(--fg3);font-size:12px}
  .mmenu{display:block;font-size:20px;line-height:1;padding:7px 14px}
  .hbtns{display:none}
  header.menu-open .hbtns{display:flex;flex-direction:column;gap:4px;position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);min-width:200px}
  header.menu-open .hbtns .iconbtn{font-size:15px;padding:10px 14px;text-align:left}
  main{padding-bottom:96px}
  .calc-title{font-size:18px}
  input[type=text],select,table.rows input,table.rows select{font-size:16px}
  table.rows input,table.rows select{padding:6px 5px}
  #out .card>h2.fx{cursor:pointer;-webkit-user-select:none;user-select:none}
  #out .card>h2.fx::after{content:' ▾'}
  #out .card.fold>h2.fx{margin:0}
  #out .card.fold>h2.fx::after{content:' ▸ タップで表示';letter-spacing:0}
  #out .card.fold>:not(h2){display:none}
  .mres:not([hidden]){display:flex;align-items:baseline;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border:none;border-top:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 16px calc(10px + env(safe-area-inset-bottom));font-family:inherit;color:var(--fg);text-align:left;cursor:pointer;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
  .mres .ml{flex:1;min-width:0;font-size:12.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mres .mv{font-family:var(--mono);font-size:20px;font-weight:650;white-space:nowrap}
  .mres.ok{border-left-color:var(--ok)}
  .mres.ok .mv{color:var(--ok)}
  .mres.warn{border-left-color:var(--warn)}
  .mres.warn .mv{color:var(--warn)}
  .mres.bad{border-left-color:var(--bad)}
  .mres.bad .mv{color:var(--bad)}
  .mres.err .mv{font-family:var(--sans);font-size:14px;color:var(--warn)}
  .toast{bottom:84px}
}
.picker{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.pk-top{position:sticky;top:0;display:flex;gap:8px;padding:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.pk-top input{flex:1;min-width:0;font-size:16px;font-family:var(--sans)}
.pk-list{padding:4px 10px 40px}
.pk-cat{font-size:12px;font-weight:650;color:var(--fg3);letter-spacing:.06em;margin:16px 4px 6px}
.pk-back{display:inline-flex;align-items:center;gap:2px;background:none;border:none;color:var(--accent);font-size:15px;font-family:inherit;padding:12px 4px 0;cursor:pointer}
.pk-grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pk-it{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;text-align:left;background:none;border:none;border-top:1px solid var(--line2);padding:10px 14px;color:var(--fg);font-family:inherit;cursor:pointer}
.pk-it:first-child{border-top:none}
.pk-it:active{background:var(--accent2)}
.pk-it[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}
.pk-it[aria-current="true"] .t{color:var(--accent)}
.pk-it .t{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.4}
.pk-it .s{display:block;font-size:12px;font-weight:400;color:var(--fg3);margin-top:1px}
.pk-it .n{font-size:13px;color:var(--fg3);font-family:var(--mono)}
.pk-it .chev{color:var(--fg3);font-size:18px;line-height:1}
.pk-none{color:var(--fg3);font-size:13px;margin:16px 4px}
@media print{
  header,.mres,.picker,.opbar,.chips,.rowadd,.rowdel,.iconbtn,footer{display:none!important}
  body{background:#fff;font-size:11pt}
  .grid{grid-template-columns:1fr}
  .card{break-inside:avoid;border-color:#bbb}
  .calc-meta{display:block;color:#555;font-size:9pt;margin:-10px 0 12px}
  .rsum,.rdet>summary{display:none}
  .ritem{border:none;padding:0;margin:0}
  .ritem+.ritem{break-before:page}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="htop">
      <h1>電気通信工事・音響・映像 計算機<small>愛称募集中</small></h1>
      <button type="button" class="mpick" id="btnPick" aria-haspopup="dialog" title="機能を選ぶ"><span class="pn" id="pickName"></span><span class="caret" aria-hidden="true">▾</span></button>
      <span class="spacer"></span>
      <input class="search" id="q" type="text" placeholder="機能を検索…" aria-label="機能を検索">
      <button type="button" class="iconbtn mmenu" id="btnMenu" aria-expanded="false" aria-controls="hbtns" aria-label="メニュー">⋯</button>
      <div class="hbtns" id="hbtns">
      <button class="iconbtn" id="btnCopy" title="計算結果と導出をテキストでコピー">結果をコピー</button>
      <button class="iconbtn" id="btnAdd" title="表示中の計算（入力・結果・導出）を計算書に追加">計算書に追加</button>
      <button class="iconbtn" id="btnReport" title="追加した計算をまとめて見る・印刷する">計算書（0）</button>
      <button class="iconbtn" id="btnPrint">印刷</button>
      <button class="iconbtn" id="btnTheme">配色</button>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main>
 <div id="calcView">
  <h2 class="calc-title" id="ctitle"></h2>
  <p class="calc-sub" id="csub"></p>
  <p class="calc-meta" id="cmeta"></p>
  <div class="grid">
    <div>
      <div class="card incard"><div class="opbar" id="opbar" hidden><button type="button" data-op="+">＋</button><button type="button" data-op="-">−</button><button type="button" data-op="*">×</button><button type="button" data-op="/">÷</button><button type="button" data-op="^">^</button><button type="button" data-op="(">(</button><button type="button" data-op=")">)</button></div><div class="card-h"><h2>入力</h2><button type="button" class="iconbtn resetbtn" id="btnReset" title="この計算機の入力をすべて既定値に戻す">既定値に戻す</button></div><form id="form" autocomplete="off"></form></div>
    </div>
    <div id="out"></div>
  </div>
 </div>
 <section id="reportView" hidden>
  <div class="rhead">
    <h2 class="calc-title">計算書<span class="rcount" id="rcount"></span></h2>
    <div class="rtools">
      <button type="button" class="iconbtn" id="btnRCopy">全体をコピー</button>
      <button type="button" class="iconbtn" id="btnRPrint">全体を印刷</button>
      <button type="button" class="iconbtn" id="btnRClear">すべて削除</button>
    </div>
  </div>
  <p class="calc-sub">追加した時点の入力・結果・導出を保存しています。あとで計算機の入力を変えても、ここの内容は変わりません。印刷すると 1 件ごとに改ページします。</p>
  <p class="calc-meta" id="rmeta"></p>
  <div id="rlist"></div>
 </section>
</main>
<footer>

<script>
"use strict";
/* 版数。計算結果が変わる変更・機能追加で上げ、旧版は history/ に保存して CHANGELOG.md に記録する。
   コピー・印刷した計算書に載るので、どの版の式で計算したかを後から追える。 */
var APP_VERSION = '0.9.1';
/* ============================================================
   共通ヘルパ
   ============================================================ */
var LOG10 = Math.log10 ? Math.log10 : function(x){return Math.log(x)/Math.LN10;};
var C_LIGHT = 299792458;          // m/s
var RHO_CU  = 1/58;               // Ω·mm²/m  (銅, 20℃, 導電率58 m/(Ω·mm²))
var RHO_AL  = 1/35;               // Ω·mm²/m  (アルミ)
var V_REF_DBU = Math.sqrt(0.6);   // 0.7746 V = 0 dBu

function soundSpeed(t){ return 331.5 + 0.6*t; }

/** 有効数字ベースの数値整形 */
function fx(x, d){
  if(x===null||x===undefined) return '—';
  x = Number(x);
  if(!isFinite(x)) return '—';
  d = d || 4;
  var a = Math.abs(x);
  if(a === 0) return '0';
  if(a < 1e-4 || a >= 1e9) return x.toExponential(Math.max(0,d-1));
  var mag = Math.floor(LOG10(a));
  var dec = Math.min(8, Math.max(0, d-1-mag));
  var s = x.toFixed(dec);
  if(s.indexOf('.') >= 0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  var p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.join('.');
}
/** 小数桁固定 */
function fd(x, n){
  x = Number(x);
  if(!isFinite(x)) return '—';
  var s = x.toFixed(n===undefined?2:n);
  var p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.join('.');
}
function req(x, name){
  if(x === '' || x === null || x === undefined) throw new Error(name + ' を入力してください。');
  var n = Number(x);
  if(!isFinite(n)) throw new Error(name + ' は数値で入力してください。');
  return n;
}
function reqPos(x, name){
  var n = req(x, name);
  if(n <= 0) throw new Error(name + ' は 0 より大きい値を入力してください。');
  return n;
}
function opt(x, dflt){
  if(x === '' || x === null || x === undefined) return dflt;
  var n = Number(x);
  return isFinite(n) ? n : dflt;
}

/* ============================================================
   数値入力欄の数式（四則演算・べき乗・括弧）
   eval は使わず、下の文法だけを受け付ける再帰下降パーサで計算する。
     式   = 項 { (+|-) 項 }
     項   = 単項 { (*|/) 単項 }
     単項 = (+|-) 単項 | 累乗
     累乗 = 要素 [ ^ 単項 ]        … 右結合。-2^2 = -4、2^3^2 = 512、2^-1 = 0.5
     要素 = 数値 | ( 式 )          … 数値は 1.5、.5、1e3 の形
   全角の数字・記号、×・÷・−、** も受け付ける。3 桁区切りのカンマ（1,200）は取り除く。
   ============================================================ */
var PLAIN_NUM = /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i;
function normExpr(s){
  return String(s)
    .replace(/[！-～]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); })
    .replace(/[×✕]/g, '*').replace(/÷/g, '/').replace(/[−–—ー]/g, '-').replace(/\*\*/g, '^')
    .replace(/(\d),(?=\d{3}(\D|$))/g, '$1')
    .replace(/[\s　]+/g, '');
}
function evalExpr(src){
  var s = normExpr(src), i = 0;
  if(s === '') throw new Error('式が空です');
  function fail(msg){ throw new Error(msg); }
  function num(){
    var m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(s.slice(i));
    if(!m) fail(i < s.length ? '「' + s.charAt(i) + '」の位置で数値または ( が必要です' : '式が途中で終わっています');
    i += m[0].length;
    return Number(m[0]);
  }
  function atom(){
    if(s.charAt(i) === '('){
      i++;
      var v = expr();
      if(s.charAt(i) !== ')') fail(') が閉じていません');
      i++;
      return v;
    }
    return num();
  }
  function power(){
    var b = atom();
    if(s.charAt(i) === '^'){ i++; return Math.pow(b, unary()); }
    return b;
  }
  function unary(){
    var c = s.charAt(i);
    if(c === '-'){ i++; return -unary(); }
    if(c === '+'){ i++; return unary(); }
    return power();
  }
  function term(){
    var v = unary();
    for(;;){
      var c = s.charAt(i);
      if(c === '*'){ i++; v *= unary(); }
      else if(c === '/'){ i++; v /= unary(); }
      else return v;
    }
  }
  function expr(){
    var v = term();
    for(;;){
      var c = s.charAt(i);
      if(c === '+'){ i++; v += term(); }
      else if(c === '-'){ i++; v -= term(); }
      else return v;
    }
  }
  var v = expr();
  if(i < s.length) fail('「' + s.charAt(i) + '」は使えません（使えるのは数値と + − × ÷ ^ ( ) です）');
  if(!isFinite(v)) fail('計算結果が有限の数になりません（0 での割り算など）');
  return Number(v.toPrecision(15));   // 0.1+0.2 のような 2 進誤差の尾を落とす
}
/** 数値欄の入力が数式か（そのままの数値・空欄なら false） */
function isExpr(raw){
  var t = String(raw === undefined || raw === null ? '' : raw).trim();
  return t !== '' && !PLAIN_NUM.test(t);
}
/**
 * 入力状態のうち数値欄の数式を計算した値に置き換えた写しを返す。compute() と show() にはこちらを渡す。
 * 計算できない式は、表示中の欄なら errs に「欄名：理由」を積む（非表示の欄は無視）。
 */
function evalInputs(c, st){
  var out = {}, errs = [], k, inp, i;
  function one(raw, name){
    if(!isExpr(raw)) return raw;
    try { return String(evalExpr(raw)); }
    catch(e){ errs.push(name + '：' + e.message); return 'NaN'; }
  }
  for(k in st) out[k] = st[k];
  // 表示条件は数値欄の値に依存しうるので、先に表示を問わず数値を求めてから、表示中の欄の誤りだけを残す
  for(var pass = 0; pass < 2; pass++){
    errs = [];
    for(i = 0; i < c.inputs.length; i++){
      inp = c.inputs[i];
      var shown = pass === 0 || typeof inp.show !== 'function' || !!inp.show(out);
      var n0 = errs.length;
      if(inp.type === 'rows'){
        var rs = st[inp.k] || [], ro = [];
        for(var r = 0; r < rs.length; r++){
          var o = {};
          for(var j = 0; j < inp.cols.length; j++){
            var col = inp.cols[j], raw = rs[r][col.k];
            o[col.k] = (col.type === 'num') ? one(raw, inp.label + ' #' + (r+1) + ' ' + col.label) : raw;
          }
          ro.push(o);
        }
        out[inp.k] = ro;
      } else if(inp.type !== 'sel' && inp.type !== 'text'){
        out[inp.k] = one(st[inp.k], inp.label);
      }
      if(!shown) errs.length = n0;
    }
  }
  return { st: out, errs: errs };
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/** 数式のミニ記法: a_{b} → 下付き, a^{b} → 上付き */
function mf(s){
  return esc(s).replace(/_\{([^}]*)\}/g, '<sub>$1</sub>')
               .replace(/\^\{([^}]*)\}/g, '<sup>$1</sup>');
}
/** 判定色を返す */
function tone(ok, warn){ return ok ? 'ok' : (warn ? 'warn' : 'bad'); }

/** 電線サイズ（断面積 mm²） */
var WIRE_SIZES = [
  {t:'0.75 mm²',a:0.75},{t:'1.25 mm²',a:1.25},{t:'2 mm²',a:2},{t:'3.5 mm²',a:3.5},
  {t:'5.5 mm²',a:5.5},{t:'8 mm²',a:8},{t:'14 mm²',a:14},{t:'22 mm²',a:22},
  {t:'38 mm²',a:38},{t:'60 mm²',a:60},{t:'100 mm²',a:100},
  {t:'AWG 20 (0.518 mm²)',a:0.518},{t:'AWG 18 (0.823 mm²)',a:0.823},{t:'AWG 16 (1.31 mm²)',a:1.31},
  {t:'AWG 14 (2.08 mm²)',a:2.08},{t:'AWG 12 (3.31 mm²)',a:3.31},{t:'AWG 10 (5.26 mm²)',a:5.26},
  {t:'AWG 8 (8.37 mm²)',a:8.37}
];
function wireOpts(){ return WIRE_SIZES.map(function(w){return {v:String(w.a), t:w.t};}); }
/* 比較表用：mm² と AWG を断面積の昇順に混ぜて並べる */
var WIRE_SORTED = WIRE_SIZES.slice().sort(function(a,b){ return a.a - b.a; });
/* 'AWG 14 (2.08 mm²)' → 'AWG 14'（断面積は表の専用列に出すため） */
function wireShort(w){ var i = w.t.indexOf(' ('); return i > 0 ? w.t.slice(0, i) : w.t; }

/* ============================================================
   音響系 (1) レベル・インピーダンス・SPL・時間
   ============================================================ */
var AUDIO = [];

AUDIO.push({
  id:'db-unit', cat:'audio', title:'dB変換（dBu / dBV / dBm ⇔ 電圧・電力）',
  sub:'いずれか1つの単位で入力すると、他の単位すべてに換算します。',
  inputs:[
    {k:'val', label:'値', type:'num', def:'4', step:'any'},
    {k:'unit', label:'単位', type:'sel', def:'dBu', options:[
      {v:'dBu',t:'dBu（0 dBu = 0.7746 V）'},{v:'dBV',t:'dBV（0 dBV = 1 V）'},
      {v:'dBm',t:'dBm（0 dBm = 1 mW）'},{v:'V',t:'V（実効値 Vrms）'},{v:'mV',t:'mV（実効値）'},
      {v:'W',t:'W'},{v:'mW',t:'mW'}]},
    {k:'z', label:'基準インピーダンス', type:'num', def:'600', unit:'Ω',
     hint:'電圧 ⇔ 電力（dBm・W）の換算にのみ使用します。dBu / dBV は電圧そのものの表記なので影響しません。'}
  ],
  compute:function(v){
    var u=v.unit, x=req(v.val,'値'), Z=reqPos(v.z,'基準インピーダンス');
    var V,P,steps=[];
    if(u==='dBu'){
      V=V_REF_DBU*Math.pow(10,x/20);
      steps.push({l:'dBu を電圧に戻す', f:'V = V_{ref} × 10^{(L/20)},  V_{ref} = √0.6 = 0.7746 V',
        s:'V = 0.7746 × 10^{('+fx(x)+' / 20)}', r:'V = '+fx(V,5)+' V_{rms}',
        n:'0 dBu は「600 Ω で 1 mW となる電圧 √0.6 V」に由来しますが、dBu 自体はインピーダンスに依存しない電圧表記です。'});
    } else if(u==='dBV'){
      V=Math.pow(10,x/20);
      steps.push({l:'dBV を電圧に戻す', f:'V = 1 V × 10^{(L/20)}', s:'V = 10^{('+fx(x)+' / 20)}', r:'V = '+fx(V,5)+' V_{rms}'});
    } else if(u==='V'){ V=x; steps.push({l:'入力はすでに電圧', f:'V = 入力値', s:'V = '+fx(x,5)+' V', r:'V = '+fx(V,5)+' V_{rms}'}); }
    else if(u==='mV'){ V=x/1000; steps.push({l:'mV を V に換算', f:'V = L_{mV} / 1000', s:'V = '+fx(x,5)+' / 1000', r:'V = '+fx(V,5)+' V_{rms}'}); }
    else if(u==='dBm'){
      P=1e-3*Math.pow(10,x/10);
      steps.push({l:'dBm を電力に戻す', f:'P = 1 mW × 10^{(L/10)}', s:'P = 0.001 × 10^{('+fx(x)+' / 10)}', r:'P = '+fx(P,5)+' W'});
      V=Math.sqrt(P*Z);
      steps.push({l:'電力から電圧を求める（基準インピーダンスが必要）', f:'V = √(P × Z)', s:'V = √('+fx(P,5)+' × '+fx(Z)+')', r:'V = '+fx(V,5)+' V_{rms}'});
    }
    else if(u==='W'||u==='mW'){
      P=(u==='W')?x:x/1000;
      if(u==='mW') steps.push({l:'mW を W に換算', f:'P = L_{mW} / 1000', s:'P = '+fx(x,5)+' / 1000', r:'P = '+fx(P,5)+' W'});
      V=Math.sqrt(P*Z);
      steps.push({l:'電力から電圧を求める', f:'V = √(P × Z)', s:'V = √('+fx(P,5)+' × '+fx(Z)+')', r:'V = '+fx(V,5)+' V_{rms}'});
    }
    if(P===undefined){
      P=V*V/Z;
      steps.push({l:'電圧から電力を求める', f:'P = V² / Z', s:'P = '+fx(V,5)+'² / '+fx(Z), r:'P = '+fx(P,5)+' W = '+fx(P*1000,5)+' mW'});
    }
    var dbu=20*LOG10(V/V_REF_DBU), dbv=20*LOG10(V), dbm=10*LOG10(P/1e-3);
    steps.push({l:'dBu に換算', f:'L_{dBu} = 20 log_{10}(V / 0.7746)', s:'L_{dBu} = 20 log_{10}('+fx(V,5)+' / 0.7746)', r:'L_{dBu} = '+fd(dbu,2)+' dBu'});
    steps.push({l:'dBV に換算', f:'L_{dBV} = 20 log_{10}(V / 1 V)', s:'L_{dBV} = 20 log_{10}('+fx(V,5)+')', r:'L_{dBV} = '+fd(dbv,2)+' dBV'});
    steps.push({l:'dBm に換算', f:'L_{dBm} = 10 log_{10}(P / 1 mW)', s:'L_{dBm} = 10 log_{10}('+fx(P*1000,5)+' mW / 1 mW)', r:'L_{dBm} = '+fd(dbm,2)+' dBm',
      n:'dBm は電力の表記なので、Z = '+fx(Z)+' Ω を前提とした値です。Z が変われば同じ電圧でも dBm は変わります。'});
    var vp=V*Math.SQRT2, vpp=2*vp;
    steps.push({l:'波高値・p-p 値（正弦波の場合）', f:'V_{peak} = √2 × V_{rms},  V_{p-p} = 2√2 × V_{rms}',
      s:'V_{peak} = 1.4142 × '+fx(V,5)+',  V_{p-p} = 2.8284 × '+fx(V,5),
      r:'V_{peak} = '+fx(vp,5)+' V,  V_{p-p} = '+fx(vpp,5)+' V'});
    return {
      head:[
        {l:'dBu', v:fd(dbu,2), u:'dBu'},
        {l:'dBV', v:fd(dbv,2), u:'dBV'},
        {l:'dBm（Z = '+fx(Z)+' Ω）', v:fd(dbm,2), u:'dBm'},
        {l:'電圧（実効値）', v:fx(V,5), u:'V'},
        {l:'電圧（p-p）', v:fx(vpp,5), u:'V'},
        {l:'電力', v:(P>=1?fx(P,5)+' W':fx(P*1000,5)+' mW'), u:''}
      ],
      steps:steps,
      notes:[
        'dBu・dBV は電圧レベル、dBm は電力レベルです。プロ音響機器の入出力は電圧受け（ブリッジ接続）が基本のため、通常は dBu で扱います。',
        '民生機の −10 dBV は 0.3162 V、業務用の +4 dBu は 1.228 V です（差は 11.79 dB）。',
        '表示はすべて正弦波の実効値（rms）を前提としています。'
      ]
    };
  }
});

AUDIO.push({
  id:'db-ratio', cat:'audio', title:'比 ⇔ dB 変換',
  sub:'電圧比・電力比と dB を相互に変換します。20log か 10log かの取り違えを防ぎます。',
  inputs:[
    {k:'mode', label:'変換方向', type:'sel', def:'v2db', options:[
      {v:'v2db',t:'電圧（音圧・電流）比 → dB'},{v:'p2db',t:'電力比 → dB'},
      {v:'db2v',t:'dB → 電圧比'},{v:'db2p',t:'dB → 電力比'}]},
    {k:'a', label:'基準値（前）', type:'num', def:'1', step:'any', show:function(v){return v.mode==='v2db'||v.mode==='p2db';}},
    {k:'b', label:'測定値（後）', type:'num', def:'2', step:'any', show:function(v){return v.mode==='v2db'||v.mode==='p2db';}},
    {k:'d', label:'レベル差', type:'num', def:'6', unit:'dB', step:'any', show:function(v){return v.mode==='db2v'||v.mode==='db2p';}}
  ],
  compute:function(v){
    var steps=[], head=[], notes=[];
    if(v.mode==='v2db'||v.mode==='p2db'){
      var a=req(v.a,'基準値'), b=req(v.b,'測定値');
      if(a===0) throw new Error('基準値に 0 は指定できません（比が定義できません）。');
      var r=b/a, k=(v.mode==='v2db')?20:10;
      steps.push({l:'比を求める', f:'r = 測定値 / 基準値', s:'r = '+fx(b,5)+' / '+fx(a,5), r:'r = '+fx(r,5)+' 倍'});
      if(r<=0) throw new Error('比が 0 以下です。dB は正の比に対してのみ定義されます。');
      var db=k*LOG10(r);
      steps.push({l:'dB に変換', f:'L = '+k+' log_{10}(r)',
        s:'L = '+k+' × log_{10}('+fx(r,5)+') = '+k+' × '+fd(LOG10(r),5), r:'L = '+fd(db,3)+' dB',
        n:(k===20)?'電圧・電流・音圧のように「振幅」の比は 20 log を使います。':'電力・音響パワー・強度のように「エネルギー」の比は 10 log を使います。'});
      head=[{l:'レベル差', v:fd(db,2), u:'dB'},{l:'比', v:fx(r,5), u:'倍'}];
    } else {
      var d=req(v.d,'レベル差'), kk=(v.mode==='db2v')?20:10;
      var ratio=Math.pow(10,d/kk);
      steps.push({l:'比に変換', f:'r = 10^{(L / '+kk+')}', s:'r = 10^{('+fx(d)+' / '+kk+')}', r:'r = '+fx(ratio,6)+' 倍'});
      var other=Math.pow(10,d/((kk===20)?10:20));
      steps.push({l:'もう一方の比', f:'r_{他} = 10^{(L / '+((kk===20)?10:20)+')}',
        s:'r_{他} = 10^{('+fx(d)+' / '+((kk===20)?10:20)+')}', r:'r_{他} = '+fx(other,6)+' 倍',
        n:'同じ dB 値でも、電圧比と電力比では数値が異なります（電力比 = 電圧比²）。'});
      head=[{l:(kk===20?'電圧比':'電力比'), v:fx(ratio,5), u:'倍'},{l:(kk===20?'電力比':'電圧比'), v:fx(other,5), u:'倍'}];
    }
    notes=['+6 dB ≒ 電圧2倍（電力4倍）、+3 dB ≒ 電力2倍（電圧1.414倍）、+20 dB = 電圧10倍（電力100倍）。',
      'dB は必ず「何に対する比か」を伴います。基準が異なる値（dBu と dBV など）をそのまま引き算しないよう注意してください。'];
    return {head:head, steps:steps, notes:notes};
  }
});

AUDIO.push({
  id:'sp-imp', cat:'audio', title:'スピーカー合成インピーダンス（ローインピーダンス）',
  sub:'直列・並列配線時の合成インピーダンスと、各スピーカーへの電力配分を求めます。',
  inputs:[
    {k:'mode', label:'接続方式', type:'sel', def:'par', options:[{v:'par',t:'並列接続'},{v:'ser',t:'直列接続'}]},
    {k:'sp', label:'スピーカー', type:'rows', cols:[
      {k:'z', label:'インピーダンス Ω', type:'num', def:'8'},
      {k:'n', label:'台数', type:'num', def:'1'}
    ], def:[['8','2']]},
    {k:'vout', label:'アンプ出力電圧（任意）', type:'num', def:'', unit:'V', step:'any',
     hint:'入力すると電流と各スピーカーの負担電力を計算します。空欄なら合成インピーダンスのみ。'},
    {k:'zmin', label:'アンプの最低負荷インピーダンス', type:'num', def:'4', unit:'Ω',
     hint:'アンプ仕様書の「最小負荷」。合成値がこれを下回ると保護回路動作・故障の原因になります。'}
  ],
  compute:function(v){
    var rows=v.sp||[], steps=[], terms=[], tot=0, cnt=0, list=[];
    for(var i=0;i<rows.length;i++){
      var z=opt(rows[i].z,NaN), n=Math.round(opt(rows[i].n,0));
      if(!isFinite(z)||z<=0||n<=0) continue;
      list.push({z:z,n:n}); cnt+=n;
    }
    if(!list.length) throw new Error('スピーカーのインピーダンスと台数を1行以上入力してください。');
    if(v.mode==='ser'){
      for(var j=0;j<list.length;j++){ tot+=list[j].z*list[j].n; terms.push(fx(list[j].z)+' × '+list[j].n); }
      steps.push({l:'直列合成インピーダンス', f:'Z_{合成} = Z_{1} + Z_{2} + … （各インピーダンスの単純和）',
        s:'Z_{合成} = '+terms.join(' + '), r:'Z_{合成} = '+fx(tot,4)+' Ω'});
    } else {
      var inv=0;
      for(var k=0;k<list.length;k++){ inv+=list[k].n/list[k].z; terms.push(list[k].n+' / '+fx(list[k].z)); }
      steps.push({l:'コンダクタンス（1/Z）の和をとる', f:'1/Z_{合成} = 1/Z_{1} + 1/Z_{2} + …',
        s:'1/Z_{合成} = '+terms.join(' + '), r:'1/Z_{合成} = '+fx(inv,5)+' S'});
      tot=1/inv;
      steps.push({l:'逆数をとって合成インピーダンス', f:'Z_{合成} = 1 / (Σ 1/Z_{i})',
        s:'Z_{合成} = 1 / '+fx(inv,5), r:'Z_{合成} = '+fx(tot,4)+' Ω',
        n:'同じインピーダンスの n 台並列なら Z/n。8 Ω × 2 台 = 4 Ω、8 Ω × 4 台 = 2 Ω です。'});
    }
    var zmin=opt(v.zmin,0);
    var ok = !(zmin>0 && tot < zmin - 1e-9);
    var head=[{l:'合成インピーダンス', v:fx(tot,4), u:'Ω', tone: zmin>0?(ok?'ok':'bad'):'', n:(zmin>0?(ok?'アンプ最低負荷 '+fx(zmin)+' Ω 以上 — 接続可':'アンプ最低負荷 '+fx(zmin)+' Ω を下回ります — 接続不可'):'')},
      {l:'スピーカー総数', v:String(cnt), u:'台'}];
    if(zmin>0){
      steps.push({l:'アンプ最低負荷との照合', f:'Z_{合成} ≥ Z_{min} であること',
        s:fx(tot,4)+' Ω  '+(ok?'≥':'<')+'  '+fx(zmin)+' Ω', r:ok?'OK（接続可）':'NG（アンプの許容範囲外）'});
    }
    var vout=opt(v.vout,NaN);
    var tables=[];
    if(isFinite(vout)&&vout>0){
      var itot=vout/tot, ptot=vout*vout/tot;
      steps.push({l:'アンプ出力電流', f:'I = V / Z_{合成}', s:'I = '+fx(vout)+' / '+fx(tot,4), r:'I = '+fx(itot,4)+' A'});
      steps.push({l:'アンプ出力電力（総和）', f:'P = V² / Z_{合成}', s:'P = '+fx(vout)+'² / '+fx(tot,4), r:'P = '+fx(ptot,4)+' W'});
      var trows=[];
      if(v.mode==='par'){
        steps.push({l:'各スピーカーの負担電力（並列＝全台に同じ電圧）', f:'P_{i} = V² / Z_{i}',
          s:'例：P = '+fx(vout)+'² / '+fx(list[0].z), r:'P = '+fx(vout*vout/list[0].z,4)+' W /台（'+fx(list[0].z)+' Ω の場合）'});
        for(var m=0;m<list.length;m++){
          var pi=vout*vout/list[m].z;
          trows.push([fx(list[m].z)+' Ω', list[m].n+' 台', fx(vout)+' V', fx(vout/list[m].z,4)+' A', fx(pi,4)+' W', fx(pi*list[m].n,4)+' W']);
        }
      } else {
        steps.push({l:'各スピーカーの負担電力（直列＝全台に同じ電流）', f:'P_{i} = I² × Z_{i}',
          s:'例：P = '+fx(itot,4)+'² × '+fx(list[0].z), r:'P = '+fx(itot*itot*list[0].z,4)+' W /台（'+fx(list[0].z)+' Ω の場合）'});
        for(var q=0;q<list.length;q++){
          var pq=itot*itot*list[q].z;
          trows.push([fx(list[q].z)+' Ω', list[q].n+' 台', fx(itot*list[q].z,4)+' V', fx(itot,4)+' A', fx(pq,4)+' W', fx(pq*list[q].n,4)+' W']);
        }
      }
      head.push({l:'アンプ出力電力', v:fx(ptot,4), u:'W'});
      head.push({l:'アンプ出力電流', v:fx(itot,4), u:'A'});
      tables.push({title:'各スピーカーの分担', head:['インピーダンス','台数','端子電圧','電流','1台あたり電力','小計'], rows:trows});
    }
    return {head:head, steps:steps, tables:tables, notes:[
      '公称インピーダンスは周波数によって変動します（最低値は公称値の 70〜80% 程度まで下がることがあります）。余裕をもった設計にしてください。',
      '直列接続は各スピーカーの相互作用でダンピングが悪化します。やむを得ない場合を除き並列またはハイインピーダンス配線を推奨します。',
      '実際の分担電力は各スピーカーの許容入力（プログラム入力）以下に収まっているか確認してください。'
    ]};
  }
});

AUDIO.push({
  id:'hi-imp', cat:'audio', title:'ハイインピーダンス（定電圧）配線',

      n:'ハイインピーダンス配線では、各スピーカーのタップ電力をそのまま足すだけで負荷が決まります。これが定電圧配線の利点です。'});

      r:ok?'OK（余裕あり）':(warnOnly?'注意（定格は足りるが余裕率不足）':'NG（アンプ容量不足）')});
    var Z=V*V/sum, I=sum/V;
    steps.push({l:'ラインの合成インピーダンス', f:'Z = V_{line}² / P_{総}',

    var head=[
      {l:'総タップ電力', v:fx(sum,4), u:'W', n:cnt+' 台'},
      {l:'必要アンプ容量', v:fx(need,4), u:'W', n:'余裕率 '+fx(marg)+'%'},
      {l:'判定', v:ok?'OK':(warnOnly?'注意':'NG'), u:'', tone:ok?'ok':(warnOnly?'warn':'bad'), n:ok?'定格 '+fx(amp,4)+' W で余裕あり':'定格 '+fx(amp,4)+' W'},
      {l:'ライン合成インピーダンス', v:fx(Z,4), u:'Ω'},
      {l:'ライン電流', v:fx(I,4), u:'A'}
    ];
    var notes=['ハイインピーダンス配線では、アンプ容量に対する総タップ電力が 80% 程度に収まるよう計画するのが一般的です。',
      'マッチングトランスの挿入損失（通常 0.5〜1 dB 程度）は上記に含まれていません。',
      '非常放送設備では、消防法・設備基準に基づく別途の要求（回線構成、断線監視など）を満たす必要があります。'];
    var len=opt(v.len,NaN);
    if(isFinite(len)&&len>0){
      var A=reqPos(v.area,'電線サイズ');
      var R=2*len*RHO_CU/A;
      steps.push({l:'線路抵抗（往復）', f:'R = 2 × L × ρ / A,  ρ_{銅} = 1/58 Ω·mm²/m',
        s:'R = 2 × '+fx(len)+' × (1/58) / '+fx(A), r:'R = '+fx(R,4)+' Ω'});
      var ploss=I*I*R, ratio=ploss/sum*100;
      steps.push({l:'線路での損失電力', f:'P_{損失} = I² × R', s:'P_{損失} = '+fx(I,4)+'² × '+fx(R,4),
        r:'P_{損失} = '+fx(ploss,4)+' W（総電力の '+fd(ratio,1)+'%）'});
      var vdrop=I*R, vend=V-vdrop, dbdrop=20*LOG10(vend/V);
      steps.push({l:'末端電圧とレベル低下', f:'V_{末端} = V_{line} − I × R,  ΔL = 20 log_{10}(V_{末端} / V_{line})',
        s:'V_{末端} = '+fx(V)+' − '+fx(I,4)+' × '+fx(R,4)+' = '+fx(vend,4)+' V',
        r:'V_{末端} = '+fx(vend,4)+' V,  ΔL = '+fd(dbdrop,2)+' dB'});
      var lok=ratio<=10;
      head.push({l:'線路損失', v:fd(ratio,1), u:'%', tone:lok?'ok':'warn', n:fx(ploss,3)+' W / レベル低下 '+fd(dbdrop,2)+' dB'});

    }

  }
});

AUDIO.push({

    return {
      head:[
        {l:'設定する遅延時間', v:fd(total,2), u:'ms'},
        {l:'計算上の遅延（距離差ぶん）', v:fd(ms,2), u:'ms'},
        {l:'サンプル数', v:fd(smp,0), u:'sample'},
        {l:'距離差', v:fx(dd,4), u:'m', n:fd(ft,2)+' ft'},
        {l:'音速（'+fx(t)+'℃）', v:fd(c,1), u:'m/s'}

      notes:[

        'スピーカーの距離は「客席の代表点」から測ります。メインとディレイの両方から等距離となる点を基準にするのが定石です。',
        'デジタルプロセッサ自体の A/D・D/A 遅延（レイテンシ）は含まれていません。系統ごとに経路が違う場合は別途そろえてください。'
      ]
    };
  }
});

AUDIO.push({
  id:'rt60', cat:'audio', title:'残響時間 RT60（Sabine / Eyring）',
  sub:'部屋の容積と各面の吸音率から残響時間を求めます。Sabine の式と Eyring の式を併記します。',
  inputs:[
    {k:'vmode', label:'容積の指定', type:'sel', def:'dim', options:[
      {v:'dim',t:'寸法から計算（直方体）'},{v:'direct',t:'容積を直接入力'}]},
    {k:'w', label:'幅', type:'num', def:'20', unit:'m', show:function(v){return v.vmode==='dim';}},
    {k:'d', label:'奥行', type:'num', def:'30', unit:'m', show:function(v){return v.vmode==='dim';}},
    {k:'h', label:'高さ', type:'num', def:'8', unit:'m', show:function(v){return v.vmode==='dim';}},
    {k:'vol', label:'室容積', type:'num', def:'4800', unit:'m³', show:function(v){return v.vmode==='direct';}},
    {k:'surf', label:'各面の仕様', type:'rows', cols:[
      {k:'name', label:'部位', type:'text', def:'', w:'34%'},
      {k:'s', label:'面積 m²', type:'num', def:''},
      {k:'a', label:'吸音率 α', type:'num', def:''}
    ], def:[['床（コンクリート）','600','0.02'],['天井（石膏ボード）','600','0.10'],['壁（合板）','800','0.15'],['客席（空席）','300','0.45']],
     hint:'吸音率は対象周波数（通常 500 Hz）のものを使います。客席は「1席あたり m²」ではなく占有面積で入力してください。'},
    {k:'target', label:'目標残響時間（任意）', type:'num', def:'', unit:'s', step:'any'}
  ],
  compute:function(v){
    var steps=[], V;
    if(v.vmode==='dim'){
      var w=reqPos(v.w,'幅'), d=reqPos(v.d,'奥行'), h=reqPos(v.h,'高さ');
      V=w*d*h;
      steps.push({l:'室容積を求める', f:'V = 幅 × 奥行 × 高さ', s:'V = '+fx(w)+' × '+fx(d)+' × '+fx(h), r:'V = '+fx(V,5)+' m³'});
    } else { V=reqPos(v.vol,'室容積'); }
    var rows=v.surf||[], A=0, S=0, terms=[], trows=[];
    for(var i=0;i<rows.length;i++){
      var s=opt(rows[i].s,NaN), a=opt(rows[i].a,NaN);
      if(!isFinite(s)||s<=0||!isFinite(a)||a<0) continue;
      if(a>1) throw new Error('吸音率 α は 0〜1 の範囲で入力してください（'+fx(a)+' が指定されています）。');
      var Ai=s*a; A+=Ai; S+=s;
      terms.push(fx(s)+'×'+fx(a));
      trows.push([rows[i].name||('面'+(i+1)), fx(s)+' m²', fx(a), fx(Ai,4)+' m²']);
    }
    if(S<=0) throw new Error('面積と吸音率を1行以上入力してください。');
    steps.push({l:'等価吸音力（吸音面積）を合計する', f:'A = Σ (S_{i} × α_{i})  [m²]',
      s:'A = '+terms.join(' + '), r:'A = '+fx(A,5)+' m²（総表面積 S = '+fx(S,5)+' m²）',
      n:'各面の「面積 × 吸音率」の和が、その部屋の吸音の総量です。単位は m²（メートルセービン）。'});
    var am=A/S;
    steps.push({l:'平均吸音率', f:'ᾱ = A / S', s:'ᾱ = '+fx(A,5)+' / '+fx(S,5), r:'ᾱ = '+fd(am,4)});
    var rtS=0.161*V/A;
    steps.push({l:'Sabine の式で残響時間を求める', f:'RT_{60} = 0.161 × V / A',
      s:'RT_{60} = 0.161 × '+fx(V,5)+' / '+fx(A,5), r:'RT_{60} = '+fd(rtS,3)+' s',
      n:'0.161 は 20℃ の音速に基づく係数（24 ln10 / c ≒ 0.161）。Sabine の式は吸音率が小さい（ᾱ < 0.2 程度）残響豊かな室で精度が高くなります。'});
    var rtE=null;
    if(am<1){
      var denom=-S*Math.log(1-am);
      rtE=0.161*V/denom;
      steps.push({l:'Eyring の式で残響時間を求める', f:'RT_{60} = 0.161 × V / ( −S × ln(1 − ᾱ) )',
        s:'RT_{60} = 0.161 × '+fx(V,5)+' / ( −'+fx(S,5)+' × ln(1 − '+fd(am,4)+') )',
        r:'RT_{60} = '+fd(rtE,3)+' s',
        n:'吸音が大きい室（ᾱ > 0.2）では Sabine より Eyring のほうが実測に近くなります。ᾱ が小さいときは両者ほぼ一致します。'});
    }
    var head=[
      {l:'RT60（Sabine）', v:fd(rtS,2), u:'秒'},
      (rtE!==null?{l:'RT60（Eyring）', v:fd(rtE,2), u:'秒'}:null),
      {l:'室容積', v:fx(V,5), u:'m³'},
      {l:'等価吸音力', v:fx(A,4), u:'m²'},
      {l:'平均吸音率', v:fd(am,3), u:''}
    ].filter(Boolean);
    var tg=opt(v.target,NaN);
    if(isFinite(tg)&&tg>0){
      var needA=0.161*V/tg, addA=needA-A;
      steps.push({l:'目標残響時間に必要な吸音力', f:'A_{必要} = 0.161 × V / RT_{目標}',
        s:'A_{必要} = 0.161 × '+fx(V,5)+' / '+fx(tg), r:'A_{必要} = '+fx(needA,5)+' m²'});
      steps.push({l:'追加すべき吸音力', f:'ΔA = A_{必要} − A_{現状}',
        s:'ΔA = '+fx(needA,5)+' − '+fx(A,5), r:'ΔA = '+fx(addA,5)+' m²'+(addA>0?'（吸音材の追加が必要）':'（すでに目標を下回っています）')});
      head.push({l:'目標 '+fx(tg)+' s との差', v:(addA>0?'+':'')+fx(addA,4), u:'m² 不足', tone:addA>0?'warn':'ok',
        n:addA>0?'α=0.8 の吸音材なら約 '+fx(addA/0.8,3)+' m² 相当':'目標より吸音が多い状態です'});
    }
    return {head:head, steps:steps,
      tables:[{title:'各面の吸音力', head:['部位','面積','吸音率 α','吸音力 S·α'], rows:trows}],
      notes:[
        '用途別の目安（500 Hz、満席）：講堂・会議室 0.6〜0.9 s、多目的ホール 1.0〜1.4 s、コンサートホール 1.6〜2.2 s、体育館 2.0 s 以下が望ましい。',
        '空気吸収（高域）や開口部（開いた扉・窓は α = 1.0 として扱う）は別途考慮してください。',
        '拡声設備の明瞭度は残響時間に強く影響されます。RT60 が長い空間では指向性の高いスピーカーや分散配置を検討します。',
        '実際の残響時間は測定（インパルス応答）で確認してください。計算は設計初期の見当づけです。'
      ]};
  }
});

AUDIO.push({
  id:'gain-struct', cat:'audio', title:'ゲイン構造・ヘッドルーム',
  sub:'信号チェーンの各段のレベルを追跡し、どこでクリップに一番近いかを可視化します。',
  inputs:[
    {k:'inlv', label:'入力レベル（公称）', type:'num', def:'-40', unit:'dBu', step:'any',
     hint:'マイク：−50〜−30 dBu、ライン（民生）：−10 dBV ≒ −7.8 dBu、ライン（業務）：+4 dBu。'},
    {k:'peak', label:'ピークファクタ（波高率）', type:'num', def:'12', unit:'dB', step:'any',
     hint:'公称レベルに対する最大瞬時値の余裕。音声で 12 dB、打楽器では 18〜20 dB 見ます。'},
    {k:'stages', label:'信号チェーン', type:'rows', cols:[
      {k:'name', label:'機器・段', type:'text', def:'', w:'42%'},
      {k:'g', label:'ゲイン dB', type:'num', def:''},
      {k:'max', label:'最大出力 dBu', type:'num', def:''}
    ], def:[['マイクプリ','40','24'],['卓 チャンネル','0','22'],['卓 マスター','6','22'],['プロセッサ','0','20'],['パワーアンプ入力','0','20']]}
  ],
  compute:function(v){
    var lv=req(v.inlv,'入力レベル'), pk=opt(v.peak,0), steps=[], rows=v.stages||[];
    steps.push({l:'出発点：入力の公称レベルとピーク値', f:'L_{peak} = L_{公称} + ピークファクタ',
      s:'L_{peak} = '+fx(lv)+' + '+fx(pk), r:'L_{公称} = '+fd(lv,1)+' dBu,  L_{peak} = '+fd(lv+pk,1)+' dBu'});
    var cur=lv, trows=[], minHr=Infinity, minName='', any=false;
    for(var i=0;i<rows.length;i++){
      var g=opt(rows[i].g,NaN), mx=opt(rows[i].max,NaN);
      if(!isFinite(g)) continue;
      any=true;
      var name=rows[i].name||('段'+(i+1));
      var before=cur; cur=cur+g;
      var peakLv=cur+pk;
      var hr=isFinite(mx)?(mx-peakLv):NaN;
      if(isFinite(hr)&&hr<minHr){ minHr=hr; minName=name; }
      steps.push({l:name+' 通過後のレベル', f:'L_{out} = L_{in} + G',
        s:'L_{out} = '+fd(before,1)+' + '+fx(g),
        r:'L_{out} = '+fd(cur,1)+' dBu（ピーク '+fd(peakLv,1)+' dBu）'+(isFinite(mx)?'  → ヘッドルーム '+fd(hr,1)+' dB':'')});
      trows.push([name, (g>=0?'+':'')+fx(g)+' dB', fd(cur,1)+' dBu', fd(peakLv,1)+' dBu',
        isFinite(mx)?fx(mx)+' dBu':'—', isFinite(hr)?fd(hr,1)+' dB':'—'],
        isFinite(hr)?(hr<0?'bad':(hr<6?'warn':'ok')):null);
    }
    if(!any) throw new Error('信号チェーンを1段以上入力してください。');
    var tr2=[];
    for(var j=0;j<trows.length;j+=2){ tr2.push({cells:trows[j], tone:trows[j+1]}); }
    var totalGain=cur-lv;
    steps.push({l:'総合ゲイン', f:'G_{総合} = L_{最終} − L_{入力}',
      s:'G_{総合} = '+fd(cur,1)+' − '+fd(lv,1), r:'G_{総合} = '+fd(totalGain,1)+' dB'});
    var hasHr=isFinite(minHr);
    if(hasHr){
      steps.push({l:'最も余裕のない段を特定する', f:'ヘッドルーム = 最大出力 − ピークレベル（各段の最小値）',
        s:'最小となるのは「'+minName+'」', r:fd(minHr,1)+' dB',
        n:minHr<0?'この段ですでにクリップします。前段のゲインを下げてください。':(minHr<6?'余裕が 6 dB を切っています。不意のピークでクリップする恐れがあります。':'十分な余裕があります。')});
    }
    return {
      head:[
        {l:'最終出力（公称）', v:fd(cur,1), u:'dBu'},
        {l:'最終出力（ピーク）', v:fd(cur+pk,1), u:'dBu'},
        {l:'総合ゲイン', v:(totalGain>=0?'+':'')+fd(totalGain,1), u:'dB'},
        (hasHr?{l:'最小ヘッドルーム', v:fd(minHr,1), u:'dB', tone:minHr<0?'bad':(minHr<6?'warn':'ok'), n:'「'+minName+'」の段'}:null)
      ].filter(Boolean),
      steps:steps,
      tables:[{title:'各段のレベル推移', head:['機器・段','ゲイン','公称レベル','ピークレベル','最大出力','ヘッドルーム'], rows2:tr2}],
      notes:[
        'ゲイン構造の原則は「必要なゲインは入口（マイクプリ）で稼ぎ、以降の段では上げ下げしない」。後段で持ち上げると前段のノイズも一緒に増幅されます。',
        'ヘッドルームは各段 6 dB 以上を目安に確保してください。デジタル卓では −18 dBFS ≒ +4 dBu の基準（EBU）が一般的です。',
        'この計算はレベルの追跡のみで、機器の内部ノイズ（S/N）は含みません。'
      ]
    };
  }
});

AUDIO.push({
  id:'im-check', cat:'audio', title:'ワイヤレスマイク 混変調（IM）チェック',
  sub:'使用周波数の組み合わせから 3次・5次の相互変調積を計算し、他チャンネルとの衝突を検出します。',
  inputs:[
    {k:'freqs', label:'使用周波数', type:'rows', cols:[
      {k:'name', label:'ch 名', type:'text', def:'', w:'40%'},
      {k:'f', label:'周波数 MHz', type:'num', def:''}
    ], def:[['A1','806.125'],['A2','806.750'],['A3','807.500'],['A4','809.750']],
     hint:'B型（806〜810 MHz）、A型（470〜714 MHz）など、実際に運用する周波数を入力します。'},
    {k:'guard', label:'ガードバンド（衝突とみなす幅）', type:'num', def:'150', unit:'kHz',
     hint:'IM 積がキャリアからこの範囲内に入ると干渉の可能性があります。一般に 100〜300 kHz。'},
    {k:'ord', label:'検査する次数', type:'sel', def:'3', options:[
      {v:'3',t:'3次のみ（2f1−f2、f1+f2−f3）'},{v:'35',t:'3次 + 5次（3f1−2f2 を追加）'}]}
  ],
  compute:function(v){
    var rows=v.freqs||[], list=[];
    for(var i=0;i<rows.length;i++){
      var f=opt(rows[i].f,NaN);
      if(!isFinite(f)||f<=0) continue;
      list.push({n:rows[i].name||('ch'+(i+1)), f:f});
    }
    if(list.length<2) throw new Error('周波数を2つ以上入力してください。');
    var guard=reqPos(v.guard,'ガードバンド')/1000; // MHz
    var steps=[], prods=[];
    // 2f1 - f2
    for(var a=0;a<list.length;a++) for(var b=0;b<list.length;b++){
      if(a===b) continue;
      prods.push({f:2*list[a].f-list[b].f, ord:3, exp:'2×'+list[a].n+' − '+list[b].n});
    }
    // f1 + f2 - f3
    for(var p=0;p<list.length;p++) for(var q=p+1;q<list.length;q++) for(var r=0;r<list.length;r++){
      if(r===p||r===q) continue;
      prods.push({f:list[p].f+list[q].f-list[r].f, ord:3, exp:list[p].n+' + '+list[q].n+' − '+list[r].n});
    }
    if(v.ord==='35'){
      for(var s1=0;s1<list.length;s1++) for(var s2=0;s2<list.length;s2++){
        if(s1===s2) continue;
        prods.push({f:3*list[s1].f-2*list[s2].f, ord:5, exp:'3×'+list[s1].n+' − 2×'+list[s2].n});
      }
    }
    steps.push({l:'3次相互変調積を計算する', f:'f_{IM} = 2f_{1} − f_{2}  および  f_{1} + f_{2} − f_{3}',
      s:'例：2 × '+fx(list[0].f,7)+' − '+fx(list[1].f,7),
      r:'f_{IM} = '+fx(2*list[0].f-list[1].f,7)+' MHz',
      n:'3次 IM は送信機の出力段や受信機の初段で発生し、レベルが高いため最も問題になります。組み合わせ数は '+prods.length+' 通りです。'});
    var hits=[];
    for(var t=0;t<prods.length;t++){
      for(var u=0;u<list.length;u++){
        var diff=Math.abs(prods[t].f-list[u].f);
        if(diff<=guard) hits.push({victim:list[u], prod:prods[t], diff:diff});
      }
    }
    hits.sort(function(x,y){ return x.diff-y.diff; });
    steps.push({l:'各 IM 積と使用周波数の間隔を照合する', f:'| f_{IM} − f_{ch} | ≤ ガードバンド なら衝突',
      s:'ガードバンド = '+fx(guard*1000)+' kHz = '+fx(guard,5)+' MHz',
      r:hits.length===0?'衝突なし（全 '+prods.length+' 積を検査）':'衝突 '+hits.length+' 件を検出',
      n:hits.length===0?'現在の周波数の組み合わせは、検査した次数の範囲では良好です。':'下表の組み合わせは干渉（ノイズ・音切れ）の原因になり得ます。周波数の変更を検討してください。'});
    var trows=[];
    var lim=Math.min(hits.length,60);
    for(var h=0;h<lim;h++){
      trows.push({cells:[hits[h].victim.n+'（'+fx(hits[h].victim.f,7)+' MHz）', hits[h].prod.ord+'次',
        hits[h].prod.exp, fx(hits[h].prod.f,7)+' MHz', fd(hits[h].diff*1000,1)+' kHz'],
        tone:hits[h].diff*1000<50?'bad':'warn'});
    }
    // 周波数間隔一覧
    var sorted=list.slice().sort(function(x,y){return x.f-y.f;}), gaps=[];
    for(var g2=1;g2<sorted.length;g2++){
      var sp=(sorted[g2].f-sorted[g2-1].f)*1000;
      gaps.push({cells:[sorted[g2-1].n+' → '+sorted[g2].n, fd(sp,1)+' kHz'], tone:sp<125?'bad':(sp<250?'warn':'ok')});
    }
    var minGap=gaps.length?Math.min.apply(null,gaps.map(function(x){return parseFloat(x.cells[1]);})):0;
    return {
      head:[
        {l:'衝突（干渉の可能性）', v:String(hits.length), u:'件', tone:hits.length===0?'ok':'bad',
         n:hits.length===0?'検査した '+prods.length+' 積すべてで干渉なし':'周波数の見直しを推奨'},
        {l:'検査した IM 積', v:String(prods.length), u:'通り'},
        {l:'使用チャンネル数', v:String(list.length), u:'ch'},
        {l:'最小チャンネル間隔', v:fd(minGap,0), u:'kHz', tone:minGap>=250?'ok':(minGap>=125?'warn':'bad')}
      ],
      steps:steps,
      tables:[].concat(
        hits.length?[{title:'検出された衝突'+(hits.length>lim?'（干渉の小さい順に '+lim+' 件を表示 / 全 '+hits.length+' 件）':''),
          head:['干渉を受ける ch','次数','IM の組み合わせ','IM 周波数','キャリアとの差'], rows2:trows}]:[],
        [{title:'チャンネル間隔', head:['隣接ペア','間隔'], rows2:gaps}]
      ),
      notes:[
        '等間隔配置は 3次 IM が他チャンネルに直撃するため最も避けるべき配置です。間隔を意図的に不均等にしてください。',
        '実運用では送信機同士を 3 m 以上離す、アンテナ分配器を使う、受信アンテナを送信機から離すといった対策も併用します。',
        'この計算は周波数の関係のみを見ています。実際の干渉レベルは送信出力・距離・アンテナ・受信機の耐性に依存します。',
        '日本では特定ラジオマイク（A型 470〜714 MHz、B型 806〜810 MHz）など、使用可能帯域と免許・登録の要件を確認してください。'
      ]
    };
  }
});

    {k:'mat', label:'導体材質', type:'sel', def:'cu', options:[{v:'cu',t:'銅（ρ = 1/58 Ω·mm²/m）'},{v:'al',t:'アルミ（ρ = 1/35）'}]},
    {k:'pw', label:'アンプ出力（任意）', type:'num', def:'500', unit:'W',
     hint:'入力するとケーブルで消費される電力とスピーカー到達電力を計算します。'},
    {k:'lim', label:'許容する挿入損失', type:'num', def:'0.5', unit:'dB',
     hint:'一般的な目安は 0.5 dB（線路抵抗が負荷の約 6% 以下）。'}
  ],
  compute:function(v){
    var L=reqPos(v.len,'こう長'), A=reqPos(v.area,'電線サイズ'), Z=reqPos(v.z,'負荷インピーダンス');
    var rho=(v.mat==='al')?RHO_AL:RHO_CU, rn=(v.mat==='al')?'1/35':'1/58';
    var steps=[];
    var R=2*L*rho/A;
    steps.push({l:'線路抵抗（往復）を求める', f:'R = 2 × L × ρ / A',
      s:'R = 2 × '+fx(L)+' m × ('+rn+') / '+fx(A)+' mm²', r:'R = '+fx(R,4)+' Ω',
      n:'スピーカーケーブルは往復2本ぶんの抵抗が効くため、こう長を 2 倍します。'});
    var ratio=R/Z*100;
    steps.push({l:'負荷に対する線路抵抗の割合', f:'R / Z × 100', s:'('+fx(R,4)+' / '+fx(Z)+') × 100', r:fd(ratio,2)+' %'});
    var loss=-20*LOG10(Z/(Z+R));
    steps.push({l:'挿入損失（定電圧駆動を前提）', f:'L_{loss} = −20 log_{10}( Z / (Z + R) )',
      s:'L_{loss} = −20 log_{10}( '+fx(Z)+' / ('+fx(Z)+' + '+fx(R,4)+') )', r:'L_{loss} = '+fd(loss,3)+' dB',
      n:'アンプは定電圧源として動作するため、線路抵抗が入ると負荷にかかる電圧が分圧されて下がります。'});
    var df=Z/R;
    steps.push({l:'ケーブルによるダンピングファクタの上限', f:'DF = Z / R',
      s:'DF = '+fx(Z)+' / '+fx(R,4), r:'DF = '+fd(df,1),
      n:'アンプの出力インピーダンスが 0 でも、ケーブル抵抗だけでこの値が上限になります。DF 20 以上あれば低域の制動は実用上問題ありません。'});
    var lim=opt(v.lim,0.5);
    var ok=loss<=lim;
    steps.push({l:'許容損失との照合', f:'L_{loss} ≤ 許容値',
      s:fd(loss,3)+' dB  '+(ok?'≤':'>')+'  '+fx(lim)+' dB', r:ok?'OK':'NG（電線を太くするか、こう長を短くしてください）'});
    // 必要断面積の逆算
    var rAllow=Z*(Math.pow(10,lim/20)-1);
    var aNeed=2*L*rho/rAllow;
    steps.push({l:'許容損失を満たす最小断面積を逆算する',
      f:'R_{許容} = Z × (10^{(L_{許容}/20)} − 1),   A_{必要} = 2 L ρ / R_{許容}',
      s:'R_{許容} = '+fx(Z)+' × (10^{('+fx(lim)+'/20)} − 1) = '+fx(rAllow,4)+' Ω\nA_{必要} = 2 × '+fx(L)+' × ('+rn+') / '+fx(rAllow,4),
      r:'A_{必要} = '+fx(aNeed,3)+' mm² 以上'});
    var head=[
      {l:'挿入損失', v:fd(loss,2), u:'dB', tone:ok?'ok':'bad', n:'許容 '+fx(lim)+' dB に対し '+(ok?'合格':'超過')},
      {l:'線路抵抗（往復）', v:fx(R,4), u:'Ω', n:'負荷の '+fd(ratio,1)+'%'},
      {l:'ダンピングファクタ上限', v:fd(df,0), u:'', tone:df>=20?'ok':'warn'},
      {l:'必要な最小断面積', v:fx(aNeed,3), u:'mm²', n:'損失 '+fx(lim)+' dB 以内にする場合'}
    ];
    var pw=opt(v.pw,NaN);
    if(isFinite(pw)&&pw>0){
      var pLoss=pw*R/(Z+R), pSp=pw-pLoss;
      steps.push({l:'電力の配分', f:'P_{ケーブル} = P × R / (Z + R),   P_{SP} = P − P_{ケーブル}',
        s:'P_{ケーブル} = '+fx(pw)+' × '+fx(R,4)+' / ('+fx(Z)+' + '+fx(R,4)+')',
        r:'P_{ケーブル} = '+fx(pLoss,4)+' W,  P_{SP} = '+fx(pSp,4)+' W（'+fd(pSp/pw*100,1)+'%）'});
      head.push({l:'ケーブルでの損失電力', v:fx(pLoss,3), u:'W', n:'スピーカー到達 '+fx(pSp,4)+' W'});
    }
    // 早見表
    var trows=[];
    for(var i=0;i<WIRE_SORTED.length;i++){
      var ai=WIRE_SORTED[i].a, ri=2*L*rho/ai, li=-20*LOG10(Z/(Z+ri));
      trows.push({cells:[wireShort(WIRE_SORTED[i]), fx(ai,3)+' mm²', fx(ri,4)+' Ω', fd(li,3)+' dB', fd(Z/ri,1)], tone:li<=lim?'ok':'bad'});
    }
    return {head:head, steps:steps,
      tables:[{title:'こう長 '+fx(L)+' m・負荷 '+fx(Z)+' Ω における電線サイズ別の比較（断面積の昇順）', head:['電線サイズ','断面積','線路抵抗','挿入損失','DF 上限'], rows2:trows}],
      notes:[
        '100 V ハイインピーダンス配線では同じこう長でも損失が桁違いに小さくなります。長距離はハイインピーダンス配線を検討してください。',
        'この計算は直流抵抗のみを扱っています。可聴帯域では表皮効果・インダクタンスの影響は通常無視できます。',
        '温度が上がると銅の抵抗も増えます（約 0.4%/℃）。高温環境では余裕をみてください。'
      ]};
  }
});

AUDIO.push({
  id:'net-audio', cat:'audio', title:'ネットワークオーディオ 帯域計算',
  sub:'Dante / AES67 などのチャンネル数・サンプルレートから、パケットオーバーヘッドを含む実効帯域を求めます。',
  inputs:[
    {k:'ch', label:'チャンネル数', type:'num', def:'64'},
    {k:'sr', label:'サンプリング周波数', type:'sel', def:'48000', options:[
      {v:'44100',t:'44.1 kHz'},{v:'48000',t:'48 kHz'},{v:'96000',t:'96 kHz'},{v:'192000',t:'192 kHz'}]},
    {k:'bits', label:'ビット深度', type:'sel', def:'24', options:[{v:'16',t:'16 bit'},{v:'24',t:'24 bit'},{v:'32',t:'32 bit'}]},
    {k:'pt', label:'パケット周期（レイテンシ設定）', type:'sel', def:'1', options:[
      {v:'0.25',t:'0.25 ms（Dante 最小レイテンシ）'},{v:'0.5',t:'0.5 ms'},{v:'1',t:'1 ms（標準）'},
      {v:'2',t:'2 ms'},{v:'5',t:'5 ms（AES67 標準）'}]},
    {k:'cpf', label:'1フローあたりのチャンネル数', type:'num', def:'8',
     hint:'Dante のユニキャストフローは通常最大 4ch、マルチキャストは 8ch 程度。フロー数が増えるとヘッダのオーバーヘッドも増えます。'},
    {k:'link', label:'リンク速度', type:'sel', def:'1000', options:[
      {v:'100',t:'100 Mbps'},{v:'1000',t:'1 Gbps'},{v:'10000',t:'10 Gbps'}]}
  ],
  compute:function(v){
    var ch=Math.round(reqPos(v.ch,'チャンネル数')), sr=reqPos(v.sr,'サンプリング周波数');
    var bits=reqPos(v.bits,'ビット深度'), pt=reqPos(v.pt,'パケット周期'), cpf=Math.round(reqPos(v.cpf,'1フローあたりのチャンネル数'));
    var link=reqPos(v.link,'リンク速度');
    var steps=[];
    var payloadRate=ch*sr*bits;
    steps.push({l:'音声データそのものの伝送レート', f:'R_{音声} = ch × f_{s} × bit',
      s:'R_{音声} = '+ch+' × '+fx(sr,6)+' × '+fx(bits), r:'R_{音声} = '+fd(payloadRate/1e6,3)+' Mbps',
      n:'これはヘッダを含まない純粋な音声データ量です。実際のネットワーク負荷はこれより大きくなります。'});
    var spp=Math.round(sr*pt/1000);
    if(spp<1) spp=1;
    steps.push({l:'1パケットに載るサンプル数', f:'N_{sample} = f_{s} × T_{packet} / 1000',
      s:'N_{sample} = '+fx(sr,6)+' × '+fx(pt)+' / 1000', r:'N_{sample} = '+spp+' サンプル'});
    var flows=Math.ceil(ch/cpf);
    steps.push({l:'必要なフロー数', f:'N_{flow} = ⌈ ch / ch_{per flow} ⌉',
      s:'N_{flow} = ⌈ '+ch+' / '+cpf+' ⌉', r:'N_{flow} = '+flows+' フロー'});
    var lastCh=ch-(flows-1)*cpf;
    var payloadBytes=cpf*spp*bits/8;
    steps.push({l:'1パケットのペイロード長', f:'B_{payload} = ch_{per flow} × N_{sample} × bit / 8',
      s:'B_{payload} = '+cpf+' × '+spp+' × '+fx(bits)+' / 8', r:'B_{payload} = '+fd(payloadBytes,0)+' byte'});
    var OH=78; // 14 Eth + 4 FCS + 20 preamble/IFG + 20 IP + 8 UDP + 12 RTP
    steps.push({l:'1パケットのオーバーヘッド', f:'B_{OH} = Ethernet(14) + FCS(4) + プリアンブル/IFG(20) + IP(20) + UDP(8) + RTP(12)',
      s:'B_{OH} = 14 + 4 + 20 + 20 + 8 + 12', r:'B_{OH} = '+OH+' byte',
      n:'パケット周期を短く（低レイテンシに）するほどパケット数が増え、このオーバーヘッドの比率が上がります。'});
    var pps=1000/pt;
    var frameBytes=payloadBytes+OH;
    var perFlow=frameBytes*8*pps;
    steps.push({l:'1フローあたりの回線占有', f:'R_{flow} = (B_{payload} + B_{OH}) × 8 × (1000 / T_{packet})',
      s:'R_{flow} = ('+fd(payloadBytes,0)+' + '+OH+') × 8 × '+fd(pps,0),
      r:'R_{flow} = '+fd(perFlow/1e6,3)+' Mbps（'+fd(pps,0)+' パケット/秒）'});
    // 最終フローは端数チャンネル
    var lastPayload=lastCh*spp*bits/8;
    var total=perFlow*(flows-1)+(lastPayload+OH)*8*pps;
    steps.push({l:'全フローの合計', f:'R_{合計} = R_{flow} × (N_{flow} − 1) + R_{最終フロー}',
      s:'R_{合計} = '+fd(perFlow/1e6,3)+' × '+(flows-1)+' + '+fd((lastPayload+OH)*8*pps/1e6,3)+'（最終フローは '+lastCh+'ch）',
      r:'R_{合計} = '+fd(total/1e6,2)+' Mbps'});
    var util=total/(link*1e6)*100;
    steps.push({l:'リンク使用率', f:'使用率 = R_{合計} / リンク速度 × 100',
      s:'使用率 = '+fd(total/1e6,2)+' / '+fx(link)+' × 100', r:'使用率 = '+fd(util,1)+' %'});
    var oh=(total-payloadRate)/payloadRate*100;
    var tone2=util<50?'ok':(util<70?'warn':'bad');
    var trows=[];
    var chs=[8,16,32,64,128,256,512];
    for(var i=0;i<chs.length;i++){
      var fl=Math.ceil(chs[i]/cpf), lc=chs[i]-(fl-1)*cpf;
      var tt=(cpf*spp*bits/8+OH)*8*pps*(fl-1)+(lc*spp*bits/8+OH)*8*pps;
      trows.push({cells:[chs[i]+' ch', fl+' フロー', fd(tt/1e6,1)+' Mbps', fd(tt/(link*1e6)*100,1)+' %'],
        tone:tt/(link*1e6)*100<50?'ok':(tt/(link*1e6)*100<70?'warn':'bad')});
    }
    return {
      head:[
        {l:'実効帯域（ヘッダ込み）', v:fd(total/1e6,1), u:'Mbps'},
        {l:'リンク使用率', v:fd(util,1), u:'%', tone:tone2, n:fx(link)+' Mbps に対して'},
        {l:'音声データのみ', v:fd(payloadRate/1e6,1), u:'Mbps', n:'オーバーヘッド +'+fd(oh,1)+'%'},
        {l:'パケットレート', v:fd(pps*flows,0), u:'pps', n:flows+' フロー合計'},
        {l:'片方向レイテンシ（パケット化ぶん）', v:fx(pt), u:'ms'}
      ],
      steps:steps,
      tables:[{title:'チャンネル数別の帯域（f_s = '+fx(sr/1000)+' kHz、周期 '+fx(pt)+' ms）', head:['ch 数','フロー数','実効帯域','使用率'], rows2:trows}],
      notes:[
        'ネットワークオーディオではリンク使用率を 50〜70% 以下に抑えるのが設計の目安です。バーストや制御トラフィックの余地を残してください。',
        'Dante では QoS（DSCP）設定が必須です。PTP 同期パケットを最優先（DSCP 56）、音声を次点（DSCP 46）に設定します。',
        'マルチキャストを使う場合は IGMP Snooping を有効にし、不要なポートへのフラッディングを防いでください。',
        'エンドツーエンドの実レイテンシには、この値に加えてスイッチのホップ遅延・機器の A/D・D/A 変換遅延が加わります。'
      ]
    };
  }
});

var TELE = [];

TELE.push({
  id:'fiber-budget', cat:'tele', title:'光ファイバー 損失予算',
  sub:'距離・接続点・融着点の損失を積み上げ、送信出力と受信感度に対する余裕（マージン）を求めます。',
  inputs:[
    {k:'ftype', label:'ファイバー / 波長', type:'sel', def:'0.35', options:[
      {v:'0.35',t:'SM 1310 nm（0.35 dB/km・メーカー代表値）'},
      {v:'0.22',t:'SM 1550 nm（0.22 dB/km・メーカー代表値）'},
      {v:'0.40',t:'SM 1310 nm（0.40 dB/km・ITU-T G.652.D 規格上限）'},
      {v:'0.30',t:'SM 1550 nm（0.30 dB/km・ITU-T G.652.D 規格上限）'},
      {v:'3.0',t:'MM 850 nm（3.0 dB/km・代表値）'},{v:'1.0',t:'MM 1300 nm（1.0 dB/km・代表値）'},
      {v:'3.5',t:'MM 850 nm（3.5 dB/km・OM3/OM4 規格上限）'},{v:'1.5',t:'MM 1300 nm（1.5 dB/km・OM3/OM4 規格上限）'},
      {v:'custom',t:'任意'}],
     hint:'設計の裏取りには規格上限（G.652.D：1310 nm 0.4、1550 nm 0.3 dB/km／OM3・OM4：850 nm 3.5、1300 nm 1.5 dB/km）を使うと安全側になります。'},
    {k:'fdb', label:'ファイバー損失（任意指定）', type:'num', def:'0.35', unit:'dB/km', step:'any', show:function(v){return v.ftype==='custom';}},
    {k:'len', label:'こう長', type:'num', def:'2.5', unit:'km', step:'any'},
    {k:'nc', label:'コネクタ接続点数', type:'num', def:'4'},
    {k:'lc', label:'コネクタ1点あたりの損失', type:'num', def:'0.5', unit:'dB', step:'any',
     hint:'一般的な SC / LC コネクタで 0.3〜0.75 dB。規格上の最大値は 0.75 dB。'},
    {k:'ns', label:'融着接続点数', type:'num', def:'2'},
    {k:'ls', label:'融着1点あたりの損失', type:'num', def:'0.1', unit:'dB', step:'any'},
    {k:'split', label:'分岐・その他の損失', type:'num', def:'0', unit:'dB', step:'any',
     hint:'光スプリッタなど。1:2 で約 3.5 dB、1:4 で約 7.2 dB、1:8 で約 10.5 dB。'},
    {k:'marg', label:'保守マージン', type:'num', def:'3', unit:'dB', step:'any',
     hint:'将来の再融着・経年劣化に備えた余裕。一般に 3 dB を確保します。'},
    {k:'tx', label:'送信出力', type:'num', def:'-8', unit:'dBm', step:'any'},
    {k:'rx', label:'受信感度（最小）', type:'num', def:'-28', unit:'dBm', step:'any'},
    {k:'rxmax', label:'受信最大入力（任意）', type:'num', def:'-3', unit:'dBm', step:'any',
     hint:'短距離では光が強すぎて飽和することがあります。入力すると過入力もチェックします。'}
  ],
  compute:function(v){
    var fdb=(v.ftype==='custom')?reqPos(v.fdb,'ファイバー損失'):Number(v.ftype);
    var L=reqPos(v.len,'こう長'), steps=[];
    var lFiber=fdb*L;
    steps.push({l:'ファイバー自体の損失', f:'L_{fiber} = α × 距離', s:'L_{fiber} = '+fx(fdb)+' dB/km × '+fx(L)+' km', r:'L_{fiber} = '+fd(lFiber,3)+' dB'});
    var nc=Math.round(opt(v.nc,0)), lc=opt(v.lc,0), lConn=nc*lc;
    steps.push({l:'コネクタ接続による損失', f:'L_{conn} = 接続点数 × 1点あたりの損失', s:'L_{conn} = '+nc+' × '+fx(lc), r:'L_{conn} = '+fd(lConn,3)+' dB',
      n:'パッチパネルを1段通るごとに2点（接続の入口と出口）を数えます。数え漏れが最も多い箇所です。'});
    var ns=Math.round(opt(v.ns,0)), ls=opt(v.ls,0), lSpl=ns*ls;
    steps.push({l:'融着接続による損失', f:'L_{splice} = 融着点数 × 1点あたりの損失', s:'L_{splice} = '+ns+' × '+fx(ls), r:'L_{splice} = '+fd(lSpl,3)+' dB'});
    var sp=opt(v.split,0), mg=opt(v.marg,0);
    var totalNoMarg=lFiber+lConn+lSpl+sp;
    var total=totalNoMarg+mg;
    steps.push({l:'総損失を積み上げる', f:'L_{総} = L_{fiber} + L_{conn} + L_{splice} + L_{分岐} + マージン',
      s:'L_{総} = '+fd(lFiber,3)+' + '+fd(lConn,3)+' + '+fd(lSpl,3)+' + '+fd(sp,3)+' + '+fd(mg,3),
      r:'L_{総} = '+fd(total,2)+' dB（マージンを除くと '+fd(totalNoMarg,2)+' dB）'});
    var tx=req(v.tx,'送信出力'), rx=req(v.rx,'受信感度');
    var budget=tx-rx;
    steps.push({l:'システムが許容できる損失（リンクバジェット）', f:'L_{許容} = P_{tx} − P_{rx(min)}',
      s:'L_{許容} = ('+fx(tx)+') − ('+fx(rx)+')', r:'L_{許容} = '+fd(budget,2)+' dB'});
    var margin=budget-total;
    steps.push({l:'余裕を求める', f:'余裕 = L_{許容} − L_{総}',
      s:'余裕 = '+fd(budget,2)+' − '+fd(total,2)+' dB', r:'余裕 = '+fd(margin,2)+' dB',
      n:margin>=0?'正の値なので伝送可能です。':'不足しています。距離短縮、接続点削減、または高出力/高感度な光モジュールへの変更が必要です。'});
    var prx=tx-totalNoMarg;
    steps.push({l:'受信端に届く光レベル（マージンを除く実力値）', f:'P_{受信} = P_{tx} − L_{総(マージン除く)}',
      s:'P_{受信} = '+fx(tx)+' − '+fd(totalNoMarg,2), r:'P_{受信} = '+fd(prx,2)+' dBm'});
    var head=[
      {l:'総損失', v:fd(total,2), u:'dB', n:'マージン '+fx(mg)+' dB を含む'},
      {l:'リンクバジェット', v:fd(budget,2), u:'dB'},
      {l:'余裕', v:(margin>=0?'+':'')+fd(margin,2), u:'dB', tone:margin>=3?'ok':(margin>=0?'warn':'bad'),
       n:margin>=3?'十分':(margin>=0?'ぎりぎり — 施工品質に注意':'不足 — 構成の見直しが必要')},
      {l:'受信レベル', v:fd(prx,2), u:'dBm'}
    ];
    var rxmax=opt(v.rxmax,NaN);
    if(isFinite(rxmax)){
      var over=prx>rxmax;
      steps.push({l:'過入力の確認', f:'P_{受信} ≤ P_{rx(max)} であること',
        s:fd(prx,2)+' dBm  '+(over?'>':'≤')+'  '+fx(rxmax)+' dBm',
        r:over?'NG（過入力 — 光アッテネータの挿入が必要）':'OK（飽和しない）',
        n:over?'必要な減衰量は約 '+fd(prx-rxmax,1)+' dB です。':''});
      head.push({l:'過入力判定', v:over?'要ATT':'OK', u:'', tone:over?'bad':'ok', n:over?'約 '+fd(prx-rxmax,0)+' dB の減衰が必要':'受信最大入力 '+fx(rxmax)+' dBm 以内'});
    }
    return {head:head, steps:steps,
      tables:[{title:'損失の内訳', head:['項目','数量','単価','損失'], rows:[
        ['ファイバー', fx(L)+' km', fx(fdb)+' dB/km', fd(lFiber,3)+' dB'],
        ['コネクタ接続', nc+' 点', fx(lc)+' dB/点', fd(lConn,3)+' dB'],
        ['融着接続', ns+' 点', fx(ls)+' dB/点', fd(lSpl,3)+' dB'],
        ['分岐・その他', '—', '—', fd(sp,3)+' dB'],
        ['保守マージン', '—', '—', fd(mg,3)+' dB'],
        ['合計', '', '', fd(total,3)+' dB']
      ]}],
      notes:[
        '施工後は必ず OTDR または光パワーメータで実測し、計算値と照合してください。差が大きい場合は融着不良・曲げ・汚れを疑います。',

/* 損失係数 k：α[dB/100m] = k × √f[MHz]。
   k はカタログ／規格の減衰量を基準周波数で割って求めた値（k = α / √f）。
   出典 —
     同軸: カナレ電気「同軸ケーブルの標準減衰量」(750 MHz)、
           electric-facilities.jp「同軸ケーブル」(770 MHz)、Belden 8259 / 8267 技術資料 (100〜400 MHz)。
     UTP: ANSI/TIA-568 ケーブル単体の最大挿入損失（Cat5e=22.0 dB/100m@100MHz、
           Cat6=32.7@250MHz、Cat6A=45.3@500MHz）。各カテゴリの上限周波数で合わせているため
           安全側（低い周波数では実測よりやや大きめに出る）。 */
var CABLE_TYPES = [
  {v:'5D-2V', t:'5D-2V（50Ω 同軸）',       k:0.90},
  /* 3C-2V の k=1.40 は出典（40 dB/100m @750MHz → 1.461）と 4.3% 合わない。カタログで確認するまで据え置き、
     選択時と表示時に warn の注記を出す（引継書 §5-3） */
  {v:'3C-2V', t:'3C-2V（75Ω 同軸）',       k:1.40,
   warn:'3C-2V の損失係数 k = 1.40 は、出典の値（40 dB/100m @750 MHz → k ≈ 1.46）と約 4% 合わず、カタログで確認中です。損失を小さめ（＝伝送距離を長め）に見積もっている可能性があるため、限界付近の設計ではメーカーの減衰量表で確認してください。'},
  {v:'5C-2V', t:'5C-2V（75Ω 同軸）',       k:0.98},
  {v:'S-5C-FB',t:'S-5C-FB（75Ω 発泡同軸）',k:0.68},
  {v:'S-7C-FB',t:'S-7C-FB（75Ω 発泡同軸）',k:0.50},
  {v:'RG-58', t:'RG-58（50Ω）',            k:1.61},
  {v:'RG-6',  t:'RG-6（75Ω）',             k:0.70},
  {v:'RG-213',t:'RG-213（50Ω）',           k:0.67},
  {v:'Cat5e', t:'Cat5e UTP',               k:2.20},
  {v:'Cat6',  t:'Cat6 UTP',                k:2.07},
  {v:'Cat6A', t:'Cat6A UTP',               k:2.03}
];
function cableBy(v){ for(var i=0;i<CABLE_TYPES.length;i++) if(CABLE_TYPES[i].v===v) return CABLE_TYPES[i]; return null; }

TELE.push({

      notes:(ctd&&ctd.warn?['⚠ '+ctd.warn]:[]).concat([

        'UTP ケーブルは誘電体損の影響で高域では √f より損失がやや大きくなります。Cat6 の 250 MHz 超では特に誤差が出ます。',
        'テレビ共聴設備では、最遠端で規定の受信レベル（BS/CS で 47〜81 dBμV 程度）が確保できるか確認してください。',
        '温度が上がると損失も増えます（同軸で概ね +0.2%/℃）。屋外配管など高温になる経路では余裕をみてください。',
        '損失係数 k の出典：同軸はカナレ電気「同軸ケーブルの標準減衰量」(750 MHz) と electric-facilities.jp の減衰量表 (770 MHz)、RG 系は Belden 8259 / 8267 の技術資料。UTP は ANSI/TIA-568 のケーブル単体最大挿入損失（Cat5e 22.0 dB/100m @100 MHz、Cat6 32.7 @250 MHz、Cat6A 45.3 @500 MHz）。',
        '√f 近似は誘電体損を無視しているため、基準周波数から離れるほど誤差が出ます。同軸では高い周波数側で実測より小さめ（＝危険側）に出るので、BS/CS-IF 帯（1〜2.6 GHz）の設計ではメーカーの周波数別表で必ず確認してください。'
      ])};
  }
});

TELE.push({

  inputs:[
    {k:'sys', label:'配電方式', type:'sel', def:'1p2w', options:[

    {k:'i', label:'負荷電流', type:'num', def:'20', unit:'A', step:'any'},
    {k:'len', label:'こう長（片道）', type:'num', def:'40', unit:'m'},

    {k:'volt', label:'公称電圧', type:'num', def:'100', unit:'V', step:'any'},
    {k:'supply', label:'供給の区分', type:'sel', def:'util', options:[

      {v:'own', t:'電気使用場所内に設けた変圧器から供給する場合'}],
     hint:'内線規程 1310-1 表は、こう長が 60 m を超えるときの緩和値をこの2区分で分けています。'},
    {k:'lim', label:'許容電圧降下', type:'sel', def:'auto', options:[
      {v:'auto',t:'自動（内線規程 1310-1 表・こう長から判定）'},
      {v:'2',t:'2%（幹線・分岐回路それぞれの原則値）'},{v:'3',t:'3%'},{v:'4',t:'4%'},
      {v:'5',t:'5%'},{v:'6',t:'6%'},{v:'7',t:'7%'}],
     hint:'原則は幹線・分岐回路それぞれ標準電圧の 2% 以下。こう長 60 m 超では 1310-1 表により緩和されます（この値は幹線＋分岐の合計に対する値です）。'}
  ],
  compute:function(v){
    var I=req(v.i,'負荷電流'), L=reqPos(v.len,'こう長'), A=reqPos(v.area,'電線サイズ');
    var V=reqPos(v.volt,'公称電圧'), steps=[];
    var K={'1p2w':35.6,'1p3w':17.8,'3p3w':30.8}[v.sys];
    var KN={'1p2w':'単相2線式','1p3w':'単相3線式','3p3w':'三相3線式'}[v.sys];
    var e1=null;
    if(v.mat==='cu'){
      e1=K*L*I/(1000*A);
      steps.push({l:'内線規程の簡易式で求める（'+KN+'・銅）', f:'e = '+K+' × L × I / (1000 × A)',
        s:'e = '+K+' × '+fx(L)+' × '+fx(I)+' / (1000 × '+fx(A)+')', r:'e = '+fd(e1,3)+' V',
        n:'この係数は導体の抵抗率 ρ ≒ 1/56.2 Ω·mm²/m を前提にした銅線用の値です。アルミには使えません。'});
    } else {
      steps.push({l:'簡易式は使えません', f:'—', s:'アルミ導体のため、内線規程の簡易式（銅前提）は適用しません。', r:'抵抗法で計算します'});
    }
    var rho=(v.mat==='al')?RHO_AL:RHO_CU, rn=(v.mat==='al')?'1/35':'1/58';

    /* 係数 k は簡易式の K と整合させる（K = k × 1000 × ρ_規程, ρ_規程 ≒ 1/56.2）:
         単相2線 K=35.6 → k=2（往復2線）

    var kf=(v.sys==='3p3w')?Math.sqrt(3):((v.sys==='1p3w')?1:2);
    var kfName=(v.sys==='3p3w')?'√3（三相3線式）':((v.sys==='1p3w')?'1（単相3線式・平衡時、電圧線1本ぶん）':'2（往復2線ぶん）');
    var e2=kf*I*R;
    steps.push({l:'抵抗法で電圧降下を求める', f:'e = k × I × R,   k = '+kfName,

      n:(v.sys==='1p3w')?'単相3線式は負荷が平衡していれば中性線に電流が流れないため、中性線−電圧線間の降下は電圧線1本ぶん（k=1）です。簡易式の係数 17.8 もこの平衡時の値です。不平衡があると中性線にも電流が流れ、降下はこれより大きくなります。':''});
    var e=(e1!==null)?e1:e2;
    var pct=e/V*100;
    /* 内線規程 1310-1 表（供給変圧器の二次側端子または引込線取付点から最遠端の負荷までのこう長）
         こう長          電気事業者から低圧供給   構内変圧器から供給
         60 m 以下       2%（幹線・分岐 各々）    幹線 3% / 分岐 2%
         60 超 120 以下  4%                       5%

       出典: 内線規程 JEAC 8001 1310-1。旧版の notes は 4/5/6% を「構内変圧器の場合」と

    var own=(v.supply==='own');

                    : ('こう長 '+fx(L)+' m → 1310-1 表の緩和値 '+limAuto+'%（幹線＋分岐の合計）');
    var lim=(v.lim==='auto'||v.lim===undefined||v.lim==='')?limAuto:opt(v.lim,limAuto);
    steps.push({l:'電圧降下率', f:'降下率 = e / V × 100', s:'降下率 = '+fd(e,3)+' / '+fx(V)+' × 100', r:'降下率 = '+fd(pct,3)+' %'});
    steps.push({l:'許容値を決める（内線規程 1310-1 表）',
      f:'こう長と供給区分から許容電圧降下を選ぶ',
      s:(own?'電気使用場所内の変圧器から供給':'電気事業者から低圧で供給')+'　/　'+limAutoNote,
      r:'許容電圧降下 = '+fx(lim)+' %'+((v.lim!=='auto')?'（手動指定。自動判定では '+limAuto+' %）':''),
      n:'この表はこう長 60 m 超で適用する緩和値です。60 m 以下は幹線・分岐それぞれ 2%（構内変圧器の場合は幹線 3%）が原則です。'});
    var ok=pct<=lim;

    // 逆算

    steps.push({l:'現在のこう長で必要な最小断面積', f:'A_{必要} = '+(e1!==null?(K+' × L × I / (1000 × e_{許容})'):'k × I × ρ × L / e_{許容}'),

    }

        {l:'末端電圧', v:fd(V-e,2), u:'V'},
        {l:'必要な最小断面積', v:fx(needA,3), u:'mm²', n:pick?('選定 → '+pick.t):'標準サイズを超えています'},

        '幹線と分岐回路の両方で降下が発生します。60 m 超の緩和値は両者の合計に対する値なので、幹線だけで使い切らないよう配分してください。',

});

/* 基準許容電流（周囲温度30℃、がいし引き工事）。電技解釈第146条／内線規程1340-1表。
   2026-08 に IV 電線許容電流表（電線ケーブル販売センター）と突き合わせ、全値一致を確認。 */
var AMP_SOLID = [{s:'1.6 mm',a:27},{s:'2.0 mm',a:35},{s:'2.6 mm',a:48},{s:'3.2 mm',a:62}];
var AMP_STRAND = [{s:'2 mm²',a:27},{s:'3.5 mm²',a:37},{s:'5.5 mm²',a:49},{s:'8 mm²',a:61},
  {s:'14 mm²',a:88},{s:'22 mm²',a:115},{s:'38 mm²',a:162},{s:'60 mm²',a:217},{s:'100 mm²',a:298}];

TELE.push({
  id:'ampacity', cat:'tele', title:'電線の許容電流',
  sub:'内線規程の基準許容電流に、同一管内条数による電流減少係数と周囲温度補正をかけて実効値を求めます。',
  inputs:[
    {k:'kind', label:'電線の種別', type:'sel', def:'strand', options:[
      {v:'strand',t:'より線（IV：2 mm² 〜）'},{v:'solid',t:'単線（IV：1.6 mm 〜）'}]},
    {k:'size', label:'サイズ', type:'sel', def:'5.5 mm²', options:[], dyn:function(v){
      var src=(v.kind==='solid')?AMP_SOLID:AMP_STRAND;
      return src.map(function(x){return {v:x.s, t:x.s+'（基準 '+x.a+' A）'};});
    }},
    {k:'n', label:'同一管内の電線条数', type:'num', def:'3',
     hint:'接地線と中性線を除いた電流を流す電線の本数。単相2線なら2条、三相3線なら3条。'},
    {k:'temp', label:'周囲温度', type:'num', def:'30', unit:'℃', step:'any',
     hint:'30℃ 以下なら補正なし。天井裏・盤内など高温になる箇所では実測値を使ってください。'},
    {k:'load', label:'負荷電流（任意）', type:'num', def:'25', unit:'A', step:'any'}
  ],
  compute:function(v){
    var src=(v.kind==='solid')?AMP_SOLID:AMP_STRAND, base=null, sname=v.size;
    for(var i=0;i<src.length;i++) if(src[i].s===sname) base=src[i].a;
    if(base===null){ base=src[0].a; sname=src[0].s; }
    var steps=[];
    steps.push({l:'基準許容電流を表から読む', f:'内線規程 1340-1 表（600V ビニル絶縁電線、がいし引き、周囲温度 30℃）',
      s:sname+' の値を参照', r:'I_{基準} = '+base+' A'});
    var n=Math.round(reqPos(v.n,'同一管内の電線条数'));
    var kn, knNote;
    if(n<=3){ kn=0.70; knNote='3本以下'; }
    else if(n===4){ kn=0.63; knNote='4本'; }
    else if(n<=6){ kn=0.56; knNote='5〜6本'; }
    else if(n<=15){ kn=0.49; knNote='7〜15本'; }
    else if(n<=40){ kn=0.43; knNote='16〜40本'; }
    else if(n<=60){ kn=0.39; knNote='41〜60本'; }
    else { kn=0.34; knNote='61本以上'; }
    steps.push({l:'電流減少係数を求める', f:'管内に複数条を収めると放熱が悪化するため係数をかける',
      s:'同一管内 '+n+' 条 → '+knNote+' の区分', r:'電流減少係数 = '+fd(kn,2),
      n:'電線管・線ぴ・ダクトなどに収める場合に適用します。がいし引きなど開放配線では 1.0 です。'});
    var t=req(v.temp,'周囲温度'), kt=1, ktNote='30℃ 以下のため補正なし';
    if(t>30){
      if(t>=60) throw new Error('周囲温度が絶縁物の最高許容温度（60℃）以上です。この条件では使用できません。');
      kt=Math.sqrt((60-t)/30);
      ktNote='k = √((60 − '+fx(t)+') / 30)';
      steps.push({l:'周囲温度補正係数を求める', f:'k_{t} = √( (60 − θ) / 30 )   （絶縁物の最高許容温度 60℃）',
        s:'k_{t} = √( (60 − '+fx(t)+') / 30 )', r:'k_{t} = '+fd(kt,4)});
    } else {
      steps.push({l:'周囲温度補正', f:'周囲温度 30℃ 以下では補正不要', s:'θ = '+fx(t)+' ℃ ≤ 30 ℃', r:'k_{t} = 1.00'});
    }
    var eff=base*kn*kt;
    steps.push({l:'実効許容電流', f:'I_{許容} = I_{基準} × 電流減少係数 × k_{t}',
      s:'I_{許容} = '+base+' × '+fd(kn,2)+' × '+fd(kt,4), r:'I_{許容} = '+fd(eff,2)+' A'});
    var head=[
      {l:'実効許容電流', v:fd(eff,1), u:'A'},
      {l:'基準許容電流', v:String(base), u:'A', n:sname+'（30℃・がいし引き）'},
      {l:'電流減少係数', v:fd(kn,2), u:'', n:n+' 条'},
      {l:'温度補正係数', v:fd(kt,3), u:'', n:ktNote}
    ];
    var load=opt(v.load,NaN);
    if(isFinite(load)){
      var ok=load<=eff;
      steps.push({l:'負荷電流との照合', f:'I_{負荷} ≤ I_{許容}', s:fx(load)+' A  '+(ok?'≤':'>')+'  '+fd(eff,2)+' A',
        r:ok?'OK（'+fd(load/eff*100,1)+'% の使用率）':'NG（許容電流を超えています）'});
      head.unshift({l:'判定', v:ok?'OK':'NG', u:'', tone:ok?(load/eff<=0.8?'ok':'warn'):'bad',
        n:'負荷 '+fx(load)+' A / 許容 '+fd(eff,1)+' A = '+fd(load/eff*100,0)+'%'});
    }
    var trows=[];
    for(var j=0;j<src.length;j++){
      var ej=src[j].a*kn*kt;
      trows.push({cells:[src[j].s, src[j].a+' A', fd(ej,1)+' A'], tone:(isFinite(load)&&load<=ej)?'ok':(isFinite(load)?'bad':'')});
    }
    return {head:head, steps:steps,
      tables:[{title:'サイズ別の実効許容電流（'+n+' 条・'+fx(t)+'℃）', head:['サイズ','基準許容電流','実効許容電流'], rows2:trows}],
      notes:[
        '基準許容電流は内線規程 1340-1 表／電技解釈第 146 条（絶縁電線をがいし引き工事、周囲温度 30℃）の値です。ケーブル工事・地中埋設では別表を参照してください。',
        '電流減少係数（3本以下 0.70／4本 0.63／5〜6本 0.56／7〜15本 0.49／16〜40本 0.43／41〜60本 0.39／61本以上 0.34）は内線規程 1340-2 表。温度補正 k = √((60−θ)/30) は絶縁物の最高許容温度 60℃（IV・600V ビニル絶縁電線）を前提とした式です。HIV（二種ビニル、75℃）や架橋ポリエチレン（90℃）では 60 の部分がそれぞれ 75・90 になります。',
        '幹線の許容電流は電動機の有無で計算方法が変わります（内線規程 1305 節）。',
        '過電流遮断器の定格は許容電流以下とし、かつ負荷を賄える値を選定してください。',
        '許容電流を満たしても電圧降下で不合格になることがあります。両方で確認してください。'
      ]};
  }
});

var CONDUITS = [

  {v:'G36',d:36.9,g:'厚鋼電線管',t:'厚鋼電線管 G36（外径41.9・内径36.9）'},
  {v:'G42',d:42.8,g:'厚鋼電線管',t:'厚鋼電線管 G42（外径47.8・内径42.8）'},
  {v:'G54',d:54.0,g:'厚鋼電線管',t:'厚鋼電線管 G54（外径59.6・内径54.0）'},
  {v:'PF16',d:16.0,g:'PF管',t:'PF管 PF16（内径16.0）'},
  {v:'PF22',d:22.0,g:'PF管',t:'PF管 PF22（内径22.0）'},
  {v:'PF28',d:28.0,g:'PF管',t:'PF管 PF28（内径28.0）'},
  {v:'PF36',d:36.0,g:'PF管',t:'PF管 PF36（内径36.0）'},
  {v:'VE14',d:14.0,g:'VE管',t:'VE管 VE14（外径18・内径14.0）'},
  {v:'VE16',d:18.0,g:'VE管',t:'VE管 VE16（外径22・内径18.0）'},
  {v:'VE22',d:22.0,g:'VE管',t:'VE管 VE22（外径26・内径22.0）'},
  {v:'VE28',d:28.0,g:'VE管',t:'VE管 VE28（外径34・内径28.0）'},
  {v:'VE36',d:35.0,g:'VE管',t:'VE管 VE36（外径42・内径35.0）'},
  {v:'VE42',d:40.0,g:'VE管',t:'VE管 VE42（外径48・内径40.0）'}
];
function conduitBy(v){ for(var i=0;i<CONDUITS.length;i++) if(CONDUITS[i].v===v) return CONDUITS[i]; return null; }
/* IV（600Vビニル絶縁電線）の仕上がり外径。
   出典: 橋本興産「IV電線の仕上外径」、denko-land「電線・ケーブルサイズ一覧表」（2資料で一致を確認）。
   ※ 旧版はより線側が 0.8〜1.5 mm 大きく、単線 2.6/3.2 mm は逆に小さい値が入っていたため修正。 */
var WIRE_OD = [
  {v:'3.2',t:'IV 1.6 mm 単線（外径 3.2 mm）'},{v:'3.6',t:'IV 2.0 mm 単線（3.6）'},
  {v:'4.6',t:'IV 2.6 mm 単線（4.6）'},{v:'5.6',t:'IV 3.2 mm 単線（5.6）'},
  {v:'3.4',t:'IV 2 mm² より線（3.4）'},{v:'4.0',t:'IV 3.5 mm² より線（4.0）'},
  {v:'5.0',t:'IV 5.5 mm² より線（5.0）'},{v:'6.0',t:'IV 8 mm² より線（6.0）'},
  {v:'7.6',t:'IV 14 mm² より線（7.6）'},{v:'9.2',t:'IV 22 mm² より線（9.2）'},
  {v:'11.5',t:'IV 38 mm² より線（11.5）'},{v:'14.0',t:'IV 60 mm² より線（14.0）'},
  {v:'17.0',t:'IV 100 mm² より線（17.0）'},{v:'6.5',t:'UTP Cat6（6.5）'},
  {v:'7.7',t:'同軸 S-5C-FB（7.7）'},{v:'10.2',t:'同軸 S-7C-FB（10.2）'}
];

TELE.push({
  id:'conduit', cat:'tele', title:'電線管 充填率',
  sub:'管の内断面積に対する電線の総断面積の割合を求め、内線規程の基準（32% / 48%）と照合します。',
  inputs:[
    {k:'d', label:'電線管', type:'sel', def:'E25', options:CONDUITS.concat([{v:'custom',t:'任意（内径を直接指定）'}])},
    {k:'dc', label:'管の内径（任意指定）', type:'num', def:'23.0', unit:'mm', step:'any', show:function(v){return v.d==='custom';}},
    {k:'wires', label:'収める電線', type:'rows', cols:[
      {k:'od', label:'電線（外径）', type:'sel', def:'5.0', options:WIRE_OD, w:'58%'},
      {k:'n', label:'本数', type:'num', def:'3'}
    ], def:[['5.0','3'],['3.4','2']]},
    {k:'std', label:'適用する基準', type:'sel', def:'32', options:[
      {v:'32',t:'32%（内線規程 3110-1 表・標準）'},
      {v:'48',t:'48%（管が短く屈曲が少なく、引き換えが容易な場合）'},
      {v:'40',t:'40%（NEC Chapter 9 Table 1・電線3本以上）'}]},
    {k:'corr', label:'内線規程 3110-8 表の補正係数', type:'sel', def:'on', options:[
      {v:'on', t:'適用する（細い電線の断面積を割増：推奨）'},
      {v:'off',t:'適用しない（幾何学的な断面積のまま）'}],
     hint:'内線規程は細い絶縁電線について、管サイズ選定時に断面積へ補正係数を乗じることを求めています（1.6/2.0 mm・2 mm² は ×2.0、2.6/3.2 mm・3.5〜8 mm² は ×1.2、14 mm² 以上は ×1.0）。※ 区分の境界は現物の 3110-8 表で必ず確認してください。'}
  ],
  compute:function(v){
    var cd=(v.d==='custom')?null:conduitBy(v.d);
    var D=cd?cd.d:reqPos(v.dc,'管の内径');
    var dname=cd?cd.t:('内径 '+fx(D)+' mm');
    var steps=[];
    var Ain=Math.PI*D*D/4;
    steps.push({l:'電線管の内断面積', f:'A_{管} = π × D² / 4', s:'A_{管} = π × '+fx(D)+'² / 4', r:'A_{管} = '+fd(Ain,2)+' mm²'});
    /* 内線規程 3110-8 表の補正係数（細い電線ほど管内での嵩張り・引き入れ抵抗が大きいため断面積を割増する）。
       出典: 内線規程 JEAC 8001 3110-8 表（区分の境界は現物での確認を推奨＝要保留）。 */
    var useCorr=(v.corr!=='off');
    function corrOf(od){
      if(!useCorr) return 1.0;
      if(od<=3.6) return 2.0;   // IV 1.6 / 2.0 mm 単線、2 mm² より線
      if(od<=6.0) return 1.2;   // IV 2.6 / 3.2 mm 単線、3.5 / 5.5 / 8 mm² より線
      return 1.0;               // 14 mm² 以上
    }
    var rows=v.wires||[], sum=0, cnt=0, terms=[], trows=[], anyCorr=false;
    for(var j=0;j<rows.length;j++){
      var od=opt(rows[j].od,NaN), n=Math.round(opt(rows[j].n,0));
      if(!isFinite(od)||od<=0||n<=0) continue;
      var cf=corrOf(od), a=Math.PI*od*od/4*cf;
      if(cf!==1) anyCorr=true;
      sum+=a*n; cnt+=n;
      terms.push('π×'+fx(od)+'²/4'+(cf!==1?('×'+fd(cf,1)):'')+' × '+n);
      var lbl=fx(od)+' mm';
      for(var m=0;m<WIRE_OD.length;m++) if(WIRE_OD[m].v===String(rows[j].od)) lbl=WIRE_OD[m].t;
      trows.push([lbl, n+' 本', fd(cf,1), fd(a,2)+' mm²', fd(a*n,2)+' mm²']);
    }
    if(!cnt) throw new Error('収める電線を1行以上入力してください。');
    steps.push({l:'電線の総断面積（仕上がり外径で計算）',
      f:'A_{電線} = Σ ( π × d_{i}² / 4 × 補正係数 × 本数 )',
      s:'A_{電線} = '+terms.join(' + '), r:'A_{電線} = '+fd(sum,2)+' mm²（合計 '+cnt+' 本）',
      n:'導体断面積ではなく、絶縁被覆を含む「仕上がり外径」で計算します。'
        +(useCorr?(anyCorr?'　細い電線には内線規程 3110-8 表の補正係数（×2.0 / ×1.2）を乗じています。'
                          :'　補正係数は適用対象外（14 mm² 相当以上）のため 1.0 です。')
                 :'　補正係数は「適用しない」設定です。')});
    var rate=sum/Ain*100, std=Number(v.std);
    steps.push({l:'充填率を求める', f:'充填率 = A_{電線} / A_{管} × 100',
      s:'充填率 = '+fd(sum,2)+' / '+fd(Ain,2)+' × 100', r:'充填率 = '+fd(rate,2)+' %'});
    var ok=rate<=std;
    steps.push({l:'基準との照合', f:'充填率 ≤ '+std+' %', s:fd(rate,2)+' %  '+(ok?'≤':'>')+'  '+std+' %',
      r:ok?'OK（この管に収められます）':'NG（太い管に変更するか、本数を減らしてください）'});
    // 推奨管
    var pick=null, pickAny=null;
    for(var k=0;k<CONDUITS.length;k++){
      var ck=CONDUITS[k], ak=Math.PI*ck.d*ck.d/4;
      if(sum/ak*100>std) continue;
      if(!pickAny||ck.d<pickAny.d) pickAny=ck;
      if(cd&&ck.g===cd.g){ if(!pick||ck.d<pick.d) pick=ck; }
    }
    if(!pick) pick=pickAny;
    steps.push({l:'この電線構成を収められる最小の管', f:'A_{電線} / A_{管} × 100 ≤ '+std+' % を満たす最小サイズ',
      s:'A_{電線} = '+fd(sum,2)+' mm² に対して必要な内断面積 ≧ '+fd(sum*100/std,2)+' mm²',
      r:pick?('→ '+pick.t):'標準サイズでは収まりません（複数本の管に分ける・プルボックスを設ける等を検討）'});
    var maxN=Math.floor(Ain*std/100/(sum/cnt));
    steps.push({l:'この管に収められる本数の上限（平均外径で概算）',
      f:'N_{max} = A_{管} × 基準% / 平均1本あたり断面積',
      s:'N_{max} = '+fd(Ain,2)+' × '+std+'% / '+fd(sum/cnt,2), r:'N_{max} ≒ '+maxN+' 本'});
    return {
      head:[
        {l:'充填率', v:fd(rate,1), u:'%', tone:ok?(rate<=std*0.8?'ok':'warn'):'bad', n:'基準 '+std+'% に対して'},
        {l:'判定', v:ok?'OK':'NG', u:'', tone:ok?'ok':'bad', n:dname},
        {l:'管の内断面積', v:fd(Ain,1), u:'mm²'},
        {l:'電線の総断面積', v:fd(sum,1), u:'mm²', n:cnt+' 本'},
        {l:'収容本数の上限', v:String(maxN), u:'本', n:'現在の電線構成の平均で概算'},
        {l:'推奨サイズ', v:pick?pick.v:'—', u:'', n:pick?pick.t:'標準サイズでは収まりません'}
      ],
      steps:steps,
      tables:[{title:'電線の内訳', head:['電線','本数','補正係数','1本あたり断面積','小計'], rows:trows}],
      notes:[
        '内線規程 3110-1 表：電線管に収める電線の被覆絶縁物を含む断面積の総和は、管の内断面積の 32% 以下とします。',
